<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 奶牛貓 AR 互動美顏濾鏡</title>
  
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
  
  <!-- 引入 MediaPipe 相關相機、人臉與手部偵測模組 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Microsoft JhengHei', sans-serif;
    }

    /* 頂部標題橫幅 */
    #custom-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 105, 180, 0.85);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 互動說明提示橫幅樣式 */
    #interaction-tip {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #ffe6ea;
      padding: 6px 16px;
      border-radius: 15px;
      font-size: 13px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
      animation: pulse-tip 2s infinite;
    }

    @keyframes pulse-tip {
      0% { opacity: 0.8; }
      50% { opacity: 1; transform: translateX(-50%) scale(1.03); }
      100% { opacity: 0.8; }
    }

    /* 控制按鈕介面 */
    #controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 999;
    }

    .btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* 💡 美顏磨皮美膚 + 鏡像翻轉 */
    video, canvas {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) scaleX(-1) !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      filter: brightness(1.18) contrast(0.96) saturate(1.15) blur(0.4px) drop-shadow(0 0 4px rgba(255, 182, 193, 0.4));
    }
  </style>
</head>
<body>

  <div id="custom-banner">🐾 奶牛貓 AR 互動美顏濾鏡</div>
  
  <div id="interaction-tip">✨ 試著「張開嘴巴」、「張開手掌」或「點擊畫面」解鎖驚喜互動！</div>

  <div id="controls">
    <button class="btn" id="record-btn">開始錄影</button>
    <button class="btn" id="snapshot-btn">拍照存檔</button>
  </div>

  <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false">
    <a-assets>
      <!-- 一般狀態 (4部) -->
      <video id="v-normal-1" src="spider_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-normal-2" src="champion_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-normal-3" src="magic_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-normal-4" src="sleep_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      
      <!-- 張開嘴巴 (3部) -->
      <video id="v-mouth-1" src="chef_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-mouth-2" src="eat_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-mouth-3" src="drink_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>

      <!-- 張開手掌 (2部) -->
      <video id="v-hand-1" src="cry_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-hand-2" src="work_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" active="false"></a-camera>

    <a-entity mindar-face-target="anchorIndex: 10">
      <a-video id="cat-video-plane" src="#v-normal-1" position="0 0.5 0" width="1" height="1" rotation="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const animationVideos = {
      normal: ['#v-normal-1', '#v-normal-2', '#v-normal-3', '#v-normal-4'],
      mouthOpen: ['#v-mouth-1', '#v-mouth-2', '#v-mouth-3'],
      handPalm: ['#v-hand-1', '#v-hand-2']
    };

    let currentCategory = 'normal';
    let currentIndex = 0;
    const videoPlane = document.querySelector('#cat-video-plane');

    function switchAnimation(category, index = 0) {
      currentCategory = category;
      currentIndex = index % animationVideos[category].length;
      const targetVideoSelector = animationVideos[category][currentIndex];
      
      document.querySelectorAll('a-assets video').forEach(v => v.pause());
      
      videoPlane.setAttribute('src', targetVideoSelector);
      const activeVideoEl = document.querySelector(targetVideoSelector);
      if (activeVideoEl) {
        activeVideoEl.currentTime = 0;
        activeVideoEl.play().catch(e => console.log("播放被瀏覽器阻擋:", e));
      }
    }

    // 點擊畫面循環切換
    window.addEventListener('click', () => {
      let categories = ['normal', 'mouthOpen', 'handPalm'];
      let catIndex = categories.indexOf(currentCategory);
      
      currentIndex++;
      if (currentIndex >= animationVideos[currentCategory].length) {
        currentIndex = 0;
        catIndex = (catIndex + 1) % categories.length;
      }
      
      switchAnimation(categories[catIndex], currentIndex);
    });

    // 初始化與預載影片
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('a-assets video').forEach(v => {
        v.load();
      });
      switchAnimation('normal', 0);
    });

    // 1. MediaPipe Face Mesh（偵測張開嘴巴）
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults(results => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const upperLip = landmarks[13];
        const lowerLip = landmarks[14];
        const mouthOpenDistance = Math.abs(upperLip.y - lowerLip.y);

        if (mouthOpenDistance > 0.05 && currentCategory !== 'mouthOpen') {
          switchAnimation('mouthOpen', Math.floor(Math.random() * animationVideos.mouthOpen.length));
        }
      }
    });

    // 2. MediaPipe Hands（偵測張開手掌）
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(results => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        // 透過計算手指尖端（指尖 4, 8, 12, 16, 20）與手腕(0)的距離來判斷手掌是否張開
        let extendedFingers = 0;
        const wrist = landmarks[0];
        const tips = [4, 8, 12, 16, 20];
        const pips = [2, 6, 10, 14, 18];

        for (let i = 0; i < 5; i++) {
          // 簡易比較指尖與對應關節到手腕的距離
          const tipDist = Math.hypot(landmarks[tips[i]].x - wrist.x, landmarks[tips[i]].y - wrist.y);
          const pipDist = Math.hypot(landmarks[pips[i]].x - wrist.x, landmarks[pips[i]].y - wrist.y);
          if (tipDist > pipDist * 1.2) {
            extendedFingers++;
          }
        }

        // 當偵測到 4隻或5隻手指伸直（張開手掌）時切換至手掌系列影片
        if (extendedFingers >= 4 && currentCategory !== 'handPalm') {
          switchAnimation('handPalm', Math.floor(Math.random() * animationVideos.handPalm.length));
        }
      }
    });

    // 3. 整合相機串流，同時餵給 FaceMesh 與 Hands 進行雙模組運算
    window.addEventListener('load', () => {
      setTimeout(() => {
        const videoElement = document.querySelector('video');
        if (videoElement) {
          const camera = new Camera(videoElement, {
            onFrame: async () => {
              await faceMesh.send({ image: videoElement });
              await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
          });
          camera.start().catch(e => console.log("相機啟動提示:", e));
        }
      }, 1500);
    });

    // 錄影與拍照功能
    const recordBtn = document.getElementById('record-btn');
    let mediaRecorder;
    let recordedChunks = [];

    recordBtn.addEventListener('click', () => {
      if (recordBtn.innerText === '開始錄影') {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      const arCanvas = document.querySelector('canvas');
      if (!arCanvas) {
        alert("AR 畫面尚未準備好！");
        return;
      }
      
      const stream = arCanvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
      
      recordedChunks = [];
      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ar_cat_beautified_video.webm';
        a.click();
      };

      mediaRecorder.start();
      recordBtn.innerText = '停止錄影';
      recordBtn.style.background = '#ff4757';
    }

    function stopRecording() {
      mediaRecorder.stop();
      recordBtn.innerText = '開始錄影';
      recordBtn.style.background = 'linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%)';
    }

    document.getElementById('snapshot-btn').addEventListener('click', () => {
      const arCanvas = document.querySelector('canvas');
      if (!arCanvas) return;
      
      const link = document.createElement('a');
      link.download = 'ar_cat_snapshot.png';
      link.href = arCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
