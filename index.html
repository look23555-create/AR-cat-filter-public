let arStarted = false;

let faceLandmarks = null;

let handLandmarks = null;

  ★ 重要修改

  不再一開始就是 normal。

  使用 none / waiting，
  等 AR 啟動後直接指定第一支影片。

  這樣「等待狀態」不會阻止第一支影片播放。
*/

let currentState = 'none';


let currentVideo = '';


/*
  一般影片索引

  0 = Spider
  1 = Champion
  2 = Magic
  3 = Sleep
*/

let normalIndex = 0;


let lastProcess = 0;


/*
  防止同時切換兩支影片。

let changingVideo = false;


/* =====================================================

/* =====================================================
   Log
===================================================== */

function log(msg){

  const time =
    new Date().toLocaleTimeString();

  $('log').textContent +=
    `[${time}] ${msg}\n`;

function setStatus(

){

/* =====================================================
   HTTPS
===================================================== */

function diagnoseEnvironment(){

  const localhost =
    location.hostname === 'localhost' ||
    location.hostname === '127.0.0.1';


  const secure =
    window.isSecureContext ||
    localhost;


  if(secure){

    setStatus(
      'secureStatus',
      '✅ HTTPS / 安全來源',
      'ok'
    );

    log('HTTPS OK');

  }else{

    setStatus(
      'secureStatus',

    );

  }

}


/* =====================================================
   FaceMesh
===================================================== */

const faceMesh =
  new FaceMesh({

    locateFile:file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`

  });


faceMesh.setOptions({

  maxNumFaces:1,

  refineLandmarks:true,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


faceMesh.onResults(
  results => {

    faceLandmarks =
      results.multiFaceLandmarks?.[0] ||
      null;


    if(faceLandmarks){

      setStatus(
        'faceStatus',
        '✅ 偵測到人臉',

    }else{

/* =====================================================
   Hands
===================================================== */

const hands =
  new Hands({

    locateFile:file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


hands.onResults(
  results => {

    handLandmarks =
      results.multiHandLandmarks?.[0] ||
      null;


    if(handLandmarks){

      setStatus(
        'handStatus',
        '✅ 偵測到手',
        'ok'

        '⚪ 未偵測到手',
        'wait'
      );

    }

  }
);


/* =====================================================
   Camera
===================================================== */

async function startCamera(){

  if(
    !navigator.mediaDevices?.getUserMedia
  ){

    throw new Error(
      'getUserMedia 不支援'
    );

  }


  if(stream){

    stream
      .getTracks()
      .forEach(
        t => t.stop()
      );

  }


  stream =
    await navigator.mediaDevices.getUserMedia({

      audio:false,

      video:{

        facingMode:facingMode,

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        },

        frameRate:{
          ideal:30,
          max:30
        }

      }

    });


  video.srcObject =
    stream;


  await video.play();


  resizeCanvas();


  setStatus(
    'cameraStatus',
    '✅ 相機已開啟',
    'ok'
  );


  log('相機啟動成功');

}


async function switchCamera(){

  if(!arStarted)
    return;


  facingMode =
    facingMode === 'user'
      ? 'environment'
      : 'user';


  try{

    await startCamera();

  }catch(e){

    log(
      `❌ 切換鏡頭失敗：${e.message}`
    );

  }

}


/* =====================================================
   Canvas
===================================================== */

function resizeCanvas(){

  const w =
    video.videoWidth ||
    640;


  const h =
    video.videoHeight ||
    480;


  if(
    canvas.width !== w ||
    canvas.height !== h
  ){

    canvas.width =
      w;

    canvas.height =
      h;


    recordCanvas.width =
      w;

    recordCanvas.height =
      h;


    setStatus(
      'canvasStatus',
      `✅ ${w}×${h}`,
      'ok'
    );

  }

}


/* =====================================================
   嘴巴
===================================================== */

function mouthOpen(){

  if(!faceLandmarks)
    return false;


  const upper =
    faceLandmarks[13];


  const lower =
    faceLandmarks[14];


  return !!upper &&
         !!lower &&
         Math.abs(
           lower.y -
           upper.y
         ) > .045;

}


/* =====================================================
   手掌
===================================================== */

function handOpen(){

  if(!handLandmarks)
    return false;


  const fingers = [

    handLandmarks[8].y <
    handLandmarks[6].y,

    handLandmarks[12].y <
    handLandmarks[10].y,

    handLandmarks[16].y <
    handLandmarks[14].y,

    handLandmarks[20].y <
    handLandmarks[18].y

  ];


  return
    fingers.filter(Boolean).length >= 3;

}


/* =====================================================
   狀態判斷
===================================================== */

function detectState(){

  /*
    張嘴優先
  */

  if(mouthOpen())
    return 'mouthOpen';


  /*
    再判斷手掌
  */

  if(handOpen())
    return 'handOpen';


  /*
    其他全部視為一般
  */

  return 'normal';

}

===================================================== */

function nextNormalVideo(){

  const name =
    VIDEO_GROUPS.normal[
      normalIndex %
      VIDEO_GROUPS.normal.length
    ];


  normalIndex++;


  /*
    除錯資訊
  */

  log(
    `🔄 一般影片輪替：${name}`

}


/* =====================================================
   隨機動作影片
===================================================== */

function randomVideo(list){

  return list[
    Math.floor(
      Math.random() *
      list.length
    )
  ];

}


/* =====================================================
   播放貓咪影片
===================================================== */

async function playCat(
  name,
  forceRestart=false
){

  if(!name)
    return;


  /*
    防止 AR Loop 同時觸發
    多次影片切換。
  */

  if(changingVideo)
    return;


  /*
    如果同一支影片已經在播放，
    不要重新載入。

    除非明確要求 forceRestart。
  */

  if(
    currentVideo === name &&
    testVideo.readyState >= 2 &&
    !forceRestart
  ){

    return;

  }


  changingVideo = true;


  try{

    /*
      停止上一支影片
    */

    testVideo.pause();


    try{

      testVideo.currentTime =
        0;

    }catch(e){}


    /*
      更新目前影片
    */

    currentVideo =
      name;


    $('currentVideoText').textContent =
      name;


    setStatus(
      'catStatus',
      `⏳ ${name}`,
      'wait'
    );


    log(
      `🐱 播放：${name}`
    );


    /*
      清掉舊來源
    */

    testVideo.removeAttribute(
      'src'
    );

    testVideo.load();


    /*
      使用相對路徑。

      適合 GitHub Pages。
    */

    testVideo.src =
      `./${name}`;


    testVideo.load();


    /*
      等待影片載入
    */

    await new Promise(
      (resolve,reject) => {

        let finished =
          false;


        const cleanup =
          () => {

            testVideo.removeEventListener(
              'loadeddata',
              onLoad
            );

            testVideo.removeEventListener(
              'error',
              onError
            );

          };


        const onLoad =
          () => {

            if(finished)
              return;


            finished = true;

            cleanup();

            resolve();

          };


        const onError =
          () => {

            if(finished)
              return;


            finished = true;

            cleanup();

            reject(
              new Error(
                '影片載入失敗'
              )
            );

          };


        testVideo.addEventListener(
          'loadeddata',
          onLoad,
          {once:true}
        );


        testVideo.addEventListener(
          'error',
          onError,
          {once:true}
        );

      }
    );


    /*
      每支影片一定從 0 開始。
    */

    try{

      testVideo.currentTime =
        0;

    }catch(e){}


    testVideo.loop =
      false;


    setStatus(
      'catStatus',
      `✅ ${name}`,
      'ok'
    );


    /*
      播放。

      因為 AR 是使用者點擊 Start 後啟動，
      一般瀏覽器允許 muted video autoplay。
    */

    try{

      await testVideo.play();

      log(
        `▶️ 播放中：${name}`
      );

    }catch(e){

      log(
        `⚠️ 影片需要播放權限：${e.name}`
      );

    }


  }catch(e){

    log(
      `❌ 影片錯誤：${name} / ${e.message}`
    );


    setStatus(
      'catStatus',
      `❌ ${name} 載入失敗`,
      'bad'
    );


  }finally{

    changingVideo =
      false;

  }

}


/* =====================================================
   動作狀態切換
===================================================== */

async function changeARVideo(
  state
){

  /*
    ★ 核心修正

    如果狀態沒有改變，
    不重新播放影片。

    一般影片播完會由 ended event
    自己接下一支。
  */

  if(
    state === currentState &&
    currentVideo
  ){

    return;

  }


  const previousState =
    currentState;


  currentState =
    state;


  log(
    `🎯 動作狀態：${previousState} → ${state}`
  );


  let name;


  /*
    =========================
    張嘴
    =========================
  */

  if(
    state === 'mouthOpen'
  ){

    name =
      randomVideo(
        VIDEO_GROUPS.mouthOpen
      );

  }


  /*
    =========================
    張開手掌
    =========================
  */

  else if(
    state === 'handOpen'
  ){

    name =
      randomVideo(
        VIDEO_GROUPS.handOpen
      );

  }


  /*
    =========================
    一般狀態
    =========================
  */

  else{

    /*
      回到一般狀態時，
      從目前 normalIndex 繼續。
    */

    name =
      nextNormalVideo();

  }


  await playCat(name);

}


/* =====================================================
   臉部範圍
===================================================== */

function getFaceBox(){

  if(!faceLandmarks)
    return null;


  let minX = 1;

  let maxX = 0;

  let minY = 1;

  let maxY = 0;


  for(
    const p of faceLandmarks
  ){

    minX =
      Math.min(
        minX,
        p.x
      );


    maxX =
      Math.max(
        maxX,
        p.x
      );


    minY =
      Math.min(
        minY,
        p.y
      );


    maxY =
      Math.max(
        maxY,
        p.y
      );

  }


  return {

    minX,
    maxX,
    minY,
    maxY,

    width:
      (maxX-minX) *
      canvas.width,

    height:
      (maxY-minY) *
      canvas.height,

    centerX:
      ((minX+maxX)/2) *
      canvas.width,

    centerY:
      ((minY+maxY)/2) *
      canvas.height,

    topY:
      minY *
      canvas.height

  };

}


/* =====================================================
   美膚
===================================================== */

function drawBeauty(){

  if(
    !faceLandmarks ||
    beautyStrength <= 0
  ){

    return;

  }


  const box =
    getFaceBox();


  if(!box)
    return;


  const padX =
    box.width * .18;


  const padY =
    box.height * .22;


  const x =
    Math.max(
      0,
      box.minX *
      canvas.width -
      padX
    );


  const y =
    Math.max(
      0,
      box.minY *
      canvas.height -
      padY
    );


  const w =
    Math.min(
      canvas.width-x,
      box.width +
      padX*2
    );


  const h =
    Math.min(
      canvas.height-y,
      box.height +
      padY*2
    );


  ctx.save();


  ctx.globalAlpha =
    0.12 +
    (beautyStrength/100) *
    .30;


  ctx.filter =
    `blur(${2 +
      beautyStrength*.045}px)`;


  ctx.drawImage(
    canvas,
    x,
    y,
    w,
    h,
    x,
    y,
    w,
    h
  );


  ctx.filter =
    'none';


  ctx.globalAlpha =
    (beautyStrength/100) *
    .16;


  ctx.filter =
    `blur(${1 +
      beautyStrength*.025}px)`;


  ctx.drawImage(
    canvas,
    x,
    y,
    w,
    h,
    x,
    y,
    w,
    h
  );


  ctx.restore();

}


/* =====================================================
   貓咪
===================================================== */

function drawCat(){

  if(
    !faceLandmarks ||
    testVideo.readyState <
      HTMLMediaElement.HAVE_CURRENT_DATA
  ){

    return;

  }


  const box =
    getFaceBox();


  if(!box)
    return;


  /*
    貓咪縮小在頭頂。
  */

  const size =
    box.width * .62;


  const x =
    box.centerX -
    size/2;


  const y =
    box.topY -
    size*.78;


  ctx.save();


  ctx.globalAlpha =
    1;


  ctx.drawImage(
    testVideo,
    x,
    y,
    size,
    size
  );


  ctx.restore();

}


/* =====================================================
   AR 畫面
===================================================== */

function drawAR(){

  if(!video.videoWidth)
    return;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    鏡像相機
  */

  ctx.save();


  ctx.translate(
    canvas.width,
    0
  );


  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();


  /*
    美膚
  */

  drawBeauty();


  /*
    貓咪
  */

  drawCat();


  setStatus(
    'canvasStatus',
    '✅ AR 正在運作',
    'ok'
  );

}


/* =====================================================
   錄影 Canvas
===================================================== */

function updateRecordCanvas(){

  const w =
    video.videoWidth ||
    640;


  const h =
    video.videoHeight ||
    480;


  if(
    recordCanvas.width !== w ||
    recordCanvas.height !== h
  ){

    recordCanvas.width =
      w;

    recordCanvas.height =
      h;

  }


  recordCtx.clearRect(
    0,
    0,
    w,
    h
  );


  recordCtx.drawImage(
    canvas,
    0,
    0,
    w,
    h
  );

}


/* =====================================================
   錄影 Loop
===================================================== */

function recordFrame(){

  if(!recording)
    return;


  updateRecordCanvas();


  requestAnimationFrame(
    recordFrame
  );

}


/* =====================================================
   MediaRecorder
===================================================== */

function supportedMime(){

  if(!window.MediaRecorder)
    return '';


  const types = [

    'video/mp4;codecs=avc1.42E01E',

    'video/mp4',

    'video/webm;codecs=vp9',

    'video/webm;codecs=vp8',

    'video/webm'

  ];


  return types.find(
    type =>
      MediaRecorder.isTypeSupported?.(
        type
      )
  ) || '';

}


/* =====================================================
   錄影
===================================================== */

$('recordBtn').onclick =
  () => {

    if(!arStarted){

      log(
        '請先啟動 AR'
      );

      return;

    }


    if(recording){

      recorder.stop();

      return;

    }


    if(
      !recordCanvas.captureStream ||
      !window.MediaRecorder
    ){

      log(
        '❌ 此瀏覽器不支援錄影'
      );

      return;

    }


    const capture =
      recordCanvas.captureStream(30);


    const mime =
      supportedMime();


    try{

      recorder =
        mime
        ? new MediaRecorder(
            capture,
            {
              mimeType:mime
            }
          )
        : new MediaRecorder(
            capture
          );

    }catch(e){

      log(
        `❌ MediaRecorder 建立失敗：${e.message}`
      );

      return;

    }


    chunks = [];


    recorder.ondataavailable =
      e => {

        if(e.data?.size){

          chunks.push(
            e.data
          );

        }

      };


    recorder.onstop =
      () => {

        const type =
          recorder.mimeType ||
          mime ||
          'video/webm';


        recordedBlob =
          new Blob(
            chunks,
            {
              type
            }
          );


        if(recordedUrl){

          URL.revokeObjectURL(
            recordedUrl
          );

        }


        recordedUrl =
          URL.createObjectURL(
            recordedBlob
          );


        recordPreview.src =
          recordedUrl;


        recordPreview.style.display =
          'block';


        $('saveVideoBtn')
          .classList.add(
            'show'
          );


        recording =
          false;


        $('recordBtn')
          .textContent =
          '🔴 開始錄影';


        $('recordBtn')
          .classList.remove(
            'recording'
          );


        log(
          `✅ 錄影完成：${type}`
        );

      };


    recorder.start(1000);


    recording =
      true;


    $('recordBtn')
      .textContent =
      '⏹ 停止錄影';


    $('recordBtn')
      .classList.add(
        'recording'
      );


    $('saveVideoBtn')
      .classList.remove(
        'show'
      );


    log(
      `🔴 開始錄影：${mime || '瀏覽器格式'}`
    );


    recordFrame();

  };


/* =====================================================

$('saveVideoBtn').onclick =
  () => {

    if(!recordedBlob){

      log(
        '目前沒有可儲存的影片'
      );

      return;

    }


    const type =
      recordedBlob.type ||
      'video/webm';


    const extension =
      type.includes('mp4')
        ? 'mp4'
        : 'webm';


    const url =
      URL.createObjectURL(
        recordedBlob
      );


    const a =
      document.createElement(
        'a'
      );


    a.href =
      url;


    a.download =
      `AR_cat_${Date.now()}.${extension}`;


    document.body.appendChild(a);


    a.click();


    a.remove();


    setTimeout(
      () =>
        URL.revokeObjectURL(url),
      3000
    );


    log(
      '💾 影片已送出儲存'
    );

  };

===================================================== */

/*
  這是這一版最重要的修正。

  一般狀態：

  Spider 播完
      ↓
  Champion
      ↓
  Magic
      ↓
  Sleep
      ↓
  Spider
      ↓
  ...

  不需要任何動作變化。

  但是：

  張嘴影片播完
      ↓
  停止

      ↓
  停止

  等待新的動作狀態。

*/

testVideo.loop =
  false;


testVideo.addEventListener(
  'ended',
  async () => {

    const finishedVideo =
      currentVideo;


    log(
      `⏹ 影片播放完成：${finishedVideo}`
    );


    /*
      ★ 只有目前狀態是 normal
      才自動接下一支。
    */

    if(
      currentState === 'normal'
    ){

      /*
        防止下一支影片還沒準備好時，
        AR Loop 又同時要求切換。
      */

      if(changingVideo){

        log(

        );

        return;

      }


      const next =
        nextNormalVideo();


      log(

      );


      await playCat(
        next
      );

    }else{

      /*
        動作影片播放完：

        不重播
        不自動接下一支

        等待新的動作。
      */

      log(
        `⏸ 動作影片播放完成，等待新動作`
      );

    }

  }
);


/* =====================================================
   AR Loop
===================================================== */

async function arLoop(ts){

  if(!arStarted)
    return;


  resizeCanvas();


  drawAR();


  const m =
    mouthOpen();


  const h =
    handOpen();


  $('mouthText').textContent =
    faceLandmarks
      ? (
          m
            ? '👄 張嘴'
            : '閉嘴'
        )
      : '未偵測';


  $('handText').textContent =
    handLandmarks
      ? (
          h
            ? '✋ 張開手掌'
            : '手掌未完全張開'
        )
      : '未偵測';


  /*
    ★ 有臉才判斷動作。

    但影片不會因為沒有臉
    就重新播放第一支。
  */

  if(faceLandmarks){

    const state =
      detectState();


    $('stateText').textContent =

      state === 'mouthOpen'
        ? '👄 張嘴'

      : state === 'handOpen'
        ? '✋ 張開手掌'

      : '😺 一般';


    /*
      ★ 只有狀態真的改變，
      才切換影片。
    */

    if(
      state !== currentState
    ){

      await changeARVideo(
        state
      );

    }

  }else{

    /*
      沒有人臉時：

      不改 currentState
      不重播影片
      不切回第一支。

      這樣使用者暫時離開鏡頭，
      影片狀態不會亂跳。
    */

    $('stateText').textContent =
      '⏳ 等待人臉';

  }


  /*
    MediaPipe
  */

  if(
    ts-lastProcess >= 70
  ){

    lastProcess =
      ts;


    try{

      await faceMesh.send({
        image:video
      });


      await hands.send({
        image:video
      });

    }catch(e){

      log(
        `MediaPipe 錯誤：${e.message}`
      );

    }

  }


  requestAnimationFrame(
    arLoop
  );

}
