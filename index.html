<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 奶牛貓 AR 互動美顏濾鏡</title>
  
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Microsoft JhengHei', sans-serif;
    }

    /* 頂部標題橫幅 */
    #custom-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 105, 180, 0.85);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 互動說明提示橫幅樣式 */
    #interaction-tip {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #ffe6ea;
      padding: 6px 16px;
      border-radius: 15px;
      font-size: 13px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
      animation: pulse-tip 2s infinite;
    }

    @keyframes pulse-tip {
      0% { opacity: 0.8; }
      50% { opacity: 1; transform: translateX(-50%) scale(1.03); }
      100% { opacity: 0.8; }
    }

    /* 控制按鈕介面 */
    #controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 999;
    }

    .btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* 💡 強化版美顏、美膚、磨皮與氣色濾鏡 */
    video, canvas {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) scaleX(-1) !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      /* 升級磨皮、美白與紅潤氣色效果：微光暈柔焦 + 提亮 + 溫润對比 + 微微粉嫩色調 */
      filter: brightness(1.18) contrast(0.96) saturate(1.15) blur(0.4px) drop-shadow(0 0 4px rgba(255, 182, 193, 0.4));
    }
  </style>
</head>
<body>

  <div id="custom-banner">🐾 奶牛貓 AR 互動美顏濾鏡</div>
  
  <div id="interaction-tip">✨ 試著「張開嘴巴」或「張開手掌」看看驚喜互動！</div>

  <div id="controls">
    <button class="btn" id="record-btn">開始錄影</button>
    <button class="btn" id="snapshot-btn">拍照存檔</button>
  </div>

  <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false">
    <a-assets>
      <!-- 一般狀態 (4部) -->
      <video id="v-normal-0" src="spider_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-normal-1" src="champion_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-normal-2" src="magic_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-normal-3" src="sleep_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      
      <!-- 張開嘴巴 (3部) -->
      <video id="v-mouth-0" src="chef_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-mouth-1" src="eat_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-mouth-2" src="drink_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>

      <!-- 張開手掌 (2部) -->
      <video id="v-hand-0" src="cry_cat_animation.mp4.mp4" loop crossorigin="anonymous" playsinline></video>
      <video id="v-hand-1" src="work_cat_animation.mp4" loop crossorigin="anonymous" playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" active="false"></a-camera>

    <a-entity mindar-face-target="anchorIndex: 10">
      <a-video id="video-normal-0" src="#v-normal-0" position="0 0.5 0" width="1" height="1" visible="true"></a-video>
      <a-video id="video-normal-1" src="#v-normal-1" position="0 0.5 0" width="1" height="1" visible="false"></a-video>
      <a-video id="video-normal-2" src="#v-normal-2" position="0 0.5 0" width="1" height="1" visible="false"></a-video>
      <a-video id="video-normal-3" src="#v-normal-3" position="0 0.5 0" width="1" height="1" visible="false"></a-video>

      <a-video id="video-mouth-0" src="#v-mouth-0" position="0 0.5 0" width="1" height="1" visible="false"></a-video>
      <a-video id="video-mouth-1" src="#v-mouth-1" position="0 0.5 0" width="1" height="1" visible="false"></a-video>
      <a-video id="video-mouth-2" src="#v-mouth-2" position="0 0.5 0" width="1" height="1" visible="false"></a-video>

      <a-video id="video-hand-0" src="#v-hand-0" position="0 0.5 0" width="1" height="1" visible="false"></a-video>
      <a-video id="video-hand-1" src="#v-hand-1" position="0 0.5 0" width="1" height="1" visible="false"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const animationGroups = {
      normal: ['video-normal-0', 'video-normal-1', 'video-normal-2', 'video-normal-3'],
      mouthOpen: ['video-mouth-0', 'video-mouth-1', 'video-mouth-2'],
      handPalm: ['video-hand-0', 'video-hand-1']
    };

    let currentCategory = 'normal';
    let currentIndex = 0;

    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('a-assets video').forEach(v => {
        v.play().catch(e => console.log("等待互動解鎖播放:", e));
      });
      switchAnimation('normal', 0);
    });

    function switchAnimation(category, index) {
      currentCategory = category;
      currentIndex = index % animationGroups[category].length;

      for (let cat in animationGroups) {
        animationGroups[cat].forEach((id, idx) => {
          const el = document.getElementById(id);
          const videoEl = document.querySelector(el.getAttribute('src'));
          if (cat === category && idx === currentIndex) {
            el.setAttribute('visible', 'true');
            if (videoEl) videoEl.play();
          } else {
            el.setAttribute('visible', 'false');
            if (videoEl) videoEl.pause();
          }
        });
      }
    }

    window.addEventListener('click', () => {
      let categories = ['normal', 'mouthOpen', 'handPalm'];
      let catIndex = categories.indexOf(currentCategory);
      
      currentIndex++;
      if (currentIndex >= animationGroups[currentCategory].length) {
        currentIndex = 0;
        catIndex = (catIndex + 1) % categories.length;
      }
      
      switchAnimation(categories[catIndex], currentIndex);
    });

    const recordBtn = document.getElementById('record-btn');
    let mediaRecorder;
    let recordedChunks = [];

    recordBtn.addEventListener('click', () => {
      if (recordBtn.innerText === '開始錄影') {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      const arCanvas = document.querySelector('canvas');
      if (!arCanvas) {
        alert("AR 畫面尚未準備好！");
        return;
      }
      
      const stream = arCanvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
      
      recordedChunks = [];
      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ar_cat_beautified_video.webm';
        a.click();
      };

      mediaRecorder.start();
      recordBtn.innerText = '停止錄影';
      recordBtn.style.background = '#ff4757';
    }

    function stopRecording() {
      mediaRecorder.stop();
      recordBtn.innerText = '開始錄影';
      recordBtn.style.background = 'linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%)';
    }

    document.getElementById('snapshot-btn').addEventListener('click', () => {
      const arCanvas = document.querySelector('canvas');
      if (!arCanvas) return;
      
      const link = document.createElement('a');
      link.download = 'ar_cat_snapshot.png';
      link.href = arCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
