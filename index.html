<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多重互動 AR 貓咪動畫濾鏡與錄影</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #webcam, #output-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #webcam {
      z-index: 1;
      transform: scaleX(-1); /* 鏡像翻轉，符合自拍習慣 */
    }

    #output-canvas {
      z-index: 2;
      pointer-events: none;
      transform: scaleX(-1);
    }

    #custom-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 105, 180, 0.85);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }

    #controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 1000;
    }

    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #ff9800;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="custom-banner">✨ AR 互動貓咪濾鏡體驗中 (一般/張嘴/手掌切換)</div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output-canvas"></canvas>

  <div id="controls">
    <button id="record-btn" class="btn">🔴 開始錄影</button>
    <button id="snapshot-btn" class="btn" style="background: #4CAF50;">📸 拍照存檔</button>
  </div>

  <video id="cat-video" src="chef_cat_animation.mp4" autoplay loop muted playsinline style="display: none;"></video>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const recordBtn = document.getElementById('record-btn');
    const snapshotBtn = document.getElementById('snapshot-btn');
    const catVideo = document.getElementById('cat-video');

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    let currentFace = null;
    let hasHandOpen = false;
    let currentAnimationState = 'normal'; // 可為 'mouthOpen', 'handOpen', 'normal'
    let normalVideoIndex = 0;
    const normalVideos = [
      'chef_cat_animation.mp4',
      'drink_cat_animation.mp4',
      'magic_cat_animation.mp4',
      'sleep_cat_animation.mp4'
    ];

    // 1. 初始化 MediaPipe Face Mesh（用來精準抓取頭頂位置與計算張嘴狀態）
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        currentFace = results.multiFaceLandmarks[0];
      } else {
        currentFace = null;
      }
    });

    // 2. 初始化 MediaPipe Hands（用來偵測手掌張開）
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        // 簡單判斷手掌是否張開：檢查手指指尖（4, 8, 12, 16, 20）是否高於對應的關節
        // 這裡以食指(8)與指根(5)的相對高度做簡易示範
        const isOpen = landmarks[8].y < landmarks[5].y && landmarks[12].y < landmarks[9].y;
        hasHandOpen = isOpen;
      } else {
        hasHandOpen = false;
      }
    });

    // 3. 畫面主渲染迴圈（每一幀執行特效邏輯與繪製）
    function renderFrame() {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (currentFace) {
        // 計算臉部邊界框與頭頂位置
        let minX = 1, maxX = 0, minY = 1, maxY = 0;
        for (const pt of currentFace) {
          if (pt.x < minX) minX = pt.x;
          if (pt.x > maxX) maxX = pt.x;
          if (pt.y < minY) minY = pt.y;
          if (pt.y > maxY) maxY = pt.y;
        }

        const x = minX * canvasElement.width;
        const y = minY * canvasElement.height;
        const w = (maxX - minX) * canvasElement.width;
        const h = (maxY - minY) * canvasElement.height;

        // 偵測是否張嘴：計算上嘴唇(13)與下嘴唇(14)的距離
        const upperLip = currentFace[13];
        const lowerLip = currentFace[14];
        const mouthOpenDistance = Math.abs(upperLip.y - lowerLip.y);
        const isMouthOpen = mouthOpenDistance > 0.05; // 閥值可根據實際情況微調

        // 決定目前要播放的動畫狀態
        let targetState = 'normal';
        if (isMouthOpen) {
          targetState = 'mouthOpen';
        } else if (hasHandOpen) {
          targetState = 'handOpen';
        }

        // 切換影片來源邏輯
        updateVideoSource(targetState);

        // 計算頭頂位置繪製影片
        const catWidth = w * 1.3;
        const catHeight = w * 1.3;
        const catX = x + w / 2 - catWidth / 2;
        const catY = y - catHeight * 0.8;

        if (catVideo.readyState >= catVideo.HAVE_CURRENT_DATA) {
          canvasCtx.drawImage(catVideo, catX, catY, catWidth, catHeight);
        }
      }

      requestAnimationFrame(renderFrame);
    }

    // 動態切換對應影片清單的函式
    let lastState = '';
    function updateVideoSource(newState) {
      if (newState !== lastState) {
        lastState = newState;
        if (newState === 'mouthOpen') {
          // 張嘴隨機播放 chef 或 eat
          const options = ['chef_cat_animation.mp4', 'eat_cat_animation.mp4'];
          catVideo.src = options[Math.floor(Math.random() * options.length)];
        } else if (newState === 'handOpen') {
          // 張手隨機播放 cry 或 work
          const options = ['cry_cat_animation.mp4', 'work_cat_animation.mp4'];
          catVideo.src = options[Math.floor(Math.random() * options.length)];
        } else {
          // 一般狀態輪流播放其他影片
          catVideo.src = normalVideos[normalVideoIndex];
          normalVideoIndex = (normalVideoIndex + 1) % normalVideos.length;
        }
        catVideo.play().catch(e => console.log(e));
      }
    }

    // 啟動相機與串流送入 AI 模型
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start().then(() => {
      requestAnimationFrame(renderFrame);
    });

    // ==========================================
    // 隱藏合成畫布（確保錄影與拍照能完整保存人像與 AR 動畫）
    // ==========================================
    const combinedCanvas = document.createElement('canvas');
    const combinedCtx = combinedCanvas.getContext('2d');

    function updateCombinedCanvas() {
      combinedCanvas.width = videoElement.videoWidth || 640;
      combinedCanvas.height = videoElement.videoHeight || 480;

      combinedCtx.save();
      combinedCtx.scale(-1, 1);
      combinedCtx.drawImage(videoElement, -combinedCanvas.width, 0, combinedCanvas.width, combinedCanvas.height);
      combinedCtx.restore();

      combinedCtx.drawImage(canvasElement, 0, 0, combinedCanvas.width, combinedCanvas.height);
    }

    // --- 錄影功能 ---
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        recordedChunks = [];
        const stream = combinedCanvas.captureStream(30);
        
        try {
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
        } catch (e) {
          mediaRecorder = new MediaRecorder(stream);
        }

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'ar_cat_recording.webm';
          a.click();
          URL.revokeObjectURL(url);
        };

        window.recordInterval = setInterval(updateCombinedCanvas, 1000 / 30);
        mediaRecorder.start();
        isRecording = true;
        recordBtn.innerText = '⏹️ 停止錄影';
        recordBtn.style.backgroundColor = '#f44336';
      } else {
        mediaRecorder.stop();
        clearInterval(window.recordInterval);
        isRecording = false;
        recordBtn.innerText = '🔴 開始錄影';
        recordBtn.style.backgroundColor = '#ff9800';
      }
    });

    // --- 拍照存檔功能 ---
    snapshotBtn.addEventListener('click', () => {
      updateCombinedCanvas();
      const dataURL = combinedCanvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataURL;
      a.download = 'ar_cat_photo.png';
      a.click();
    });
  </script>
</body>
</html>
