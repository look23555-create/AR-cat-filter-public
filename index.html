<script>

'use strict';


/* =====================================================
   9 部影片
===================================================== */

const VIDEO_GROUPS = {

  normal: [
    'spider_cat_animation.mp4',
    'champion_cat_animation.mp4',
    'magic_cat_animation.mp4',
    'sleep_cat_animation.mp4'
  ],

  mouthOpen: [
    'chef_cat_animation.mp4',
    'eat_cat_animation.mp4',
    'drink_cat_animation.mp4'
  ],

  handOpen: [
    'cry_cat_animation.mp4.mp4',
    'work_cat_animation.mp4'
  ]

};


const ALL_VIDEOS = [
  ...new Set([
    ...VIDEO_GROUPS.normal,
    ...VIDEO_GROUPS.mouthOpen,
    ...VIDEO_GROUPS.handOpen
  ])
];


const $ = id => document.getElementById(id);


const video = $('webcam');

const canvas = $('output');

const ctx = canvas.getContext('2d', {
  willReadFrequently:false
});

const testVideo = $('testVideo');

const recordPreview = $('recordPreview');


let stream = null;

let facingMode = 'user';

let arStarted = false;

let faceLandmarks = null;

let handLandmarks = null;

let currentState = 'none';

let currentVideo = '';

let normalIndex = 0;

let lastProcess = 0;


/* =====================================================
   錄影
===================================================== */

let recording = false;

let recorder = null;

let chunks = [];

let recordedBlob = null;

let recordedUrl = null;

let recordCanvas =
  document.createElement('canvas');

let recordCtx =
  recordCanvas.getContext('2d');


/* =====================================================
   美膚
===================================================== */

let beautyStrength = 65;


/* =====================================================
   Log
===================================================== */

function log(msg){

  const time =
    new Date().toLocaleTimeString();

  $('log').textContent +=
    `[${time}] ${msg}\n`;

  $('log').scrollTop =
    $('log').scrollHeight;

  console.log(msg);
}


function setStatus(id,text,cls='info'){

  const el = $(id);

  el.textContent = text;

  el.className = cls;
}


function overall(text,cls='info'){

  $('overall').textContent = text;

  $('overall').className = cls;

}


/* =====================================================
   HTTPS
===================================================== */

function diagnoseEnvironment(){

  const localhost =
    location.hostname === 'localhost' ||
    location.hostname === '127.0.0.1';

  const secure =
    window.isSecureContext || localhost;


  if(secure){

    setStatus(
      'secureStatus',
      '✅ HTTPS / 安全來源',
      'ok'
    );

    log('HTTPS OK');

  }else{

    setStatus(
      'secureStatus',
      '❌ 需要 HTTPS',
      'bad'
    );

  }

}


/* =====================================================
   FaceMesh
===================================================== */

const faceMesh = new FaceMesh({

  locateFile:file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`

});


faceMesh.setOptions({

  maxNumFaces:1,

  refineLandmarks:true,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


faceMesh.onResults(results => {

  faceLandmarks =
    results.multiFaceLandmarks?.[0] || null;


  if(faceLandmarks){

    setStatus(
      'faceStatus',
      '✅ 偵測到人臉',
      'ok'
    );

  }else{

    setStatus(
      'faceStatus',
      '⚪ 等待人臉',
      'wait'
    );

  }

});


/* =====================================================
   Hands
===================================================== */

const hands = new Hands({

  locateFile:file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


hands.onResults(results => {

  handLandmarks =
    results.multiHandLandmarks?.[0] || null;


  if(handLandmarks){

    setStatus(
      'handStatus',
      '✅ 偵測到手',
      'ok'
    );

  }else{

    setStatus(
      'handStatus',
      '⚪ 未偵測到手',
      'wait'
    );

  }

});


/* =====================================================
   Camera
===================================================== */

async function startCamera(){

  if(!navigator.mediaDevices?.getUserMedia){

    throw new Error(
      'getUserMedia 不支援'
    );

  }


  if(stream){

    stream.getTracks()
      .forEach(t => t.stop());

  }


  stream =
    await navigator.mediaDevices.getUserMedia({

      audio:false,

      video:{
        facingMode:facingMode,

        width:{ideal:1280},

        height:{ideal:720},

        frameRate:{
          ideal:30,
          max:30
        }

      }

    });


  video.srcObject = stream;

  await video.play();


  resizeCanvas();


  setStatus(
    'cameraStatus',
    '✅ 相機已開啟',
    'ok'
  );


  log('相機啟動成功');

}


async function switchCamera(){

  if(!arStarted) return;


  facingMode =
    facingMode === 'user'
      ? 'environment'
      : 'user';


  try{

    await startCamera();

  }catch(e){

    log(
      `❌ 切換鏡頭失敗：${e.message}`
    );

  }

}


/* =====================================================
   Canvas
===================================================== */

function resizeCanvas(){

  const w =
    video.videoWidth || 640;

  const h =
    video.videoHeight || 480;


  if(
    canvas.width !== w ||
    canvas.height !== h
  ){

    canvas.width = w;

    canvas.height = h;


    recordCanvas.width = w;

    recordCanvas.height = h;


    setStatus(
      'canvasStatus',
      `✅ ${w}×${h}`,
      'ok'
    );

  }

}


/* =====================================================
   嘴巴
===================================================== */

function mouthOpen(){

  if(!faceLandmarks)
    return false;


  const upper =
    faceLandmarks[13];

  const lower =
    faceLandmarks[14];


  return !!upper &&
         !!lower &&
         Math.abs(
           lower.y-upper.y
         ) > .045;

}


/* =====================================================
   手掌
===================================================== */

function handOpen(){

  if(!handLandmarks)
    return false;


  const fingers = [

    handLandmarks[8].y <
    handLandmarks[6].y,

    handLandmarks[12].y <
    handLandmarks[10].y,

    handLandmarks[16].y <
    handLandmarks[14].y,

    handLandmarks[20].y <
    handLandmarks[18].y

  ];


  return fingers.filter(Boolean).length >= 3;

}


/* =====================================================
   狀態
===================================================== */

function detectState(){

  if(mouthOpen())
    return 'mouthOpen';


  if(handOpen())
    return 'handOpen';


  return 'normal';

}


/* =====================================================
   影片切換
===================================================== */

/*
  重要：

  每次切換影片：

  1. pause 舊影片
  2. currentTime = 0
  3. load 新影片
  4. 新影片從 0 開始

  不會把上一支影片接著播。
*/

async function playCat(name){

  if(!name)
    return;


  if(currentVideo === name &&
     testVideo.readyState >= 2){

    return;

  }


  try{

    testVideo.pause();

    testVideo.currentTime = 0;

  }catch(e){}


  currentVideo = name;

  $('currentVideoText').textContent =
    name;


  setStatus(
    'catStatus',
    `⏳ ${name}`,
    'wait'
  );


  log(`切換貓咪：${name}`);


  testVideo.src = '';

  testVideo.removeAttribute('src');

  testVideo.load();


  await new Promise(r =>
    setTimeout(r,30)
  );


  testVideo.src =
    `./${name}`;

  testVideo.load();


  await new Promise((resolve,reject)=>{

    const onLoad = () => {

      cleanup();

      resolve();

    };


    const onError = () => {

      cleanup();

      reject(
        new Error('影片載入失敗')
      );

    };


    const cleanup = () => {

      testVideo.removeEventListener(
        'loadeddata',
        onLoad
      );

      testVideo.removeEventListener(
        'error',
        onError
      );

    };


    testVideo.addEventListener(
      'loadeddata',
      onLoad,
      {once:true}
    );


    testVideo.addEventListener(
      'error',
      onError,
      {once:true}
    );

  });


  /*
    每一支影片都從頭開始。
    不使用 loop。
  */

  testVideo.currentTime = 0;

  setStatus(
    'catStatus',
    `✅ ${name}`,
    'ok'
  );


  try{

    await testVideo.play();

  }catch(e){

    log(
      `⚠️ 播放需要使用者操作：${e.name}`
    );

  }

}


/* =====================================================
   一般影片輪替
===================================================== */

function nextNormalVideo(){

  const name =
    VIDEO_GROUPS.normal[
      normalIndex %
      VIDEO_GROUPS.normal.length
    ];

  normalIndex++;

  return name;

}


/* =====================================================
   動作影片
===================================================== */

async function changeARVideo(state){

  /*
    只在「狀態改變」時換影片。
    不會因為每一幀偵測到同樣狀態就重新播放。
  */

  if(
    state === currentState &&
    currentVideo
  ){

    return;

  }


  currentState = state;


  let name;


  if(state === 'mouthOpen'){

    name =
      VIDEO_GROUPS.mouthOpen[
        Math.floor(
          Math.random() *
          VIDEO_GROUPS.mouthOpen.length
        )
      ];

  }


  else if(state === 'handOpen'){

    name =
      VIDEO_GROUPS.handOpen[
        Math.floor(
          Math.random() *
          VIDEO_GROUPS.handOpen.length
        )
      ];

  }


  else{

    name =
      nextNormalVideo();

  }


  await playCat(name);

}


/* =====================================================
   臉部範圍
===================================================== */

function getFaceBox(){

  if(!faceLandmarks)
    return null;


  let minX = 1;

  let maxX = 0;

  let minY = 1;

  let maxY = 0;


  for(const p of faceLandmarks){

    minX =
      Math.min(minX,p.x);

    maxX =
      Math.max(maxX,p.x);

    minY =
      Math.min(minY,p.y);

    maxY =
      Math.max(maxY,p.y);

  }


  return {

    minX,
    maxX,
    minY,
    maxY,

    width:
      (maxX-minX) *
      canvas.width,

    height:
      (maxY-minY) *
      canvas.height,

    centerX:
      ((minX+maxX)/2) *
      canvas.width,

    centerY:
      ((minY+maxY)/2) *
      canvas.height,

    topY:
      minY *
      canvas.height

  };

}


/* =====================================================
   美膚遮罩
===================================================== */

/*
  這裡不是單純把整張畫面模糊。

  只對臉部區域做柔化，
  避免頭髮、背景、貓咪影片一起被磨皮。
*/

function drawBeauty(){

  if(
    !faceLandmarks ||
    beautyStrength <= 0
  ){

    return;

  }


  const box =
    getFaceBox();

  if(!box)
    return;


  const padX =
    box.width * .18;

  const padY =
    box.height * .22;


  const x =
    Math.max(
      0,
      box.minX * canvas.width - padX
    );

  const y =
    Math.max(
      0,
      box.minY * canvas.height - padY
    );


  const w =
    Math.min(
      canvas.width-x,
      box.width+padX*2
    );

  const h =
    Math.min(
      canvas.height-y,
      box.height+padY*2
    );


  /*
    強化版磨皮：
    多層低透明度 blur 疊加，
    再用柔和透明度混合。
  */

  ctx.save();


  ctx.globalAlpha =
    0.12 +
    (beautyStrength / 100) * .30;


  ctx.filter =
    `blur(${2 + beautyStrength * .045}px)`;


  ctx.drawImage(
    canvas,
    x,
    y,
    w,
    h,
    x,
    y,
    w,
    h
  );


  ctx.filter = 'none';


  /*
    再加一層低強度柔化。
  */

  ctx.globalAlpha =
    (beautyStrength / 100) * .16;


  ctx.filter =
    `blur(${1 + beautyStrength * .025}px)`;


  ctx.drawImage(
    canvas,
    x,
    y,
    w,
    h,
    x,
    y,
    w,
    h
  );


  ctx.restore();

}


/* =====================================================
   貓咪繪製
===================================================== */

function drawCat(){

  if(
    !faceLandmarks ||
    testVideo.readyState <
      HTMLMediaElement.HAVE_CURRENT_DATA
  ){

    return;

  }


  const box =
    getFaceBox();

  if(!box)
    return;


  /*
    貓咪縮小到頭頂。

    不再用很大的 1.35 倍臉寬。
    這樣可以避免遮住臉。
  */

  const size =
    box.width * .62;


  const x =
    box.centerX -
    size / 2;


  const y =
    box.topY -
    size * .78;


  ctx.save();


  ctx.globalAlpha = 1;


  ctx.drawImage(
    testVideo,
    x,
    y,
    size,
    size
  );


  ctx.restore();

}


/* =====================================================
   AR 主畫面
===================================================== */

function drawAR(){

  if(!video.videoWidth)
    return;


  /*
    先畫鏡像相機。

    Canvas 本身之後會再透過 CSS 鏡像，
    因此錄影時直接建立正確的畫面。
  */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.save();


  ctx.translate(
    canvas.width,
    0
  );


  ctx.scale(-1,1);


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();


  /*
    美膚
  */

  drawBeauty();


  /*
    貓咪
  */

  drawCat();


  setStatus(
    'canvasStatus',
    '✅ AR 正在運作',
    'ok'
  );

}


/* =====================================================
   錄影畫面
===================================================== */

function updateRecordCanvas(){

  const w =
    video.videoWidth || 640;

  const h =
    video.videoHeight || 480;


  if(
    recordCanvas.width !== w ||
    recordCanvas.height !== h
  ){

    recordCanvas.width = w;

    recordCanvas.height = h;

  }


  recordCtx.clearRect(
    0,
    0,
    w,
    h
  );


  /*
    output Canvas 已經是完整 AR 畫面。
  */

  recordCtx.drawImage(
    canvas,
    0,
    0,
    w,
    h
  );

}


/* =====================================================
   錄影 Loop
===================================================== */

function recordFrame(){

  if(!recording)
    return;


  updateRecordCanvas();


  requestAnimationFrame(
    recordFrame
  );

}


/* =====================================================
   MediaRecorder
===================================================== */

function supportedMime(){

  if(!window.MediaRecorder)
    return '';


  const types = [

    'video/mp4;codecs=avc1.42E01E',

    'video/mp4',

    'video/webm;codecs=vp9',

    'video/webm;codecs=vp8',

    'video/webm'

  ];


  return types.find(type =>
    MediaRecorder.isTypeSupported?.(type)
  ) || '';

}


/* =====================================================
   開始 / 停止錄影
===================================================== */

$('recordBtn').onclick = () => {

  if(!arStarted){

    log('請先啟動 AR');

    return;

  }


  if(recording){

    recorder.stop();

    return;

  }


  if(
    !recordCanvas.captureStream ||
    !window.MediaRecorder
  ){

    log(
      '❌ 此瀏覽器不支援錄影',
    );

    return;

  }


  const capture =
    recordCanvas.captureStream(30);


  const mime =
    supportedMime();


  try{

    recorder =
      mime
      ? new MediaRecorder(
          capture,
          {mimeType:mime}
        )
      : new MediaRecorder(capture);

  }catch(e){

    log(
      `❌ MediaRecorder 建立失敗：${e.message}`
    );

    return;

  }


  chunks = [];


  recorder.ondataavailable =
    e => {

      if(e.data?.size){

        chunks.push(e.data);

      }

    };


  recorder.onstop = () => {

    const type =
      recorder.mimeType ||
      mime ||
      'video/webm';


    recordedBlob =
      new Blob(
        chunks,
        {type}
      );


    if(recordedUrl){

      URL.revokeObjectURL(
        recordedUrl
      );

    }


    recordedUrl =
      URL.createObjectURL(
        recordedBlob
      );


    recordPreview.src =
      recordedUrl;


    recordPreview.style.display =
      'block';


    /*
      顯示「儲存影片」
    */

    $('saveVideoBtn')
      .classList.add('show');


    recording = false;


    $('recordBtn').textContent =
      '🔴 開始錄影';


    $('recordBtn')
      .classList.remove('recording');


    log(
      `✅ 錄影完成：${type}`
    );

  };


  recorder.start(1000);


  recording = true;


  $('recordBtn').textContent =
    '⏹ 停止錄影';


  $('recordBtn')
    .classList.add('recording');


  $('saveVideoBtn')
    .classList.remove('show');


  log(
    `🔴 開始錄影：${mime || '瀏覽器格式'}`
  );


  /*
    持續更新錄影畫面。
  */

  recordFrame();

};


/* =====================================================
   儲存影片
===================================================== */

$('saveVideoBtn').onclick = () => {

  if(!recordedBlob){

    log('目前沒有可儲存的影片');

    return;

  }


  const type =
    recordedBlob.type ||
    'video/webm';


  const extension =
    type.includes('mp4')
      ? 'mp4'
      : 'webm';


  const url =
    URL.createObjectURL(
      recordedBlob
    );


  const a =
    document.createElement('a');


  a.href = url;


  a.download =
    `AR_cat_${Date.now()}.${extension}`;


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () => URL.revokeObjectURL(url),
    3000
  );


  log('💾 影片已送出儲存');

};


/* =====================================================
   拍照
===================================================== */

$('snapshotBtn').onclick = () => {

  if(!arStarted){

    log('請先啟動 AR');

    return;

  }


  updateRecordCanvas();


  recordCanvas.toBlob(
    blob => {

      if(!blob)
        return;


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement('a');


      a.href = url;


      a.download =
        `AR_cat_${Date.now()}.jpg`;


      document.body.appendChild(a);

      a.click();

      a.remove();


      setTimeout(
        () => URL.revokeObjectURL(url),
        2000
      );


      log('📸 照片已儲存');

    },
    'image/jpeg',
    .94
  );

};

/* =====================================================
   AR Loop
===================================================== */

async function arLoop(ts){

  if(!arStarted)
    return;


  resizeCanvas();


  drawAR();


  const m =
    mouthOpen();


  const h =
    handOpen();


  $('mouthText').textContent =
    faceLandmarks
      ? (m ? '👄 張嘴' : '閉嘴')
      : '未偵測';


  $('handText').textContent =
    handLandmarks
      ? (h ? '✋ 張開手掌' : '手掌未完全張開')
      : '未偵測';


  if(faceLandmarks){

    const state =
      detectState();


    $('stateText').textContent =

      state === 'mouthOpen'
        ? '👄 張嘴'

      : state === 'handOpen'
        ? '✋ 張開手掌'

      : '😺 一般';


    if(state !== currentState){

      await changeARVideo(
        state
      );

    }

  }


  if(
    ts-lastProcess >= 70
  ){

    lastProcess = ts;


    try{

      await faceMesh.send({
        image:video
      });


      await hands.send({
        image:video
      });

    }catch(e){

      log(
        `MediaPipe 錯誤：${e.message}`
      );

    }

  }


  requestAnimationFrame(
    arLoop
  );

}
