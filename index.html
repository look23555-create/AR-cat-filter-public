<script>

'use strict';


/* =====================================================
   影片分類
===================================================== */

const VIDEO_GROUPS = {

  /* 一般狀態：依序播放 */
  normal: [
    'spider_cat_animation.mp4',
    'champion_cat_animation.mp4',
    'magic_cat_animation.mp4',
    'sleep_cat_animation.mp4'
  ],

  /* 張開嘴巴 */
  mouthOpen: [
    'chef_cat_animation.mp4',
    'eat_cat_animation.mp4',
    'drink_cat_animation.mp4'
  ],

  /* 張開手掌 */
  handOpen: [
    'cry_cat_animation.mp4.mp4',
    'work_cat_animation.mp4'
  ]

};


const ALL_VIDEOS = [
  ...new Set([
    ...VIDEO_GROUPS.normal,
    ...VIDEO_GROUPS.mouthOpen,
    ...VIDEO_GROUPS.handOpen
  ])
];


const $ = id =>
  document.getElementById(id);


const video =
  $('webcam');


const canvas =
  $('output');


const ctx =
  canvas.getContext('2d', {
    willReadFrequently:false
  });


const testVideo =
  $('testVideo');


const recordPreview =
  $('recordPreview');


/* =====================================================
   AR 狀態
===================================================== */

let stream = null;

let facingMode = 'user';

let arStarted = false;

let faceLandmarks = null;

let handLandmarks = null;


/*
  none：
  尚未建立狀態

  normal：
  一般狀態

  mouthOpen：
  張嘴

  handOpen：
  張手
*/

let currentState = 'none';


let currentVideo = '';


/*
  一般影片目前播放到哪一支
*/
let normalIndex = 0;


/*
  MediaPipe 更新時間
*/
let lastProcess = 0;


/*
  防止影片切換互相重疊
*/
let changingVideo = false;


/*
  防止 ended 事件與動作偵測同時切換
*/
let videoChangeToken = 0;


/*
  動作穩定判斷
*/
let candidateState = 'normal';

let candidateCount = 0;

const STATE_CONFIRM_FRAMES = 3;


/* =====================================================
   錄影
===================================================== */

let recording = false;

let recorder = null;

let chunks = [];

let recordedBlob = null;

let recordedUrl = null;

let recordCanvas =
  document.createElement('canvas');

let recordCtx =
  recordCanvas.getContext('2d');


/* =====================================================
   美膚
===================================================== */

let beautyStrength = 65;


/* =====================================================
   Log
===================================================== */

function log(msg){

  const time =
    new Date().toLocaleTimeString();

  $('log').textContent +=
    `[${time}] ${msg}\n`;

  $('log').scrollTop =
    $('log').scrollHeight;

  console.log(msg);

}


function setStatus(id,text,cls='info'){

  const el =
    $(id);

  el.textContent =
    text;

  el.className =
    cls;

}


function overall(text,cls='info'){

  $('overall').textContent =
    text;

  $('overall').className =
    cls;

}


/* =====================================================
   互動說明
===================================================== */

function updateInteractionGuide(state){

  const guide =
    $('interactionGuide');

  const title =
    $('guideTitle');

  const text =
    $('guideText');


  if(state === 'mouthOpen'){

    title.textContent =
      '👄 嘴巴互動';

    text.textContent =
      '偵測到張開嘴巴！貓咪正在回應你。';

    guide.classList.add('active');

  }

  else if(state === 'handOpen'){

    title.textContent =
      '✋ 手掌互動';

    text.textContent =
      '偵測到張開手掌！貓咪正在回應你。';

    guide.classList.add('active');

  }

  else{

    title.textContent =
      '🐱 AR 貓咪互動';

    text.textContent =
      '👄 張開嘴巴　・　✋ 張開手掌';

    guide.classList.remove('active');

  }

}


/* =====================================================
   HTTPS
===================================================== */

function diagnoseEnvironment(){

  const localhost =
    location.hostname === 'localhost' ||
    location.hostname === '127.0.0.1';


  const secure =
    window.isSecureContext ||
    localhost;


  if(secure){

    setStatus(
      'secureStatus',
      '✅ HTTPS / 安全來源',
      'ok'
    );

    log('HTTPS OK');

  }

  else{

    setStatus(
      'secureStatus',
      '❌ 需要 HTTPS',
      'bad'
    );

  }

}


/* =====================================================
   FaceMesh
===================================================== */

const faceMesh =
  new FaceMesh({

    locateFile:file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`

  });


faceMesh.setOptions({

  maxNumFaces:1,

  refineLandmarks:true,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


faceMesh.onResults(results => {

  faceLandmarks =
    results.multiFaceLandmarks?.[0] ||
    null;


  if(faceLandmarks){

    setStatus(
      'faceStatus',
      '✅ 偵測到人臉',
      'ok'
    );

  }

  else{

    setStatus(
      'faceStatus',
      '⚪ 等待人臉',
      'wait'
    );

  }

});


/* =====================================================
   Hands
===================================================== */

const hands =
  new Hands({

    locateFile:file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


hands.onResults(results => {

  handLandmarks =
    results.multiHandLandmarks?.[0] ||
    null;


  if(handLandmarks){

    setStatus(
      'handStatus',
      '✅ 偵測到手',
      'ok'
    );

  }

  else{

    setStatus(
      'handStatus',
      '⚪ 未偵測到手',
      'wait'
    );

  }

});


/* =====================================================
   Camera
===================================================== */

async function startCamera(){

  if(!navigator.mediaDevices?.getUserMedia){

    throw new Error(
      'getUserMedia 不支援'
    );

  }


  if(stream){

    stream.getTracks()
      .forEach(t => t.stop());

  }


  stream =
    await navigator.mediaDevices.getUserMedia({

      audio:false,

      video:{

        facingMode:facingMode,

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        },

        frameRate:{
          ideal:30,
          max:30
        }

      }

    });


  video.srcObject =
    stream;


  await video.play();


  resizeCanvas();


  setStatus(
    'cameraStatus',
    '✅ 相機已開啟',
    'ok'
  );


  log('相機啟動成功');

}


async function switchCamera(){

  if(!arStarted)
    return;


  facingMode =
    facingMode === 'user'
      ? 'environment'
      : 'user';


  try{

    await startCamera();

  }

  catch(e){

    log(
      `❌ 切換鏡頭失敗：${e.message}`
    );

  }

}


/* =====================================================
   Canvas
===================================================== */

function resizeCanvas(){

  const w =
    video.videoWidth || 640;


  const h =
    video.videoHeight || 480;


  if(
    canvas.width !== w ||
    canvas.height !== h
  ){

    canvas.width =
      w;

    canvas.height =
      h;


    recordCanvas.width =
      w;

    recordCanvas.height =
      h;


    setStatus(
      'canvasStatus',
      `✅ ${w}×${h}`,
      'ok'
    );

  }

}


/* =====================================================
   嘴巴偵測
===================================================== */

function mouthOpen(){

  if(!faceLandmarks)
    return false;


  const upper =
    faceLandmarks[13];


  const lower =
    faceLandmarks[14];


  return !!upper &&
         !!lower &&
         Math.abs(
           lower.y - upper.y
         ) > .045;

}


/* =====================================================
   手掌偵測
===================================================== */

function handOpen(){

  if(!handLandmarks)
    return false;


  const fingers = [

    handLandmarks[8].y <
    handLandmarks[6].y,

    handLandmarks[12].y <
    handLandmarks[10].y,

    handLandmarks[16].y <
    handLandmarks[14].y,

    handLandmarks[20].y <
    handLandmarks[18].y

  ];


  return fingers.filter(Boolean).length >= 3;

}


/* =====================================================
   原始狀態
===================================================== */

function detectRawState(){

  /*
    優先判斷嘴巴。
    如果同時張嘴＋張手，
    先觸發嘴巴互動。
  */

  if(mouthOpen())
    return 'mouthOpen';


  if(handOpen())
    return 'handOpen';


  return 'normal';

}


/* =====================================================
   穩定狀態
===================================================== */

function getStableState(rawState){

  if(rawState !== candidateState){

    candidateState =
      rawState;

    candidateCount =
      1;

    return currentState === 'none'
      ? rawState
      : currentState;

  }


  candidateCount++;


  if(
    candidateCount >=
    STATE_CONFIRM_FRAMES
  ){

    return rawState;

  }


  return currentState === 'none'
    ? rawState
    : currentState;

}


/* =====================================================
   一般影片
===================================================== */

function nextNormalVideo(){

  const name =
    VIDEO_GROUPS.normal[
      normalIndex %
      VIDEO_GROUPS.normal.length
    ];


  normalIndex++;


  return name;

}


/*
  啟動時固定第一支 spider。
*/
function startNormalSequence(){

  normalIndex = 0;

  return nextNormalVideo();

}


/*
  一般影片播放完：

  spider
    ↓
  champion
    ↓
  magic
    ↓
  sleep
    ↓
  spider
*/
async function playNextNormal(){

  /*
    如果現在正在做動作，
    不要自動搶走動作影片。
  */

  if(currentState !== 'normal')
    return;


  const next =
    nextNormalVideo();


  await playCat(
    next
  );

}


/* =====================================================
   動作影片
===================================================== */

function randomFrom(list){

  return list[
    Math.floor(
      Math.random() *
      list.length
    )
  ];

}


/* =====================================================
   播放影片
===================================================== */

async function playCat(name){

  if(!name)
    return;


  /*
    避免多個 async 同時切換。
  */

  while(changingVideo){

    await new Promise(
      resolve =>
        setTimeout(resolve,30)
    );

  }


  changingVideo = true;


  const token =
    ++videoChangeToken;


  try{

    /*
      停止上一支
    */

    try{

      testVideo.pause();

      testVideo.currentTime =
        0;

    }

    catch(e){}


    currentVideo =
      name;


    $('currentVideoText').textContent =
      name;


    setStatus(
      'catStatus',
      `⏳ ${name}`,
      'wait'
    );


    log(
      `🐱 播放：${name}`
    );


    /*
      清除舊 source
    */

    testVideo.src =
      '';

    testVideo.removeAttribute(
      'src'
    );

    testVideo.load();


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          30
        )
    );


    /*
      新影片
    */

    testVideo.src =
      `./${name}`;


    testVideo.load();


    await new Promise(
      (resolve,reject) => {

        let finished =
          false;


        const cleanup =
          () => {

            testVideo.removeEventListener(
              'loadeddata',
              onLoad
            );

            testVideo.removeEventListener(
              'error',
              onError
            );

          };


        const onLoad =
          () => {

            if(finished)
              return;


            finished = true;

            cleanup();

            resolve();

          };


        const onError =
          () => {

            if(finished)
              return;


            finished = true;

            cleanup();

            reject(
              new Error(
                '影片載入失敗'
              )
            );

          };


        testVideo.addEventListener(
          'loadeddata',
          onLoad
        );


        testVideo.addEventListener(
          'error',
          onError
        );

      }
    );


    /*
      如果在等待載入期間，
      又有新的影片切換，
      不要播放這一支。
    */

    if(token !== videoChangeToken)
      return;


    testVideo.currentTime =
      0;


    setStatus(
      'catStatus',
      `✅ ${name}`,
      'ok'
    );


    try{

      await testVideo.play();

    }

    catch(e){

      log(
        `⚠️ 播放需要使用者操作：${e.name}`
      );

    }

  }

  catch(e){

    log(
      `❌ 影片載入失敗：${name} / ${e.message}`
    );


    setStatus(
      'catStatus',
      `❌ ${name}`,
      'bad'
    );

  }

  finally{

    changingVideo =
      false;

  }

}


/* =====================================================
   狀態 → 影片
===================================================== */

async function changeARVideo(state){

  if(
    state === currentState &&
    currentVideo
  ){

    return;

  }


  currentState =
    state;


  updateInteractionGuide(
    state
  );


  let name;


  /*
    張嘴
  */

  if(state === 'mouthOpen'){

    name =
      randomFrom(
        VIDEO_GROUPS.mouthOpen
      );

  }


  /*
    張開手掌
  */

  else if(state === 'handOpen'){

    name =
      randomFrom(
        VIDEO_GROUPS.handOpen
      );

  }


  /*
    一般狀態
  */

  else{

    /*
      如果已經有影片正在播放，
      不因為狀態變成 normal 就立刻重播。
    */

    if(
      currentVideo &&
      !testVideo.ended
    ){

      return;

    }


    name =
      nextNormalVideo();

  }


  await playCat(
    name
  );

}


/* =====================================================
   臉部範圍
===================================================== */

function getFaceBox(){

  if(!faceLandmarks)
    return null;


  let minX = 1;

  let maxX = 0;

  let minY = 1;

  let maxY = 0;


  for(
    const p of faceLandmarks
  ){

    minX =
      Math.min(
        minX,
        p.x
      );


    maxX =
      Math.max(
        maxX,
        p.x
      );


    minY =
      Math.min(
        minY,
        p.y
      );


    maxY =
      Math.max(
        maxY,
        p.y
      );

  }


  return {

    minX,

    maxX,

    minY,

    maxY,

    width:
      (maxX-minX) *
      canvas.width,

    height:
      (maxY-minY) *
      canvas.height,

    centerX:
      ((minX+maxX)/2) *
      canvas.width,

    centerY:
      ((minY+maxY)/2) *
      canvas.height,

    topY:
      minY *
      canvas.height

  };

}


/* =====================================================
   美膚
===================================================== */

function drawBeauty(){

  if(
    !faceLandmarks ||
    beautyStrength <= 0
  ){

    return;

  }


  const box =
    getFaceBox();


  if(!box)
    return;


  const padX =
    box.width * .18;


  const padY =
    box.height * .22;


  const x =
    Math.max(
      0,
      box.minX *
      canvas.width -
      padX
    );


  const y =
    Math.max(
      0,
      box.minY *
      canvas.height -
      padY
    );


  const w =
    Math.min(
      canvas.width-x,
      box.width +
      padX*2
    );


  const h =
    Math.min(
      canvas.height-y,
      box.height +
      padY*2
    );


  ctx.save();


  ctx.globalAlpha =
    .12 +
    (beautyStrength / 100) * .30;


  ctx.filter =
    `blur(${2 + beautyStrength * .045}px)`;


  ctx.drawImage(
    canvas,
    x,
    y,
    w,
    h,
    x,
    y,
    w,
    h
  );


  ctx.filter =
    'none';


  ctx.globalAlpha =
    (beautyStrength / 100) * .16;


  ctx.filter =
    `blur(${1 + beautyStrength * .025}px)`;


  ctx.drawImage(
    canvas,
    x,
    y,
    w,
    h,
    x,
    y,
    w,
    h
  );


  ctx.restore();

}


/* =====================================================
   貓咪 AR
===================================================== */

function drawCat(){

  if(
    !faceLandmarks ||
    testVideo.readyState <
      HTMLMediaElement.HAVE_CURRENT_DATA
  ){

    return;

  }


  const box =
    getFaceBox();


  if(!box)
    return;


  /*
    ================================
    貓咪尺寸調整
    ================================

    原本：
      box.width * .62

    現在放大：
      0.78 倍臉寬

    同時使用較直立的比例。
  */

  const catWidth =
    box.width * .78;


  /*
    直立比例。
    如果影片本身有實際尺寸，
    優先依影片原始比例。
  */

  const videoW =
    testVideo.videoWidth ||
    1;


  const videoH =
    testVideo.videoHeight ||
    1;


  const aspect =
    videoH / videoW;


  const catHeight =
    catWidth *
    Math.max(
      1.05,
      Math.min(
        1.45,
        aspect
      )
    );


  /*
    X：臉部中央
  */

  const x =
    box.centerX -
    catWidth / 2;


  /*
    Y：頭頂上方。

    數值降低代表影片更靠近頭頂。
  */

  const y =
    box.topY -
    catHeight * .78;


  ctx.save();


  ctx.globalAlpha =
    1;


  ctx.drawImage(
    testVideo,
    x,
    y,
    catWidth,
    catHeight
  );


  ctx.restore();

}


/* =====================================================
   AR 畫面
===================================================== */

function drawAR(){

  if(!video.videoWidth)
    return;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    鏡像相機
  */

  ctx.save();


  ctx.translate(
    canvas.width,
    0
  );


  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();


  /*
    美膚
  */

  drawBeauty();


  /*
    貓咪
  */

  drawCat();


  setStatus(
    'canvasStatus',
    '✅ AR 正在運作',
    'ok'
  );

}


/* =====================================================
   錄影畫面
===================================================== */

function updateRecordCanvas(){

  const w =
    video.videoWidth ||
    640;


  const h =
    video.videoHeight ||
    480;


  if(
    recordCanvas.width !== w ||
    recordCanvas.height !== h
  ){

    recordCanvas.width =
      w;

    recordCanvas.height =
      h;

  }


  recordCtx.clearRect(
    0,
    0,
    w,
    h
  );


  recordCtx.drawImage(
    canvas,
    0,
    0,
    w,
    h
  );

}


/* =====================================================
   錄影 Loop
===================================================== */

function recordFrame(){

  if(!recording)
    return;


  updateRecordCanvas();


  requestAnimationFrame(
    recordFrame
  );

}


/* =====================================================
   MediaRecorder
===================================================== */

function supportedMime(){

  if(!window.MediaRecorder)
    return '';


  const types = [

    'video/mp4;codecs=avc1.42E01E',

    'video/mp4',

    'video/webm;codecs=vp9',

    'video/webm;codecs=vp8',

    'video/webm'

  ];


  return types.find(
    type =>
      MediaRecorder.isTypeSupported?.(
        type
      )
  ) || '';

}


/* =====================================================
   錄影
===================================================== */

$('recordBtn').onclick =
  () => {

    if(!arStarted){

      log(
        '請先啟動 AR'
      );

      return;

    }


    if(recording){

      recorder.stop();

      return;

    }


    if(
      !recordCanvas.captureStream ||
      !window.MediaRecorder
    ){

      log(
        '❌ 此瀏覽器不支援錄影'
      );

      return;

    }


    const capture =
      recordCanvas.captureStream(
        30
      );


    const mime =
      supportedMime();


    try{

      recorder =
        mime
          ? new MediaRecorder(
              capture,
              {
                mimeType:mime
              }
            )
          : new MediaRecorder(
              capture
            );

    }

    catch(e){

      log(
        `❌ MediaRecorder 建立失敗：${e.message}`
      );

      return;

    }


    chunks = [];


    recorder.ondataavailable =
      e => {

        if(e.data?.size){

          chunks.push(
            e.data
          );

        }

      };


    recorder.onstop =
      () => {

        const type =
          recorder.mimeType ||
          mime ||
          'video/webm';


        recordedBlob =
          new Blob(
            chunks,
            {
              type
            }
          );


        if(recordedUrl){

          URL.revokeObjectURL(
            recordedUrl
          );

        }


        recordedUrl =
          URL.createObjectURL(
            recordedBlob
          );


        recordPreview.src =
          recordedUrl;


        recordPreview.style.display =
          'block';


        $('saveVideoBtn')
          .classList.add(
            'show'
          );


        recording =
          false;


        $('recordBtn').textContent =
          '🔴 開始錄影';


        $('recordBtn')
          .classList.remove(
            'recording'
          );


        log(
          `✅ 錄影完成：${type}`
        );

      };


    recorder.start(
      1000
    );


    recording =
      true;


    $('recordBtn').textContent =
      '⏹ 停止錄影';


    $('recordBtn')
      .classList.add(
        'recording'
      );


    $('saveVideoBtn')
      .classList.remove(
        'show'
      );


    log(
      `🔴 開始錄影：${mime || '瀏覽器格式'}`
    );


    recordFrame();

  };


/* =====================================================
   儲存影片
===================================================== */

$('saveVideoBtn').onclick =
  () => {

    if(!recordedBlob){

      log(
        '目前沒有可儲存的影片'
      );

      return;

    }


    const type =
      recordedBlob.type ||
      'video/webm';


    const extension =
      type.includes('mp4')
        ? 'mp4'
        : 'webm';


    const url =
      URL.createObjectURL(
        recordedBlob
      );


    const a =
      document.createElement(
        'a'
      );


    a.href =
      url;


    a.download =
      `AR_cat_${Date.now()}.${extension}`;


    document.body.appendChild(
      a
    );


    a.click();


    a.remove();


    setTimeout(
      () =>
        URL.revokeObjectURL(
          url
        ),
      3000
    );


    log(
      '💾 影片已送出儲存'
    );

  };

===================================================== */

testVideo.loop =
  false;


testVideo.addEventListener(
  'ended',
  async () => {

    const finishedVideo =
      currentVideo;


    log(
      `⏹ 播放完成：${finishedVideo}`
    );


    /*
      =================================
      最重要的自動接續邏輯
      =================================

      如果是一般狀態：
      
      spider → champion
      champion → magic
      magic → sleep
      sleep → spider
    */

    if(currentState === 'normal'){

      /*
        確保不是使用者剛剛做了動作。
      */

      const raw =
        detectRawState();


      if(raw === 'normal'){

        await playNextNormal();

      }

      else{

        /*
          如果影片剛播放完，
          同一時間使用者做了動作，
          交給 AR Loop 處理。
        */

        currentState =
          'none';

      }

      return;

    }


    /*
      =================================
      動作影片播放完
      =================================

      動作結束後：

      如果使用者已經沒有做動作，
      自動回到一般影片系列。

      如果還在張嘴 / 張手，
      暫時停留，不會瘋狂重播。
    */

    const raw =
      detectRawState();


    if(raw === 'normal'){

      currentState =
        'normal';


      updateInteractionGuide(
        'normal'
      );


      await playNextNormal();

    }

    else{

      /*
        保留目前動作狀態。
        等使用者回到一般狀態。
      */

      log(
        '等待使用者結束互動動作'
      );

    }

  }
);


/* =====================================================
   AR Loop
===================================================== */

async function arLoop(ts){

  if(!arStarted)
    return;


  resizeCanvas();


  drawAR();


  const mouth =
    mouthOpen();


  const hand =
    handOpen();


  $('mouthText').textContent =
    faceLandmarks
      ? (
          mouth
            ? '👄 張嘴'
            : '閉嘴'
        )
      : '未偵測';


  $('handText').textContent =
    handLandmarks
      ? (
          hand
            ? '✋ 張開手掌'
            : '手掌未完全張開'
        )
      : '未偵測';


  /*
    ================================
    狀態判斷
    ================================
  */

  if(faceLandmarks){

    const rawState =
      detectRawState();


    const state =
      getStableState(
        rawState
      );


    $('stateText').textContent =

      state === 'mouthOpen'
        ? '👄 張嘴'

      : state === 'handOpen'
        ? '✋ 張開手掌'

      : '😺 一般';


    /*
      狀態真正改變才換影片。
    */

    if(
      state !== currentState &&
      !changingVideo
    ){

      await changeARVideo(
        state
      );

    }

  }


  /*
    MediaPipe
  */

  if(
    ts - lastProcess >= 70
  ){

    lastProcess =
      ts;


    try{

      await faceMesh.send({
        image:video
      });


      await hands.send({
        image:video
      });

    }

    catch(e){

      log(
        `MediaPipe 錯誤：${e.message}`
      );

    }

  }


  requestAnimationFrame(
    arLoop
  );

}
