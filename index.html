<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Face Cat Filter</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- 引入 MindAR Face Tracking 專用 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
  <!-- 使用 mindar-face 模型 -->
  <a-scene mindar-face color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <img id="cat_0" src="hand_open_01_1.png">
      <img id="cat_1" src="hand_open_01_2.png">
      <img id="cat_2" src="hand_open_01_3.png">
      <img id="cat_2" src="hand_open_01_4.png">
      <img id="cat_2" src="hand_open_01_5.png">
      <img id="cat_2" src="hand_open_01_6.png">
      <img id="cat_0" src="hand_open_02_1.png">
      <img id="cat_1" src="hand_open_02_2.png">
      <img id="cat_2" src="hand_open_02_3.png">
      <img id="cat_2" src="hand_open_02_4.png">
      <img id="cat_2" src="hand_open_02_5.png">
      <img id="cat_2" src="hand_open_02_6.png">
      <img id="cat_3" src="idle_01_1.jpg">
      <img id="cat_4" src="idle_01_2.jpg">
      <img id="cat_4" src="idle_01_3.jpg">
      <img id="cat_4" src="idle_01_4.jpg">
      <img id="cat_4" src="idle_01_5.jpg">
      <img id="cat_4" src="idle_01_6.jpg">
      <img id="cat_3" src="idle_02_1.jpg">
      <img id="cat_4" src="idle_02_2.jpg">
      <img id="cat_4" src="idle_02_3.jpg">
      <img id="cat_4" src="idle_02_4.jpg">
      <img id="cat_4" src="idle_02_5.jpg">
      <img id="cat_4" src="idle_02_6.jpg">
      <img id="cat_5" src="mouth_open_01_1.png">
      <img id="cat_5" src="mouth_open_01_2.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 綁定在臉部錨點（anchorIndex: 10 代表額頭上方或帽子位置） -->
    <a-entity mindar-face-target="anchorIndex: 10">
      <a-plane id="animated-cat" src="#cat_0" position="0 0.5 0" height="0.8" width="0.8" rotation="0 0 0"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const frames = ["#cat_0", "#cat_1", "#cat_2", "#cat_3", "#cat_4", "#cat_5"];
    let currentFrame = 0;
    const catPlane = document.querySelector('#animated-cat');

    // 每 100 毫秒自動播放動畫序列
    setInterval(() => {
      currentFrame = (currentFrame + 1) % frames.length;
      catPlane.setAttribute('src', frames[currentFrame]);
    }, 100);
  </script>
</body>
</html>
