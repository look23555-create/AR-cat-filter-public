<script>

'use strict';


/* =====================================================
   影片設定
===================================================== */

const VIDEO_GROUPS = {

  /*
    一般狀態
  */

  normal:[
    'spider_cat_animation.mp4',
    'champion_cat_animation.mp4',
    'magic_cat_animation.mp4',
    'sleep_cat_animation.mp4'
  ],


  /*
    張開嘴巴
  */

  mouthOpen:[
    'chef_cat_animation.mp4',
    'eat_cat_animation.mp4',
    'drink_cat_animation.mp4'
  ],


  /*
    張開手掌
  */

  handOpen:[
    'cry_cat_animation.mp4.mp4',
    'work_cat_animation.mp4'
  ]

};


/* =====================================================
   DOM
===================================================== */

const $ =
  id => document.getElementById(id);


const video =
  $('webcam');


const canvas =
  $('output');


const ctx =
  canvas.getContext(
    '2d',
    {
      willReadFrequently:false
    }
  );


/*
   貓咪影片元素。

   這個元素不直接顯示，
   只拿來做 AR texture。
*/

const catVideo =
  document.createElement('video');


catVideo.muted = true;

catVideo.playsInline = true;

catVideo.setAttribute(
  'playsinline',
  ''
);

catVideo.setAttribute(
  'webkit-playsinline',
  ''
);

catVideo.preload = 'auto';

catVideo.loop = false;


/* =====================================================
   狀態
===================================================== */

let stream = null;

let facingMode = 'user';

let arStarted = false;

let faceLandmarks = null;

let handLandmarks = null;


/*
   初始狀態直接設定為 normal。

   這樣 AR 啟動後，
   不需要等待「狀態變化」才播放第一支影片。
*/

let currentState = 'normal';

let currentVideo = '';

let normalIndex = 0;


/*
   防止同一時間重複切換影片。
*/

let videoChanging = false;


/*
   MediaPipe 處理時間。
*/

let lastProcess = 0;


/*
   AR frame。
*/

let animationFrame = null;


/* =====================================================
   錄影
===================================================== */

let recording = false;

let recorder = null;

let recordChunks = [];

let recordedBlob = null;

let recordedUrl = null;


/*
   錄影使用另一張 Canvas。

   內容就是使用者看到的完整 AR。
*/

const recordCanvas =
  document.createElement('canvas');


const recordCtx =
  recordCanvas.getContext('2d');


/* =====================================================
   美膚
===================================================== */

let beautyStrength = 65;


/* =====================================================
   UI
===================================================== */

function showStatus(text){

  const el =
    $('topStatus');

  el.textContent =
    text;

  el.classList.add('show');


  clearTimeout(
    showStatus.timer
  );


  showStatus.timer =
    setTimeout(
      () => {

        el.classList.remove(
          'show'
        );

      },
      1800
    );

}


/* =====================================================
   MediaPipe FaceMesh
===================================================== */

const faceMesh =
  new FaceMesh({

    locateFile:file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`

  });


faceMesh.setOptions({

  maxNumFaces:1,

  refineLandmarks:true,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


faceMesh.onResults(
  results => {

    faceLandmarks =
      results.multiFaceLandmarks?.[0]
      || null;

  }
);


/* =====================================================
   MediaPipe Hands
===================================================== */

const hands =
  new Hands({

    locateFile:file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


hands.onResults(
  results => {

    handLandmarks =
      results.multiHandLandmarks?.[0]
      || null;

  }
);


/* =====================================================
   相機
===================================================== */

async function startCamera(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    throw new Error(
      '此瀏覽器不支援相機'
    );

  }


  /*
     關閉舊鏡頭
  */

  if(stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  /*
     開啟相機
  */

  stream =
    await navigator.mediaDevices.getUserMedia({

      audio:false,

      video:{

        facingMode:{
          ideal:facingMode
        },

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        },

        frameRate:{
          ideal:30,
          max:30
        }

      }

    });


  video.srcObject =
    stream;


  await video.play();


  await new Promise(
    resolve => {

      if(video.readyState >= 2){

        resolve();

      }else{

        video.addEventListener(
          'loadeddata',
          resolve,
          {once:true}
        );

      }

    }
  );


  resizeCanvas();

}


/* =====================================================
   切換鏡頭
===================================================== */

async function switchCamera(){

  if(!arStarted)
    return;


  facingMode =
    facingMode === 'user'
      ? 'environment'
      : 'user';


  try{

    await startCamera();


    showStatus(
      facingMode === 'user'
        ? '🤳 前鏡頭'
        : '📷 後鏡頭'
    );


  }catch(error){

    /*
       如果切換失敗，
       回復原來鏡頭。
    */

    facingMode =
      facingMode === 'user'
        ? 'environment'
        : 'user';


    await startCamera();

  }

}


/* =====================================================
   Canvas 尺寸
===================================================== */

function resizeCanvas(){

  const width =
    video.videoWidth || 1280;


  const height =
    video.videoHeight || 720;


  if(
    canvas.width !== width ||
    canvas.height !== height
  ){

    canvas.width =
      width;

    canvas.height =
      height;


    recordCanvas.width =
      width;

    recordCanvas.height =
      height;

  }

}


/* =====================================================
   嘴巴偵測
===================================================== */

function mouthOpen(){

  if(!faceLandmarks)
    return false;


  const upper =
    faceLandmarks[13];


  const lower =
    faceLandmarks[14];


  if(!upper || !lower)
    return false;


  const distance =
    Math.abs(
      lower.y -
      upper.y
    );


  return distance > .045;

}


/* =====================================================
   手掌偵測
===================================================== */

function handOpen(){

  if(!handLandmarks)
    return false;


  const fingers = [

    handLandmarks[8].y <
    handLandmarks[6].y,

    handLandmarks[12].y <
    handLandmarks[10].y,

    handLandmarks[16].y <
    handLandmarks[14].y,

    handLandmarks[20].y <
    handLandmarks[18].y

  ];


  return (
    fingers.filter(Boolean)
      .length >= 3
  );

}


/* =====================================================
   狀態
===================================================== */

function detectState(){

  /*
     嘴巴優先。
  */

  if(
    mouthOpen()
  ){

    return 'mouthOpen';

  }


  /*
     再判斷手掌。
  */

  if(
    handOpen()
  ){

    return 'handOpen';

  }


  /*
     都沒有就是一般。
  */

  return 'normal';

}


/* =====================================================
   影片選擇
===================================================== */

function getNextNormalVideo(){

  const list =
    VIDEO_GROUPS.normal;


  /*
     一般狀態循環播放：

     spider
     champion
     magic
     sleep

     但是只有狀態「進入 normal」
     時才會換。

     不會因為影片播放完就自動換。
  */

  const name =
    list[
      normalIndex %
      list.length
    ];


  normalIndex++;


  return name;

}


/* =====================================================
   動作影片選擇
===================================================== */

function getActionVideo(state){

  const list =
    VIDEO_GROUPS[state];


  if(
    !list ||
    !list.length
  ){

    return null;

  }


  /*
     動作影片隨機選擇。

     避免連續兩次選到完全相同的影片。
  */

  let index =
    Math.floor(
      Math.random() *
      list.length
    );


  if(
    list.length > 1 &&
    list[index] === currentVideo
  ){

    index =
      (index + 1) %
      list.length;

  }


  return list[index];

}


/* =====================================================
   播放貓咪
===================================================== */

async function playCat(name){

  if(!name)
    return;


  /*
     同一支影片正在播放，
     不重新載入。
  */

  if(
    currentVideo === name &&
    !catVideo.paused
  ){

    return;

  }


  /*
     防止多次 MediaPipe frame
     同時要求切換影片。
  */

  if(videoChanging)
    return;


  videoChanging = true;


  try{

    /*
       停止舊影片。
    */

    catVideo.pause();


    /*
       回到影片第一幀。
    */

    try{

      catVideo.currentTime = 0;

    }catch(e){}


    /*
       設定新影片。
    */

    currentVideo =
      name;


    catVideo.src =
      `./${name}`;


    catVideo.load();


    /*
       等待影片可播放。
    */

    await new Promise(
      (resolve,reject) => {

        let finished = false;


        const cleanup =
          () => {

            catVideo.removeEventListener(
              'loadeddata',
              onLoaded
            );

            catVideo.removeEventListener(
              'canplay',
              onLoaded
            );

            catVideo.removeEventListener(
              'error',
              onError
            );

          };


        const onLoaded =
          () => {

            if(finished)
              return;

            finished = true;

            cleanup();

            resolve();

          };


        const onError =
          () => {

            if(finished)
              return;

            finished = true;

            cleanup();

            reject(
              new Error(
                `影片無法載入：${name}`
              )
            );

          };


        catVideo.addEventListener(
          'loadeddata',
          onLoaded
        );


        catVideo.addEventListener(
          'canplay',
          onLoaded
        );


        catVideo.addEventListener(
          'error',
          onError
        );


        /*
           避免載入異常永久等待。
        */

        setTimeout(
          () => {

            if(finished)
              return;

            finished = true;

            cleanup();

            resolve();

          },
          5000
        );

      }
    );


    /*
       每次切換都從第 0 秒。
    */

    try{

      catVideo.currentTime = 0;

    }catch(e){}


    /*
       播放。

       因為 AR 已經由使用者點擊開始，
       通常可以正常 autoplay。
    */

    try{

      await catVideo.play();

    }catch(e){

      /*
         如果手機瀏覽器拒絕，
         下一次使用者互動仍可重新播放。
      */

    }


  }finally{

    videoChanging = false;

  }

}


/* =====================================================
   Face Box
===================================================== */

function getFaceBox(){

  if(!faceLandmarks)
    return null;


  let minX = 1;

  let maxX = 0;

  let minY = 1;

  let maxY = 0;


  for(
    const point
    of faceLandmarks
  ){

    minX =
      Math.min(
        minX,
        point.x
      );


    maxX =
      Math.max(
        maxX,
        point.x
      );


    minY =
      Math.min(
        minY,
        point.y
      );


    maxY =
      Math.max(
        maxY,
        point.y
      );

  }


  const centerX =
    (minX + maxX) / 2;


  /*
     非常重要：

     MediaPipe 座標是原始相機方向。

     前鏡頭顯示給使用者時會水平鏡像，
     所以 X 必須轉換：

        mirroredX = 1 - originalX

     這就是修正左右相反的核心。
  */

  const mirroredCenterX =
    facingMode === 'user'
      ? 1 - centerX
      : centerX;


  const mirroredMinX =
    facingMode === 'user'
      ? 1 - maxX
      : minX;


  const mirroredMaxX =
    facingMode === 'user'
      ? 1 - minX
      : maxX;


  const width =
    Math.abs(
      mirroredMaxX -
      mirroredMinX
    ) *
    canvas.width;


  return {

    minX:
      mirroredMinX *
      canvas.width,

    maxX:
      mirroredMaxX *
      canvas.width,

    minY:
      minY *
      canvas.height,

    maxY:
      maxY *
      canvas.height,

    width,

    centerX:
      mirroredCenterX *
      canvas.width,

    topY:
      minY *
      canvas.height

  };

}


/* =====================================================
   美膚
===================================================== */

function drawBeauty(){

  if(
    !faceLandmarks ||
    beautyStrength <= 0
  ){

    return;

  }


  const box =
    getFaceBox();


  if(!box)
    return;


  const paddingX =
    box.width *
    .18;


  const paddingY =
    box.width *
    .22;


  const x =
    Math.max(
      0,
      box.minX -
      paddingX
    );


  const y =
    Math.max(
      0,
      box.minY -
      paddingY
    );


  const right =
    Math.min(
      canvas.width,
      box.maxX +
      paddingX
    );


  const bottom =
    Math.min(
      canvas.height,
      box.maxY +
      paddingY
    );


  const width =
    right - x;


  const height =
    bottom - y;


  if(
    width <= 0 ||
    height <= 0
  ){

    return;

  }


  /*
     第一層柔化。
  */

  ctx.save();


  ctx.globalAlpha =
    .10 +
    beautyStrength /
    100 *
    .25;


  ctx.filter =
    `blur(${
      1.5 +
      beautyStrength *
      .035
    }px)`;


  ctx.drawImage(
    canvas,

    x,
    y,
    width,
    height,

    x,
    y,
    width,
    height
  );


  /*
     第二層。
  */

  ctx.globalAlpha =
    beautyStrength /
    100 *
    .12;


  ctx.filter =
    `blur(${
      1 +
      beautyStrength *
      .02
    }px)`;


  ctx.drawImage(
    canvas,

    x,
    y,
    width,
    height,

    x,
    y,
    width,
    height
  );


  ctx.restore();

}


/* =====================================================
   貓咪定位
===================================================== */

function drawCat(){

  if(
    !faceLandmarks
  ){

    return;

  }


  if(
    catVideo.readyState <
    HTMLMediaElement.HAVE_CURRENT_DATA
  ){

    return;

  }


  const box =
    getFaceBox();


  if(!box)
    return;


  /*
     貓咪大小。

     目前維持在頭頂，
     不覆蓋臉部。
  */

  const size =
    box.width *
    .62;


  /*
     X 使用「已鏡像」的 face center。

     所以人物往左，
     貓咪也跟著往左。
  */

  const x =
    box.centerX -
    size / 2;


  /*
     貓咪位於頭頂。
  */

  const y =
    box.topY -
    size *
    .78;


  ctx.save();


  ctx.globalAlpha = 1;


  /*
     貓咪影片本身不要再鏡像。

     因為 Canvas 已經依照鏡頭方向
     完成正確畫面。
  */

  ctx.drawImage(
    catVideo,
    x,
    y,
    size,
    size
  );


  ctx.restore();

}


/* =====================================================
   AR 畫面
===================================================== */

function drawAR(){

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    return;

  }


  resizeCanvas();


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
     ==================================================
     前鏡頭
     ==================================================

     使用者習慣自拍時：

       左手 → 畫面左邊
       右手 → 畫面右邊

     所以畫面要鏡像一次。
  */

  if(
    facingMode === 'user'
  ){

    ctx.save();


    ctx.translate(
      canvas.width,
      0
    );


    ctx.scale(
      -1,
      1
    );


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.restore();

  }


  /*
     ==================================================
     後鏡頭
     ==================================================

     後鏡頭維持原始方向。
  */

  else{

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  /*
     美膚
  */

  drawBeauty();


  /*
     貓咪
  */

  drawCat();

}


/* =====================================================
   AR 狀態切換
===================================================== */

async function updateARState(){

  if(
    !faceLandmarks
  ){

    return;

  }


  const state =
    detectState();


  /*
     狀態沒有變化：

     不換影片。

     這非常重要。
  */

  if(
    state === currentState
  ){

    return;

  }


  currentState =
    state;


  let nextVideo = null;


  /*
     張嘴
  */

  if(
    state === 'mouthOpen'
  ){

    nextVideo =
      getActionVideo(
        'mouthOpen'
      );

  }


  /*
     張開手掌
  */

  else if(
    state === 'handOpen'
  ){

    nextVideo =
      getActionVideo(
        'handOpen'
      );

  }


  /*
     回到一般
  */

  else{

    nextVideo =
      getNextNormalVideo();

  }


  if(nextVideo){

    await playCat(
      nextVideo
    );

  }

}


/* =====================================================
   AR Loop
===================================================== */

async function arLoop(timestamp){

  if(!arStarted)
    return;


  /*
     先畫面。

     這樣畫面一直維持流暢。
  */

  drawAR();


  /*
     動作辨識。

     不需要每一幀都跑，
     降低手機負載。
  */

  if(
    timestamp -
    lastProcess >= 70
  ){

    lastProcess =
      timestamp;


    try{

      await faceMesh.send({
        image:video
      });


      await hands.send({
        image:video
      });


      await updateARState();

    }catch(error){

      /*
         正式版不顯示診斷訊息。
      */

    }

  }


  animationFrame =
    requestAnimationFrame(
      arLoop
    );

}


/* =====================================================
   錄影畫面
===================================================== */

function updateRecordCanvas(){

  const width =
    canvas.width;


  const height =
    canvas.height;


  if(
    recordCanvas.width !== width ||
    recordCanvas.height !== height
  ){

    recordCanvas.width =
      width;

    recordCanvas.height =
      height;

  }


  recordCtx.clearRect(
    0,
    0,
    width,
    height
  );


  /*
     直接錄製使用者看到的完整 AR。
  */

  recordCtx.drawImage(
    canvas,
    0,
    0,
    width,
    height
  );

}


/* =====================================================
   錄影 Loop
===================================================== */

function recordFrame(){

  if(!recording)
    return;


  updateRecordCanvas();


  requestAnimationFrame(
    recordFrame
  );

}


/* =====================================================
   MediaRecorder 格式
===================================================== */

function supportedMime(){

  if(
    !window.MediaRecorder
  ){

    return '';

  }


  const types = [

    'video/mp4;codecs=avc1.42E01E',

    'video/mp4',

    'video/webm;codecs=vp9',

    'video/webm;codecs=vp8',

    'video/webm'

  ];


  return types.find(
    type =>
      MediaRecorder.isTypeSupported?.(
        type
      )
  ) || '';

}


/* =====================================================
   開始 / 停止錄影
===================================================== */

$('recordBtn').onclick =
  () => {

    if(!arStarted)
      return;


    /*
       如果正在錄影，
       再按一次停止。
    */

    if(recording){

      if(recorder){

        recorder.stop();

      }

      return;

    }


    if(
      !recordCanvas.captureStream ||
      !window.MediaRecorder
    ){

      showStatus(
        '此裝置不支援錄影'
      );

      return;

    }


    updateRecordCanvas();


    const capture =
      recordCanvas.captureStream(
        30
      );


    const mime =
      supportedMime();


    try{

      recorder =
        mime
          ? new MediaRecorder(
              capture,
              {
                mimeType:mime
              }
            )
          : new MediaRecorder(
              capture
            );

    }catch(error){

      showStatus(
        '錄影無法啟動'
      );

      return;

    }


    recordChunks = [];


    recorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size
        ){

          recordChunks.push(
            event.data
          );

        }

      };


    recorder.onstop =
      () => {

        const type =
          recorder.mimeType ||
          mime ||
          'video/webm';


        recordedBlob =
          new Blob(
            recordChunks,
            {
              type
            }
          );


        if(recordedUrl){

          URL.revokeObjectURL(
            recordedUrl
          );

        }


        recordedUrl =
          URL.createObjectURL(
            recordedBlob
          );


        $('recordPreview').src =
          recordedUrl;


        recording = false;


        $('recordBtn')
          .classList
          .remove(
            'recording'
          );


        $('recordBtn')
          .textContent =
          '●';


        showStatus(
          '✓ 錄影完成'
        );


        /*
           完成後直接儲存。

           不需要顯示測試畫面。
        */

        saveRecordedVideo();

      };


    recorder.start(
      1000
    );


    recording = true;


    $('recordBtn')
      .classList
      .add(
        'recording'
      );


    $('recordBtn')
      .textContent =
      '■';


    recordFrame();


    showStatus(
      '🔴 錄影中'
    );

  };


/* =====================================================
   儲存錄影
===================================================== */

function saveRecordedVideo(){

  if(!recordedBlob)
    return;


  const type =
    recordedBlob.type ||
    'video/webm';


  const extension =
    type.includes('mp4')
      ? 'mp4'
      : 'webm';


  const url =
    URL.createObjectURL(
      recordedBlob
    );


  const link =
    document.createElement(
      'a'
    );


  link.href =
    url;


  link.download =
    `AR_cat_${Date.now()}.${extension}`;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    3000
  );

}


/* =====================================================
   拍照
===================================================== */

$('snapshotBtn').onclick =
  () => {

    if(!arStarted)
      return;


    updateRecordCanvas();


    recordCanvas.toBlob(
      blob => {

        if(!blob)
          return;


        const url =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement(
            'a'
          );


        link.href =
          url;


        link.download =
          `AR_cat_${Date.now()}.jpg`;


        document.body.appendChild(
          link
        );


        link.click();


        link.remove();


        setTimeout(
          () => {

            URL.revokeObjectURL(
              url
            );

          },
          2000
        );


        showStatus(
          '📸 照片已儲存'
        );

      },
      'image/jpeg',
      .94
    );

  };


/* =====================================================
   美膚
===================================================== */

$('beautyBtn').onclick =
  () => {

    $('beautyPanel')
      .classList
      .toggle(
        'show'
      );

  };


$('beautyRange').addEventListener(

  event => {

    beautyStrength =
      Number(
        event.target.value
      );


    $('beautyValue')
      .textContent =
      beautyStrength;

  }
);


/* =====================================================
   啟動 AR
===================================================== */

$('startBtn').onclick =
  async () => {

    try{

      /*
         開啟相機。
      */

      await startCamera();


      /*
         AR 開始。
      */

      arStarted = true;


      /*
         關閉啟動畫面。
      */

      $('startOverlay')
        .classList
        .add(
          'hidden'
        );


      /*
         =================================================
         非常重要：

         AR 一開始狀態就是 normal。

         不需要等 MediaPipe 回傳一次狀態
         才開始播放。

         所以進入 AR 後直接播放第一支。
         =================================================
      */

      currentState =
        'normal';


      normalIndex = 1;


      await playCat(
        VIDEO_GROUPS.normal[0]
      );


      /*
         開始 AR Loop。
      */

      if(animationFrame){

        cancelAnimationFrame(
          animationFrame
        );

      }


      animationFrame =
        requestAnimationFrame(
          arLoop
        );


    }catch(error){

      /*
         正式版只顯示簡單提示，
         不顯示診斷畫面。
      */

      showStatus(
        '無法開啟相機，請確認相機權限'
      );

    }

  };


/* =====================================================
   切換鏡頭
===================================================== */

$('cameraSwitchBtn').onclick =
  switchCamera;


/* =====================================================
   Resize
===================================================== */

window.addEventListener(
  'resize',
  resizeCanvas
);


window.addEventListener(
  'orientationchange',
  () => {

    setTimeout(
      resizeCanvas,
      300
    );

  }
);


/* =====================================================
   影片播放結束
===================================================== */

catVideo.addEventListener(
  'ended',
  () => {

    /*
       不自動換下一支。

       必須等狀態真正改變，
       才會觸發下一部影片。
    */

  }
);


/* =====================================================
   頁面離開
===================================================== */

window.addEventListener(
  'beforeunload',
  () => {

    if(stream){

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if(animationFrame){

      cancelAnimationFrame(
        animationFrame
      );

    }


    if(recordedUrl){

      URL.revokeObjectURL(
        recordedUrl
      );

    }

  }
);

</script>
