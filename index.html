<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AR 貓咪｜GitHub 診斷版</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12;color:#fff;font-family:Arial,"Noto Sans TC",sans-serif}
button{border:0;border-radius:12px;padding:11px 14px;color:#fff;background:#246bfd;font-weight:700;font-size:14px;cursor:pointer}
button:active{transform:scale(.97)}
#app{position:fixed;inset:0;overflow:auto}
#stage{position:relative;width:100vw;height:56.25vw;max-height:62vh;min-height:300px;background:#000;overflow:hidden}
#webcam,#output{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#webcam,#output{transform:scaleX(-1)}
#webcam{z-index:1;background:#000}
#output{z-index:2;pointer-events:none}
#startOverlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);text-align:center;padding:20px}
#startOverlay.hidden{display:none}
#startBox{max-width:420px}
#startBox h1{font-size:24px;margin:0 0 10px}
#startBox p{line-height:1.6;color:#ddd}
#startBtn{font-size:17px;background:#ff4f9a;padding:14px 24px}
#panel{padding:14px;max-width:900px;margin:auto}
h2{font-size:18px;margin:14px 0 8px}
#overall{padding:12px;border-radius:12px;background:#171b24;margin-bottom:10px;font-weight:700}
.statusGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.status{background:#171b24;border-radius:10px;padding:10px;min-height:58px}
.status .title{font-weight:700;margin-bottom:5px}
.ok{color:#42e879}.bad{color:#ff6262}.wait{color:#ffd166}.info{color:#8db4ff}
.small{font-size:12px;color:#aaa;line-height:1.45}
#videoTests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.videoBtn{background:#303746;font-size:12px;padding:9px 6px}
.videoBtn.ok{background:#174f32;color:#fff}
.videoBtn.bad{background:#642a2a;color:#fff}
#testVideo{display:block;width:100%;max-height:240px;background:#000;border-radius:10px;margin-top:8px}
#log{height:150px;overflow:auto;background:#05070a;border:1px solid #272d38;border-radius:10px;padding:9px;font:12px/1.45 monospace;white-space:pre-wrap}
#controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#recordBtn.recording{background:#d72f3d}
#hint{font-size:12px;color:#aaa;margin-top:8px}
@media(max-width:600px){
  #stage{height:60vh;max-height:none;min-height:320px}
  .statusGrid{grid-template-columns:1fr}
  #videoTests{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>
<div id="app">

  <div id="stage">
    <video id="webcam" autoplay muted playsinline webkit-playsinline></video>
    <canvas id="output"></canvas>

    <div id="startOverlay">
      <div id="startBox">
        <h1>🐱 AR 貓咪診斷版</h1>
        <p>
          這個版本會逐項檢查：HTTPS、相機、9 部 MP4、
          MediaPipe 人臉、手掌偵測，以及 AR 畫布。
        </p>
        <button id="startBtn">📷 開始相機與 AR 診斷</button>
      </div>
    </div>
  </div>

  <div id="panel">
    <div id="overall">⏳ 尚未開始診斷</div>

    <div class="statusGrid">
      <div class="status"><div class="title">🌐 網站環境</div><div id="secureStatus" class="wait">等待</div></div>
      <div class="status"><div class="title">📷 相機</div><div id="cameraStatus" class="wait">等待</div></div>
      <div class="status"><div class="title">👤 人臉偵測</div><div id="faceStatus" class="wait">等待</div></div>
      <div class="status"><div class="title">✋ 手掌偵測</div><div id="handStatus" class="wait">等待</div></div>
      <div class="status"><div class="title">🎨 AR Canvas</div><div id="canvasStatus" class="wait">等待</div></div>
      <div class="status"><div class="title">🐱 貓咪影片</div><div id="catStatus" class="wait">等待</div></div>
    </div>

    <h2>🎬 9 部 MP4 逐一測試</h2>
    <div id="videoTests"></div>

    <video id="testVideo" controls muted playsinline webkit-playsinline preload="metadata"></video>

    <div id="controls">
      <button id="cameraSwitchBtn">🔄 切換鏡頭</button>
      <button id="recordBtn">🔴 測試錄影</button>
      <button id="snapshotBtn">📸 測試拍照</button>
    </div>

    <h2>🧠 AR 即時狀態</h2>
    <div id="arState" class="status">
      <div class="title">目前狀態：<span id="stateText" class="info">等待</span></div>
      <div class="small">嘴巴：<span id="mouthText">未偵測</span>　手掌：<span id="handText">未偵測</span></div>
      <div class="small">目前影片：<span id="currentVideoText">無</span></div>
    </div>

    <h2>📋 診斷紀錄</h2>
    <div id="log"></div>
    <div id="hint">
      若某支影片顯示「載入成功但播放失敗」，通常要進一步檢查 MP4 編碼/瀏覽器支援；
      若影片 404，通常是 GitHub 檔名或路徑問題。
    </div>
  </div>
</div>

<script>
'use strict';

/* =========================
   你的 9 部影片
========================= */
const VIDEO_GROUPS = {
  normal: [
    'spider_cat_animation.mp4',
    'champion_cat_animation.mp4',
    'magic_cat_animation.mp4',
    'sleep_cat_animation.mp4'
  ],
  mouthOpen: [
    'chef_cat_animation.mp4',
    'eat_cat_animation.mp4',
    'drink_cat_animation.mp4'
  ],
  handOpen: [
    'cry_cat_animation.mp4',
    'work_cat_animation.mp4'
  ]
};

const ALL_VIDEOS = [...new Set([
  ...VIDEO_GROUPS.normal,
  ...VIDEO_GROUPS.mouthOpen,
  ...VIDEO_GROUPS.handOpen
])];

const $ = id => document.getElementById(id);

const video = $('webcam');
const canvas = $('output');
const ctx = canvas.getContext('2d');
const testVideo = $('testVideo');

let stream = null;
let facingMode = 'user';
let arStarted = false;
let faceLandmarks = null;
let handLandmarks = null;
let currentState = 'normal';
let currentVideo = '';
let normalIndex = 0;
let lastProcess = 0;
let recording = false;
let recorder = null;
let chunks = [];
let combinedCanvas = document.createElement('canvas');
let combinedCtx = combinedCanvas.getContext('2d');

/* =========================
   Log / Status
========================= */
function log(msg, type='info') {
  const time = new Date().toLocaleTimeString();
  $('log').textContent += `[${time}] ${msg}\n`;
  $('log').scrollTop = $('log').scrollHeight;
  console.log(msg);
}

function setStatus(id, text, cls='info') {
  const el = $(id);
  el.textContent = text;
  el.className = cls;
}

function overall(text, cls='info') {
  $('overall').textContent = text;
  $('overall').className = cls;
}

/* =========================
   HTTPS
========================= */
function diagnoseEnvironment() {
  const localhost =
    location.hostname === 'localhost' ||
    location.hostname === '127.0.0.1';

  const secure = window.isSecureContext || localhost;

  if (secure) {
    setStatus('secureStatus', '✅ HTTPS / 安全來源', 'ok');
    log('網站環境 OK：secure context');
  } else {
    setStatus('secureStatus', '❌ 不是 HTTPS', 'bad');
    log('網站環境錯誤：相機需要 HTTPS（localhost 除外）', 'bad');
  }

  if (navigator.mediaDevices?.getUserMedia) {
    log('getUserMedia API 可用');
  } else {
    log('❌ getUserMedia API 不可用', 'bad');
    setStatus('cameraStatus', '❌ API 不可用', 'bad');
  }
}

/* =========================
   MediaPipe
========================= */
const faceMesh = new FaceMesh({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  faceLandmarks =
    results.multiFaceLandmarks?.[0] || null;

  if (faceLandmarks) {
    setStatus('faceStatus', '✅ 偵測到人臉', 'ok');
  } else {
    setStatus('faceStatus', '⚠️ 等待人臉', 'wait');
  }
});

const hands = new Hands({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

hands.onResults(results => {
  handLandmarks =
    results.multiHandLandmarks?.[0] || null;

  if (handLandmarks) {
    setStatus('handStatus', '✅ 偵測到手', 'ok');
  } else {
    setStatus('handStatus', '⚪ 未偵測到手', 'wait');
  }
});

/* =========================
   Camera
========================= */
async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error('getUserMedia 不支援');
  }

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  log(`正在開啟 ${facingMode === 'user' ? '前鏡頭' : '後鏡頭'}...`);

  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      facingMode,
      width: { ideal: 1280 },
      height: { ideal: 720 },
      frameRate: { ideal: 30, max: 30 }
    }
  });

  video.srcObject = stream;
  await video.play();

  resizeCanvas();

  setStatus('cameraStatus', '✅ 相機已開啟', 'ok');
  log('相機 OK');
}

async function switchCamera() {
  if (!arStarted) return;

  facingMode =
    facingMode === 'user' ? 'environment' : 'user';

  try {
    await startCamera();
    log(`已切換到 ${facingMode === 'user' ? '前鏡頭' : '後鏡頭'}`);
  } catch (e) {
    log(`❌ 切換鏡頭失敗：${e.name || e.message}`, 'bad');
    setStatus('cameraStatus', `❌ ${e.name || '切換失敗'}`, 'bad');
  }
}

/* =========================
   Canvas
========================= */
function resizeCanvas() {
  const w = video.videoWidth || 640;
  const h = video.videoHeight || 480;

  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    setStatus('canvasStatus', `✅ ${w}×${h}`, 'ok');
    log(`Canvas 尺寸：${w}×${h}`);
  }
}

/* =========================
   動作判斷
========================= */
function mouthOpen() {
  if (!faceLandmarks) return false;

  const upper = faceLandmarks[13];
  const lower = faceLandmarks[14];

  return !!upper && !!lower &&
    Math.abs(lower.y - upper.y) > 0.045;
}

function handOpen() {
  if (!handLandmarks) return false;

  const fingers = [
    handLandmarks[8].y < handLandmarks[6].y,
    handLandmarks[12].y < handLandmarks[10].y,
    handLandmarks[16].y < handLandmarks[14].y,
    handLandmarks[20].y < handLandmarks[18].y
  ];

  return fingers.filter(Boolean).length >= 3;
}

function detectState() {
  if (mouthOpen()) return 'mouthOpen';
  if (handOpen()) return 'handOpen';
  return 'normal';
}

/* =========================
   貓咪影片
========================= */
async function playCat(name) {
  if (!name || name === currentVideo) return;

  currentVideo = name;
  $('currentVideoText').textContent = name;
  setStatus('catStatus', `⏳ 載入 ${name}`, 'wait');
  log(`嘗試載入：${name}`);

  try {
    testVideo.src = name;
    testVideo.load();

    await new Promise((resolve, reject) => {
      const ok = () => {
        cleanup();
        resolve();
      };
      const bad = () => {
        cleanup();
        reject(new Error('影片載入失敗'));
      };
      const cleanup = () => {
        testVideo.removeEventListener('loadeddata', ok);
        testVideo.removeEventListener('error', bad);
      };

      testVideo.addEventListener('loadeddata', ok, { once: true });
      testVideo.addEventListener('error', bad, { once: true });
    });

    log(`✅ 影片載入成功：${name}`);
    setStatus('catStatus', `✅ ${name} 已載入`, 'ok');

    /* 使用者已點擊「開始診斷」，可嘗試播放 */
    try {
      await testVideo.play();
      log(`✅ 影片播放成功：${name}`);
    } catch (e) {
      log(`⚠️ 影片載入成功，但播放被拒絕：${name} / ${e.name}`, 'bad');
      setStatus('catStatus', `⚠️ 載入成功、播放失敗`, 'bad');
    }
  } catch (e) {
    log(`❌ 影片失敗：${name} / ${e.message}`, 'bad');
    setStatus('catStatus', `❌ ${name} 載入失敗`, 'bad');
  }
}

function nextNormalVideo() {
  const name =
    VIDEO_GROUPS.normal[normalIndex %
      VIDEO_GROUPS.normal.length];
  normalIndex++;
  return name;
}

async function changeARVideo(state) {
  if (state === currentState && currentVideo) return;

  currentState = state;

  let name;

  if (state === 'mouthOpen') {
    name = VIDEO_GROUPS.mouthOpen[
      Math.floor(Math.random() * VIDEO_GROUPS.mouthOpen.length)
    ];
  } else if (state === 'handOpen') {
    name = VIDEO_GROUPS.handOpen[
      Math.floor(Math.random() * VIDEO_GROUPS.handOpen.length)
    ];
  } else {
    name = nextNormalVideo();
  }

  await playCat(name);
}

/* =========================
   AR 繪製
========================= */
function drawCat() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!faceLandmarks) return;
  if (testVideo.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;

  let minX = 1, maxX = 0, minY = 1;

  for (const p of faceLandmarks) {
    minX = Math.min(minX, p.x);
    maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y);
  }

  const faceW = (maxX - minX) * canvas.width;
  const centerX = ((minX + maxX) / 2) * canvas.width;
  const topY = minY * canvas.height;

  const size = faceW * 1.35;
  const x = centerX - size / 2;
  const y = topY - size * 0.72;

  ctx.drawImage(testVideo, x, y, size, size);

  setStatus('canvasStatus', '✅ AR 正在繪製', 'ok');
}

async function arLoop(ts) {
  if (!arStarted) return;

  resizeCanvas();
  drawCat();

  const m = mouthOpen();
  const h = handOpen();

  $('mouthText').textContent =
    faceLandmarks ? (m ? '👄 張嘴' : '閉嘴') : '未偵測';

  $('handText').textContent =
    handLandmarks ? (h ? '✋ 張開手掌' : '手掌未完全張開') : '未偵測';

  if (faceLandmarks) {
    const state = detectState();
    $('stateText').textContent =
      state === 'mouthOpen' ? '👄 張嘴' :
      state === 'handOpen' ? '✋ 張開手掌' :
      '😺 一般';

    if (state !== currentState) {
      await changeARVideo(state);
    }
  }

  if (ts - lastProcess >= 60) {
    lastProcess = ts;

    try {
      await faceMesh.send({ image: video });
      await hands.send({ image: video });
    } catch (e) {
      log(`⚠️ MediaPipe frame 錯誤：${e.message}`, 'bad');
    }
  }

  requestAnimationFrame(arLoop);
}

/* =========================
   9 部影片按鈕
========================= */
function buildVideoTests() {
  const box = $('videoTests');

  ALL_VIDEOS.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'videoBtn';
    btn.textContent = `▶ ${name.replace('_animation.mp4','')}`;
    btn.onclick = async () => {
      await playCat(name);
      btn.classList.add('ok');
    };
    box.appendChild(btn);
  });
}

/* =========================
   錄影 / 拍照
========================= */
function updateCombinedCanvas() {
  const w = video.videoWidth || 640;
  const h = video.videoHeight || 480;

  combinedCanvas.width = w;
  combinedCanvas.height = h;

  combinedCtx.clearRect(0, 0, w, h);

  combinedCtx.save();
  combinedCtx.translate(w, 0);
  combinedCtx.scale(-1, 1);
  combinedCtx.drawImage(video, 0, 0, w, h);
  combinedCtx.drawImage(canvas, 0, 0, w, h);
  combinedCtx.restore();
}

function supportedMime() {
  if (!window.MediaRecorder) return '';

  const types = [
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];

  return types.find(t =>
    MediaRecorder.isTypeSupported?.(t)
  ) || '';
}

$('recordBtn').onclick = () => {
  if (!arStarted) {
    log('請先開始 AR');
    return;
  }

  if (!combinedCanvas.captureStream || !window.MediaRecorder) {
    log('❌ 此瀏覽器不支援 Canvas 錄影', 'bad');
    return;
  }

  if (recording) {
    recorder.stop();
    return;
  }

  updateCombinedCanvas();

  const capture = combinedCanvas.captureStream(30);
  const mime = supportedMime();

  try {
    recorder = mime
      ? new MediaRecorder(capture, { mimeType: mime })
      : new MediaRecorder(capture);
  } catch (e) {
    log(`❌ MediaRecorder 建立失敗：${e.message}`, 'bad');
    return;
  }

  chunks = [];

  recorder.ondataavailable = e => {
    if (e.data?.size) chunks.push(e.data);
  };

  recorder.onstop = () => {
    const type = recorder.mimeType || mime || 'video/webm';
    const blob = new Blob(chunks, { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ar_cat_diagnostic_${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    log(`✅ 錄影完成，格式：${type}`);
    $('recordBtn').textContent = '🔴 測試錄影';
    $('recordBtn').classList.remove('recording');
    recording = false;
  };

  recorder.start(1000);
  recording = true;
  $('recordBtn').textContent = '⏹ 停止錄影';
  $('recordBtn').classList.add('recording');

  log(`🔴 開始錄影，格式：${mime || '瀏覽器自動選擇'}`);
};

$('snapshotBtn').onclick = () => {
  if (!arStarted) {
    log('請先開始 AR');
    return;
  }

  updateCombinedCanvas();

  const url = combinedCanvas.toDataURL('image/jpeg', .92);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ar_cat_diagnostic_${Date.now()}.jpg`;
  a.click();

  log('✅ 拍照測試完成');
};

/* =========================
   啟動
========================= */
$('startBtn').onclick = async () => {
  diagnoseEnvironment();

  if (!window.isSecureContext &&
      location.hostname !== 'localhost' &&
      location.hostname !== '127.0.0.1') {
    overall('❌ 請使用 GitHub Pages HTTPS 開啟', 'bad');
    return;
  }

  try {
    await startCamera();

    arStarted = true;
    $('startOverlay').classList.add('hidden');

    overall('🟢 AR 診斷已啟動', 'ok');

    /* 先測試第一支一般影片 */
    await playCat(VIDEO_GROUPS.normal[0]);

    log('開始 MediaPipe / AR 測試');
    requestAnimationFrame(arLoop);

  } catch (e) {
    overall(`❌ 啟動失敗：${e.name || e.message}`, 'bad');
    setStatus('cameraStatus', `❌ ${e.name || e.message}`, 'bad');
    log(`❌ 相機啟動失敗：${e.name || e.message}`, 'bad');
  }
};

$('cameraSwitchBtn').onclick = switchCamera;

window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => {
  setTimeout(resizeCanvas, 400);
});

testVideo.addEventListener('error', () => {
  const err = testVideo.error;
  log(`❌ HTMLVideoElement error：code=${err?.code || 'unknown'}`, 'bad');
});

buildVideoTests();
diagnoseEnvironment();
log(`共找到 ${ALL_VIDEOS.length} 部影片`);
log('影片路徑採用相對路徑，例如：./chef_cat_animation.mp4');
</script>
</body>
</html>
