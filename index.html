<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>AR 貓咪｜互動濾鏡</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<style>
:root{--bg:#07070b;--line:rgba(255,255,255,.12);--text:#fff;--pink:#ff4f9a;--green:#35d07f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",Arial,sans-serif}
button{border:0;border-radius:999px;padding:12px 16px;color:#fff;background:#262631;font-weight:800;font-size:14px;cursor:pointer;min-height:44px}
button:active{transform:scale(.97)} button:disabled{opacity:.45}
#app,#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{height:100dvh;min-height:100dvh}
#webcam{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#output{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:#000}
#topBar{position:absolute;z-index:20;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#brand,#livePill{padding:8px 11px;border-radius:999px;background:rgba(0,0,0,.48);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12px;font-weight:800}
#livePill{color:#ddd} #topActions{display:flex;align-items:center;gap:8px;pointer-events:auto}
#soundBtn{font-size:16px}
#liveDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
#interactionGuide{position:absolute;z-index:18;left:50%;top:max(58px,env(safe-area-inset-top) + 52px);transform:translateX(-50%);width:auto;max-width:min(88vw,420px);padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;text-align:center;font-size:13px;line-height:1.35;pointer-events:none;white-space:nowrap;opacity:.9}
#interactionGuide.active{transform:translateX(-50%) translateY(-4px)} #guideTitle{font-size:14px;font-weight:900} #guideText{font-size:12px;color:#eee;line-height:1.5;margin-top:2px}
#captureBar{position:absolute;z-index:20;left:50%;bottom:max(22px,env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.captureBtn{width:58px;height:58px;padding:0;border-radius:50%;background:#fff;color:#111;border:4px solid rgba(255,255,255,.35);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.captureBtn.recording{background:#ff4050;color:#fff} #switchBtn{width:46px;height:46px;padding:0;background:rgba(0,0,0,.55);backdrop-filter:blur(10px)}
.miniAction{width:46px;height:46px;padding:0;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.18)}
.hidden{display:none!important} #recordPreview,#catVideoA,#catVideoB{display:none!important}
#startOverlay{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:22px 16px max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent 20%,rgba(0,0,0,.84))}
#startBox{width:min(520px,100%);padding:22px;border-radius:28px;background:rgba(18,18,24,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;border:1px solid var(--line)}
#startBox h1{margin:0 0 8px;font-size:28px} #startBox p{margin:0 0 16px;line-height:1.7;color:#ddd;font-size:14px} #startBtn{width:100%;background:linear-gradient(135deg,#ff4f9a,#8d5cff);font-size:16px}

@media(max-width:680px){#interactionGuide{max-width:88vw}}
</style>
</head>
<body>
<div id="app"><div id="stage">
<video id="webcam" autoplay muted playsinline webkit-playsinline></video>
<canvas id="output"></canvas>
<div id="topBar"><div id="brand">🐱 AR 貓咪</div><div id="topActions"><button id="soundBtn" class="miniAction" title="關閉聲音" aria-label="關閉聲音">🔊</button><div id="livePill"><span id="liveDot"></span><span id="liveText">準備中</span></div></div></div>
<div id="interactionGuide"><div id="guideTitle">🐱 跟貓咪互動</div><div id="guideText">👄 張嘴・✋ 張開手掌・貓咪會自動回應</div></div>
<div id="captureBar"><button id="switchBtn" title="切換鏡頭" aria-label="切換鏡頭">🔄</button><button id="recordBtn" class="captureBtn" title="開始錄影" aria-label="開始錄影">●</button><button id="snapshotBtn" class="captureBtn" title="拍照" aria-label="拍照">📸</button><button id="downloadBtn" class="miniAction hidden" title="儲存影片到手機" aria-label="儲存影片到手機">💾</button></div>
<div id="startOverlay"><div id="startBox"><h1>🐱 AR 貓咪</h1><p>把臉放進畫面，貓咪會自動跟著你。<br>張嘴、張開手掌，就能觸發不同互動。</p><button id="startBtn">📷 開始玩</button><div style="margin-top:10px;color:#aaa;font-size:12px">首次使用請允許相機權限；互動時會有貓叫與輕音樂</div></div></div>
</div>
<video id="catVideoA" muted playsinline webkit-playsinline preload="auto"></video>
<video id="catVideoB" muted playsinline webkit-playsinline preload="auto"></video>
<video id="recordPreview" controls playsinline webkit-playsinline></video>
</div>
<script>
'use strict';

const VIDEO_GROUPS={
  normal:['spider_cat_animation.mp4','champion_cat_animation.mp4','magic_cat_animation.mp4','sleep_cat_animation.mp4'],
  mouthOpen:['chef_cat_animation.mp4','eat_cat_animation.mp4','drink_cat_animation.mp4'],
  handOpen:['cry_cat_animation.mp4','work_cat_animation.mp4']
};
const ALL_VIDEOS=[...new Set([...VIDEO_GROUPS.normal,...VIDEO_GROUPS.mouthOpen,...VIDEO_GROUPS.handOpen])];
const AUDIO_FILES={
  cat:'cat_sweet_voice4.mp3',
  chef:'fry_potatoes.mp3',
  eat:'slurp_ramen.mp3',
  drink:'open_bottled_coffee.mp3',
  music:'background_music.mp3'
};
const $=id=>document.getElementById(id);
const webcam=$('webcam'),canvas=$('output'),ctx=canvas.getContext('2d',{alpha:false});
const recordCanvas=document.createElement('canvas'),recordCtx=recordCanvas.getContext('2d',{alpha:false});
const beautyLayer=document.createElement('canvas'),beautyCtx=beautyLayer.getContext('2d');
const catPlayers=[$('catVideoA'),$('catVideoB')];
let activeCat=catPlayers[0],standbyCat=catPlayers[1];
let stream=null,facingMode='user',arStarted=false;
let faceLandmarks=null,handLandmarks=null;
let currentState='normal',candidateState='normal',candidateCount=0;
let currentVideo='',pendingState=null,switchBusy=false,videoToken=0;
let normalIndex=0,mouthIndex=0,handIndex=0;
let lastActionAt=0,lastFaceAt=0,lastHandAt=0,detectBusy=false;
let recording=false,recorder=null,chunks=[],recordedBlob=null,recordedUrl=null;
let audioCtx=null,audioDestination=null,audioEnabled=true;
let musicAudio=null,musicSource=null,musicGain=null;
let sfxGain=null,sfxSources=new Map(),musicFallbackTimer=null,musicStep=0;
const FACE_INTERVAL=90,HAND_INTERVAL=180,STATE_CONFIRM=3,ACTION_COOLDOWN=500;

function log(msg){console.log('[AR Cat]',msg)}
function updateGuide(state){
  const title=$('guideTitle'),text=$('guideText'),g=$('interactionGuide');
  if(state==='mouthOpen'){title.textContent='👄 嘴巴互動';text.textContent='張嘴！貓咪會做出吃喝料理互動。';g.classList.add('active')}
  else if(state==='handOpen'){title.textContent='✋ 手掌互動';text.textContent='張開手掌！貓咪會回應你。';g.classList.add('active')}
  else{title.textContent='🐱 跟貓咪互動';text.textContent='👄 張嘴・✋ 張開手掌・貓咪會自動回應';g.classList.remove('active')}
}
function cleanName(n){return n.replace(/_animation\.mp4(?:\.mp4)?$/,'').replace(/\.mp4$/,'')}
function px(p){return{x:(1-p.x)*canvas.width,y:p.y*canvas.height}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function fp(i){return faceLandmarks?.[i]?px(faceLandmarks[i]):null}
function faceGeometry(){
  if(!faceLandmarks)return null;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of faceLandmarks){const q=px(p);minX=Math.min(minX,q.x);maxX=Math.max(maxX,q.x);minY=Math.min(minY,q.y);maxY=Math.max(maxY,q.y)}
  const brows=[105,107,66,336,334,296].map(fp).filter(Boolean);
  const browY=brows.reduce((s,p)=>s+p.y,0)/Math.max(1,brows.length);
  const forehead=fp(10);const headTop=forehead?Math.min(forehead.y,minY+(maxY-minY)*.08):minY;
  const l=fp(234),r=fp(454),c=fp(9)||{x:(minX+maxX)/2,y:(minY+maxY)/2};
  const faceWidth=l&&r?dist(l,r):maxX-minX;
  return{minX,maxX,minY,maxY,browY,headTop,centerX:c.x,centerY:c.y,faceWidth,faceHeight:maxY-minY};
}
function mouthOpen(){
  if(!faceLandmarks)return false;
  const u=fp(13),l=fp(14),a=fp(61),b=fp(291);if(!u||!l||!a||!b)return false;
  return dist(u,l)/Math.max(1,dist(a,b))>.22;
}
function handOpen(){
  if(!handLandmarks)return false;
  const p=i=>handLandmarks[i],w=p(0),m=p(9);const palm=Math.max(.001,Math.hypot(w.x-m.x,w.y-m.y));
  let ext=0;for(const [tip,pip] of [[8,6],[12,10],[16,14],[20,18]]){const td=Math.hypot(p(tip).x-w.x,p(tip).y-w.y),pd=Math.hypot(p(pip).x-w.x,p(pip).y-w.y);if(td>pd*1.10&&td>palm*1.60)ext++}
  const thumb=Math.hypot(p(4).x-p(5).x,p(4).y-p(5).y)>palm*.80;
  return ext>=3&&thumb;
}
function rawState(){if(mouthOpen())return'mouthOpen';if(handOpen())return'handOpen';return'normal'}
function stableState(raw){if(raw!==candidateState){candidateState=raw;candidateCount=1;return currentState}candidateCount++;return candidateCount>=STATE_CONFIRM?raw:currentState}

function resizeCanvas(){
  const w=webcam.videoWidth||1280,h=webcam.videoHeight||720;
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;recordCanvas.width=w;recordCanvas.height=h;beautyLayer.width=w;beautyLayer.height=h}
}
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('此瀏覽器不支援相機');
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facingMode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}});
  webcam.srcObject=stream;await webcam.play();resizeCanvas();$('liveText').textContent='LIVE';
}
async function switchCamera(){
  if(!arStarted)return;const old=facingMode;facingMode=facingMode==='user'?'environment':'user';
  try{await startCamera();faceLandmarks=null;handLandmarks=null;log('鏡頭切換 '+facingMode)}catch(e){facingMode=old;log('鏡頭切換失敗 '+e.message)}
}

function drawBeauty(){
  const g=faceGeometry();if(!g)return;
  beautyCtx.clearRect(0,0,beautyLayer.width,beautyLayer.height);beautyCtx.drawImage(canvas,0,0);
  const padX=g.faceWidth*.24,padY=g.faceHeight*.18,x=Math.max(0,g.minX-padX),y=Math.max(0,g.minY-padY),w=Math.min(canvas.width-x,g.maxX-g.minX+padX*2),h=Math.min(canvas.height-y,g.maxY-g.minY+padY*2);
  ctx.save();ctx.beginPath();ctx.ellipse(g.centerX,g.centerY,g.faceWidth*.60,g.faceHeight*.66,0,0,Math.PI*2);ctx.clip();ctx.globalAlpha=.32;ctx.filter='blur(4px)';ctx.drawImage(beautyLayer,x,y,w,h,x,y,w,h);ctx.restore();
}
function drawCat(){
  if(!faceLandmarks||activeCat.readyState<2)return;const g=faceGeometry();if(!g)return;
  const vw=activeCat.videoWidth||1,vh=activeCat.videoHeight||1,catW=Math.max(120,Math.min(canvas.width*.62,g.faceWidth*.92)),catH=catW*Math.max(.85,Math.min(1.35,vh/vw));
  const x=g.centerX-catW/2,y=g.browY-g.faceHeight*.04-catH;ctx.drawImage(activeCat,x,y,catW,catH);
}
function drawAR(){
  if(!webcam.videoWidth)return;resizeCanvas();ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(webcam,0,0,canvas.width,canvas.height);ctx.restore();
  drawBeauty();drawCat();
}

function nextNormal(){return VIDEO_GROUPS.normal[normalIndex++%VIDEO_GROUPS.normal.length]}
function nextMouth(){return VIDEO_GROUPS.mouthOpen[mouthIndex++%VIDEO_GROUPS.mouthOpen.length]}
function nextHand(){return VIDEO_GROUPS.handOpen[handIndex++%VIDEO_GROUPS.handOpen.length]}
function setVideoSource(player,name){
  const src=`./${encodeURIComponent(name)}`;
  if(player.dataset.src===src)return;
  player.pause();player.dataset.src=src;player.src=src;player.load();
}
function waitVideoReady(player,timeout=3200){
  if(player.readyState>=2)return Promise.resolve(true);
  return new Promise(resolve=>{let done=false;const finish=ok=>{if(done)return;done=true;player.removeEventListener('loadeddata',onLoad);player.removeEventListener('error',onErr);clearTimeout(timer);resolve(ok)};const onLoad=()=>finish(true),onErr=()=>finish(false),timer=setTimeout(()=>finish(false),timeout);player.addEventListener('loadeddata',onLoad,{once:true});player.addEventListener('error',onErr,{once:true})})
}
async function playCat(name,reason='normal'){
  if(!name)return;
  const token=++videoToken;
  const already=currentVideo===name&&activeCat.readyState>=2;
  if(already){activeCat.currentTime=0;activeCat.play().catch(()=>{});playSfx(name);return}
  const candidate=(standbyCat.dataset.src===`./${encodeURIComponent(name)}`)?standbyCat:standbyCat;
  setVideoSource(candidate,name);
  const ok=await waitVideoReady(candidate);
  if(token!==videoToken)return;
  if(!ok){log('影片載入失敗 '+name);return}
  candidate.currentTime=0;candidate.muted=true;
  const playPromise=candidate.play();if(playPromise)await playPromise.catch(()=>{});
  if(token!==videoToken){candidate.pause();return}
  const old=activeCat;activeCat=candidate;standbyCat=old;currentVideo=name;
  setVideoSource(standbyCat,nextPreloadFor(name,reason));
  playSfx(name);log('🐱 '+name);
}
function nextPreloadFor(name,reason){
  const group=VIDEO_GROUPS[reason]||VIDEO_GROUPS.normal;const i=Math.max(0,group.indexOf(name));return group[(i+1)%group.length]||VIDEO_GROUPS.normal[0]}
function playSfx(name){
  if(!audioEnabled||!audioCtx)return;
  let key='cat';if(name.includes('chef_cat_animation'))key='chef';else if(name.includes('eat_cat_animation'))key='eat';else if(name.includes('drink_cat_animation'))key='drink';
  const a=sfxSources.get(key);if(!a)return;a.currentTime=0;a.play().catch(e=>log('音效播放失敗 '+e.message));
}
function requestState(state){
  if(state===currentState&&!switchBusy)return;
  if(switchBusy){pendingState=state;return}
  switchBusy=true;currentState=state;updateGuide(state);
  let name=state==='mouthOpen'?nextMouth():state==='handOpen'?nextHand():nextNormal();
  const reason=state==='mouthOpen'?'mouthOpen':state==='handOpen'?'handOpen':'normal';
  playCat(name,reason).finally(()=>{switchBusy=false;const p=pendingState;pendingState=null;if(p&&p!==currentState)requestState(p)})
}

async function initAudio(){
  if(audioCtx){if(audioCtx.state==='suspended')await audioCtx.resume();return}
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)throw new Error('Web Audio 不支援');
  audioCtx=new Ctx();audioDestination=audioCtx.createMediaStreamDestination();
  musicGain=audioCtx.createGain();sfxGain=audioCtx.createGain();musicGain.gain.value=.12;sfxGain.gain.value=.9;
  musicGain.connect(audioCtx.destination);musicGain.connect(audioDestination);sfxGain.connect(audioCtx.destination);sfxGain.connect(audioDestination);
  const make=(file,key,loop=false)=>{const a=new Audio('./'+file);a.preload='auto';a.loop=loop;a.playsInline=true;a.setAttribute('playsinline','');a.crossOrigin='anonymous';const source=audioCtx.createMediaElementSource(a);source.connect(key==='music'?musicGain:sfxGain);return a};
  sfxSources.set('cat',make(AUDIO_FILES.cat,'sfx'));sfxSources.set('chef',make(AUDIO_FILES.chef,'sfx'));sfxSources.set('eat',make(AUDIO_FILES.eat,'sfx'));sfxSources.set('drink',make(AUDIO_FILES.drink,'sfx'));
  // Optional real background music. If it is not uploaded, use a very soft built-in ambience so the app never fails.
  musicAudio=make(AUDIO_FILES.music,'music',true);
  musicAudio.addEventListener('error',()=>{musicAudio=null;startFallbackMusic()},{once:true});
  try{await musicAudio.play()}catch(e){/* autoplay is handled by the start button gesture */}
  await audioCtx.resume();audioEnabled=true;
  $('soundBtn').textContent='🔊';$('soundBtn').title='關閉聲音';
  if(musicAudio){musicAudio.volume=1;musicGain.gain.value=.12;musicAudio.play().catch(()=>{})}
}
function startFallbackMusic(){
  if(musicFallbackTimer||!audioCtx)return;let step=0;const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
  musicFallbackTimer=setInterval(()=>{if(!audioEnabled)return;const now=audioCtx.currentTime,f=notes[step++%notes.length];const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.012,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.25);o.connect(g);g.connect(musicGain);o.start(now);o.stop(now+.28)},360)
}
async function toggleSound(){try{if(!audioCtx)await initAudio();if(audioCtx.state==='suspended')await audioCtx.resume();audioEnabled=!audioEnabled;if(musicGain)musicGain.gain.value=audioEnabled?.12:0;if(sfxGain)sfxGain.gain.value=audioEnabled?.9:0;if(audioEnabled&&musicAudio)musicAudio.play().catch(()=>{});else if(musicAudio)musicAudio.pause();$('soundBtn').textContent=audioEnabled?'🔊':'🔇';$('soundBtn').title=audioEnabled?'關閉聲音':'開啟聲音'}catch(e){log('音效初始化失敗 '+e.message)}}

function supportedMime(){if(!window.MediaRecorder)return'';const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];return types.find(t=>MediaRecorder.isTypeSupported?.(t))||''}
function updateRecordCanvas(){if(!canvas.width)return;recordCtx.drawImage(canvas,0,0,recordCanvas.width,recordCanvas.height)}
function recordFrame(){if(!recording)return;updateRecordCanvas();requestAnimationFrame(recordFrame)}
async function toggleRecording(){
  if(!arStarted)return;if(recording){try{recorder.stop()}catch(e){}return}
  if(!recordCanvas.captureStream||!window.MediaRecorder){alert('此瀏覽器不支援網頁錄影，請更新 Safari / Chrome / Edge。');return}
  try{await initAudio();const vs=recordCanvas.captureStream(30),ms=new MediaStream(vs.getVideoTracks());if(audioDestination)audioDestination.stream.getAudioTracks().forEach(t=>ms.addTrack(t));const mime=supportedMime();recorder=mime?new MediaRecorder(ms,{mimeType:mime}):new MediaRecorder(ms);chunks=[];recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onstop=()=>{recordedBlob=new Blob(chunks,{type:recorder.mimeType||mime||'video/webm'});if(recordedUrl)URL.revokeObjectURL(recordedUrl);recordedUrl=URL.createObjectURL(recordedBlob);$('recordPreview').src=recordedUrl;recording=false;$('recordBtn').classList.remove('recording');$('recordBtn').textContent='●';$('recordBtn').title='開始錄影';$('downloadBtn').classList.remove('hidden');$('guideTitle').textContent='🎬 錄影完成';$('guideText').textContent='點擊 💾 儲存影片到手機';$('interactionGuide').classList.add('active');};recorder.start(250);recording=true;$('downloadBtn').classList.add('hidden');$('recordBtn').classList.add('recording');$('recordBtn').textContent='■';$('recordBtn').title='停止錄影';recordFrame()}catch(e){log('錄影初始化失敗 '+e.message);alert('錄影啟動失敗，請重新載入頁面或使用最新版 Safari / Chrome。')}}
async function saveBlob(blob,filename){
  if(!blob)return;
  const file=new File([blob],filename,{type:blob.type||'application/octet-stream'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({title:'AR 貓咪',files:[file]});return}catch(e){if(e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){setTimeout(()=>window.open(url,'_blank','noopener,noreferrer'),250)}
  setTimeout(()=>URL.revokeObjectURL(url),10000)
}
async function saveVideo(){if(!recordedBlob){alert('請先錄製一段影片。');return}const ext=recordedBlob.type.includes('mp4')?'mp4':'webm';await saveBlob(recordedBlob,`AR_cat_${Date.now()}.${ext}`)}
async function snapshot(){if(!arStarted)return;updateRecordCanvas();recordCanvas.toBlob(async blob=>{if(blob)await saveBlob(blob,`AR_cat_${Date.now()}.jpg`)},'image/jpeg',.95)}

async function detectLoop(){
  if(!arStarted||detectBusy)return;
  const now=performance.now();
  const faceDue=now-lastFaceAt>=FACE_INTERVAL;
  const handDue=now-lastHandAt>=HAND_INTERVAL;
  if(!faceDue&&!handDue)return;
  detectBusy=true;
  try{
    if(faceDue){lastFaceAt=now;await faceMesh.send({image:webcam});}
    if(handDue){lastHandAt=performance.now();await hands.send({image:webcam});}
  }catch(e){/* transient model errors are ignored */}
  finally{detectBusy=false}
}
function renderLoop(){if(!arStarted)return;drawAR();requestAnimationFrame(renderLoop)}
function interactionLoop(){if(!arStarted)return;const raw=rawState(),stable=stableState(raw);if(stable!==currentState&&performance.now()-lastActionAt>ACTION_COOLDOWN){lastActionAt=performance.now();requestState(stable)};requestAnimationFrame(interactionLoop)}

const faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.55,minTrackingConfidence:.55});faceMesh.onResults(r=>{faceLandmarks=r.multiFaceLandmarks?.[0]||null});
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.55});hands.onResults(r=>{handLandmarks=r.multiHandLandmarks?.[0]||null});

catPlayers.forEach(v=>{v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');});
$('startBtn').onclick=async()=>{
  $('startBtn').disabled=true;$('startBtn').textContent='⏳ 啟動中…';
  try{await startCamera();await initAudio();arStarted=true;$('startOverlay').classList.add('hidden');currentState='normal';candidateState='normal';candidateCount=0;await playCat(nextNormal(),'normal');renderLoop();interactionLoop();setInterval(detectLoop,60);log('AR ready')}catch(e){$('startBtn').disabled=false;$('startBtn').textContent='📷 開始玩';$('liveText').textContent='啟動失敗';alert('啟動失敗：請確認 HTTPS、相機權限與瀏覽器版本。')}};
$('soundBtn').onclick=toggleSound;$('recordBtn').onclick=toggleRecording;$('snapshotBtn').onclick=snapshot;$('downloadBtn').onclick=saveVideo;$('switchBtn').onclick=switchCamera;
window.addEventListener('resize',resizeCanvas);window.addEventListener('orientationchange',()=>setTimeout(resizeCanvas,350));

/* 不使用任何貓耳繪製。音效檔案需與 index.html 同一層。 */
