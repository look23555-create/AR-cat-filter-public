<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐾 奶牛貓 AR 互動美顏濾鏡</title>
  
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Microsoft JhengHei', sans-serif; background-color: #000; }
    #custom-banner { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255, 105, 180, 0.85); color: white; padding: 8px 20px; border-radius: 20px; font-size: 15px; font-weight: bold; z-index: 999; pointer-events: none; white-space: nowrap; }
    #interaction-tip { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.6); color: #ffe6ea; padding: 6px 16px; border-radius: 15px; font-size: 13px; z-index: 999; pointer-events: none; white-space: nowrap; }
    
    /* 強制授權全螢幕遮罩 */
    #permission-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.92); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 99999; color: white; text-align: center; padding: 30px; box-sizing: border-box;
    }
    #permission-overlay h2 { color: #ff7eb3; margin-bottom: 15px; }
    #permission-overlay p { color: #ccc; font-size: 14px; margin-bottom: 25px; line-height: 1.6; }
    
    .btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); color: white; border: none;
      padding: 14px 28px; border-radius: 30px; font-size: 18px; font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer;
    }
    
    video, canvas {
      position: absolute !important; top: 50% !important; left: 50% !important;
      transform: translate(-50%, -50%) scaleX(-1) !important; width: 100vw !important; height: 100vh !important;
      object-fit: cover !important;
    }
  </style>
</head>
<body>

  <div id="permission-overlay">
    <h2>🐾 奶牛貓 AR 互動濾鏡</h2>
    <p>為了讓 AR 鏡頭與貓咪動畫正常運作，<br>請點擊下方按鈕授權相機並進入世界！</p>
    <button class="btn" id="grant-btn">點擊授權並啟動 AR</button>
  </div>

  <div id="custom-banner">🐾 奶牛貓 AR 互動美顏濾鏡</div>
  <div id="interaction-tip">✨ 試著「張開嘴巴」或「張開手掌」切換貓咪特效！</div>

  <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false">
    <a-assets>
      <video id="v-normal-0" src="spider_cat_animation.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="v-normal-1" src="champion_cat_animation.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="v-normal-2" src="magic_cat_animation.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="v-normal-3" src="sleep_cat_animation.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
      
      <video id="v-mouth-0" src="chef_cat_animation.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="v-mouth-1" src="eat_cat_animation.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="v-mouth-2" src="drink_cat_animation.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>

      <video id="v-hand-0" src="cry_cat_animation.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="v-hand-1" src="work_cat_animation.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" active="false"></a-camera>

    <a-entity mindar-face-target="anchorIndex: 10">
      <a-video id="cat-video-plane" src="#v-normal-0" position="0 0.5 0" width="1" height="1"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const animationVideos = {
      normal: ['#v-normal-0', '#v-normal-1', '#v-normal-2', '#v-normal-3'],
      mouthOpen: ['#v-mouth-0', '#v-mouth-1', '#v-mouth-2'],
      handPalm: ['#v-hand-0', '#v-hand-1']
    };

    let currentCategory = 'normal';
    let currentIndex = 0;
    const videoPlane = document.querySelector('#cat-video-plane');

    function switchAnimation(category, index = 0) {
      currentCategory = category;
      currentIndex = index % animationVideos[category].length;
      const targetSelector = animationVideos[category][currentIndex];
      
      document.querySelectorAll('a-assets video').forEach(v => v.pause());
      
      videoPlane.setAttribute('src', targetSelector);
      const activeEl = document.querySelector(targetSelector);
      if (activeEl) {
        activeEl.currentTime = 0;
        activeEl.play().catch(e => console.log("播放攔截:", e));
      }
    }

    // 點擊畫面切換
    window.addEventListener('click', (e) => {
      if (e.target.closest('#permission-overlay')) return;
      let categories = ['normal', 'mouthOpen', 'handPalm'];
      let catIndex = categories.indexOf(currentCategory);
      currentIndex++;
      if (currentIndex >= animationVideos[currentCategory].length) {
        currentIndex = 0;
        catIndex = (catIndex + 1) % categories.length;
      }
      switchAnimation(categories[catIndex], currentIndex);
    });

    // 核心授權與啟動按鈕
    document.getElementById('grant-btn').addEventListener('click', async () => {
      const overlay = document.getElementById('permission-overlay');
      
      try {
        // 1. 強制主動跟瀏覽器索取相機權限（解決授權被擋問題）
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        
        // 2. 授權成功後關閉遮罩
        overlay.style.display = 'none';

        // 3. 強制預載並解鎖所有影片元素
        const allVideos = document.querySelectorAll('a-assets video');
        for (let v of allVideos) {
          v.load();
          try {
            await v.play();
            v.pause();
            v.currentTime = 0;
          } catch(err) {
            console.log("影音解碼略過");
          }
        }

        // 4. 啟動預設動畫
        switchAnimation('normal', 0);

        // 5. 啟動 MediaPipe 辨識
        initAI();

      } catch (err) {
        alert("相機授權失敗！請確認瀏覽器是否允許相機權限，或嘗試使用 Chrome / Safari 開啟網頁。");
        console.error(err);
      }
    });

    function initAI() {
      const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      faceMesh.onResults(results => {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const l = results.multiFaceLandmarks[0];
          if (Math.abs(l[13].y - l[14].y) > 0.05 && currentCategory !== 'mouthOpen') {
            switchAnimation('mouthOpen', Math.floor(Math.random() * animationVideos.mouthOpen.length));
          }
        }
      });

      const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
      hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      hands.onResults(results => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const lm = results.multiHandLandmarks[0];
          let ext = 0;
          const wrist = lm[0];
          [4, 8, 12, 16, 20].forEach((tip, i) => {
            if (Math.hypot(lm[tip].x - wrist.x, lm[tip].y - wrist.y) > Math.hypot(lm[[2,6,10,14,18][i]].x - wrist.x, lm[[2,6,10,14,18][i]].y - wrist.y) * 1.2) ext++;
          });
          if (ext >= 4 && currentCategory !== 'handPalm') {
            switchAnimation('handPalm', Math.floor(Math.random() * animationVideos.handPalm.length));
          }
        }
      });

      setTimeout(() => {
        const videoElement = document.querySelector('video');
        if (videoElement) {
          const camera = new Camera(videoElement, {
            onFrame: async () => {
              try {
                await faceMesh.send({ image: videoElement });
                await hands.send({ image: videoElement });
              } catch(e) {}
            },
            width: 640, height: 480
          });
          camera.start();
        }
      }, 500);
    }
  </script>
</body>
</html>
