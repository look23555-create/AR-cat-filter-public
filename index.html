<script>

'use strict';


/* =====================================================
   影片分類
===================================================== */

const VIDEO_GROUPS = {

  normal:[
    'spider_cat_animation.mp4',
    'champion_cat_animation.mp4',
    'magic_cat_animation.mp4',
    'sleep_cat_animation.mp4'
  ],

  mouthOpen:[
    'chef_cat_animation.mp4',
    'eat_cat_animation.mp4',
    'drink_cat_animation.mp4'
  ],

  handOpen:[
    'cry_cat_animation.mp4.mp4',
    'work_cat_animation.mp4'
  ]

};


const $ =
  id =>
    document.getElementById(id);


const video =
  $('webcam');


const canvas =
  $('output');


const ctx =
  canvas.getContext(
    '2d'
  );


const testVideo =
  $('testVideo');


/* =====================================================
   AR 狀態
===================================================== */

let stream = null;

let facingMode = 'user';

let arStarted = false;

let faceLandmarks = null;

let handLandmarks = null;

let currentState = 'none';

let currentVideo = '';

let normalIndex = 0;

let lastProcess = 0;

let changingVideo = false;


/* =====================================================
   動作穩定
===================================================== */

let candidateState = 'normal';

let candidateCount = 0;

const STATE_CONFIRM_FRAMES = 3;


/* =====================================================
   美膚
===================================================== */

let beautyStrength = 65;


/* =====================================================
   錄影
===================================================== */

let recording = false;

let recorder = null;

let chunks = [];

let recordCanvas =
  document.createElement(
    'canvas'
  );

let recordCtx =
  recordCanvas.getContext(
    '2d'
  );


/* =====================================================
   互動說明
===================================================== */

let guideTimer = null;


function showGuide(){

  const guide =
    $('interactionGuide');


  guide.classList.add(
    'show'
  );


  clearTimeout(
    guideTimer
  );


  guideTimer =
    setTimeout(
      () => {

        guide.classList.remove(
          'show'
        );

      },
      5000
    );

}


function updateGuide(
  state
){

  const title =
    $('guideTitle');


  const text =
    $('guideText');


  const sub =
    $('guideSub');


  if(
    state === 'mouthOpen'
  ){

    title.textContent =
      '👄 嘴巴互動';


    text.innerHTML =
      '偵測到你張開嘴巴！<br>貓咪正在回應你的動作。';


    sub.textContent =
      '試著保持張嘴一下，看看貓咪的反應。';

  }

  else if(
    state === 'handOpen'
  ){

    title.textContent =
      '✋ 手掌互動';


    text.innerHTML =
      '偵測到你張開手掌！<br>貓咪正在回應你的動作。';


    sub.textContent =
      '把手掌完整張開，效果會更容易被偵測。';

  }

  else{

    title.textContent =
      '🐱 和貓咪一起玩！';


    text.innerHTML =
      '👄 張開嘴巴　→　觸發嘴巴互動<br>✋ 張開手掌　→　觸發手掌互動';


    sub.textContent =
      '不做動作時，貓咪會自動繼續一般動畫。';

  }

}


/* =====================================================
   HTTPS
===================================================== */

function diagnoseEnvironment(){

  const localhost =
    location.hostname ===
      'localhost' ||
    location.hostname ===
      '127.0.0.1';


  if(
    window.isSecureContext ||
    localhost
  ){

    $('statusBar')
      .textContent =
      '🟢 AR 準備完成';

  }

}


/* =====================================================
   FaceMesh
===================================================== */

const faceMesh =
  new FaceMesh({

    locateFile:file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`

  });


faceMesh.setOptions({

  maxNumFaces:1,

  refineLandmarks:true,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


faceMesh.onResults(
  results => {

    faceLandmarks =
      results
        .multiFaceLandmarks?.[0]
        ||
        null;

  }
);


/* =====================================================
   Hands
===================================================== */

const hands =
  new Hands({

    locateFile:file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


hands.onResults(
  results => {

    handLandmarks =
      results
        .multiHandLandmarks?.[0]
        ||
        null;

  }
);


/* =====================================================
   Camera
===================================================== */

async function startCamera(){

  if(
    !navigator
      .mediaDevices
      ?.getUserMedia
  ){

    throw new Error(
      '瀏覽器不支援相機'
    );

  }


  if(stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  stream =
    await navigator
      .mediaDevices
      .getUserMedia({

        audio:false,

        video:{

          facingMode,

          width:{
            ideal:1280
          },

          height:{
            ideal:1920
          },

          frameRate:{
            ideal:30,
            max:30
          }

        }

      });


  video.srcObject =
    stream;


  await video.play();


  resizeCanvas();

}


/* =====================================================
   Canvas
===================================================== */

function resizeCanvas(){

  const w =
    video.videoWidth ||
    720;


  const h =
    video.videoHeight ||
    1280;


  canvas.width =
    w;


  canvas.height =
    h;


  recordCanvas.width =
    w;


  recordCanvas.height =
    h;

}


/* =====================================================
   嘴巴
===================================================== */

function mouthOpen(){

  if(!faceLandmarks)
    return false;


  const upper =
    faceLandmarks[13];


  const lower =
    faceLandmarks[14];


  return (
    !!upper &&
    !!lower &&
    Math.abs(
      lower.y -
      upper.y
    ) > .045
  );

}


/* =====================================================
   手掌
===================================================== */

function handOpen(){

  if(!handLandmarks)
    return false;


  const fingers = [

    handLandmarks[8].y <
      handLandmarks[6].y,

    handLandmarks[12].y <
      handLandmarks[10].y,

    handLandmarks[16].y <
      handLandmarks[14].y,

    handLandmarks[20].y <
      handLandmarks[18].y

  ];


  return (
    fingers
      .filter(Boolean)
      .length >= 3
  );

}


/* =====================================================
   狀態
===================================================== */

function detectState(){

  if(
    mouthOpen()
  )
    return 'mouthOpen';


  if(
    handOpen()
  )
    return 'handOpen';


  return 'normal';

}


function stableState(
  raw
){

  if(
    raw !==
    candidateState
  ){

    candidateState =
      raw;

    candidateCount =
      1;

    return currentState;

  }


  candidateCount++;


  if(
    candidateCount >=
    STATE_CONFIRM_FRAMES
  ){

    return raw;

  }


  return currentState;

}


/* =====================================================
   臉部框
===================================================== */

function getFaceBox(){

  if(!faceLandmarks)
    return null;


  let minX = 1;

  let maxX = 0;

  let minY = 1;

  let maxY = 0;


  for(
    const p of faceLandmarks
  ){

    minX =
      Math.min(
        minX,
        p.x
      );


    maxX =
      Math.max(
        maxX,
        p.x
      );


    minY =
      Math.min(
        minY,
        p.y
      );


    maxY =
      Math.max(
        maxY,
        p.y
      );

  }


  return {

    minX,
    maxX,
    minY,
    maxY,

    width:
      (
        maxX -
        minX
      ) *
      canvas.width,

    height:
      (
        maxY -
        minY
      ) *
      canvas.height,

    centerX:
      (
        (
          minX +
          maxX
        ) / 2
      ) *
      canvas.width,

    topY:
      minY *
      canvas.height

  };

}


/* =====================================================
   美膚
===================================================== */

function drawBeauty(){

  if(
    !faceLandmarks ||
    beautyStrength <= 0
  )
    return;


  const box =
    getFaceBox();


  if(!box)
    return;


  const padX =
    box.width *
    .18;


  const padY =
    box.height *
    .22;


  const x =
    Math.max(
      0,
      box.minX *
        canvas.width -
        padX
    );


  const y =
    Math.max(
      0,
      box.minY *
        canvas.height -
        padY
    );


  const w =
    Math.min(
      canvas.width -
        x,
      box.width +
        padX * 2
    );


  const h =
    Math.min(
      canvas.height -
        y,
      box.height +
        padY * 2
    );


  ctx.save();


  ctx.globalAlpha =
    .12 +
    beautyStrength /
      100 *
      .30;


  ctx.filter =
    `blur(${
      2 +
      beautyStrength *
      .045
    }px)`;


  ctx.drawImage(
    canvas,
    x,
    y,
    w,
    h,
    x,
    y,
    w,
    h
  );


  ctx.filter =
    'none';


  ctx.globalAlpha =
    beautyStrength /
    100 *
    .16;


  ctx.filter =
    `blur(${
      1 +
      beautyStrength *
      .025
    }px)`;


  ctx.drawImage(
    canvas,
    x,
    y,
    w,
    h,
    x,
    y,
    w,
    h
  );


  ctx.restore();

}


/* =====================================================
   貓咪定位
===================================================== */

function drawCat(){

  if(
    !faceLandmarks
  )
    return;


  if(
    testVideo.readyState <
    HTMLMediaElement
      .HAVE_CURRENT_DATA
  )
    return;


  const box =
    getFaceBox();


  if(!box)
    return;


  /*
    ==========================================
    貓咪比例

    這次刻意放大並拉長：

    寬度：
      臉寬 × 0.92

    高度：
      約寬度 × 1.45

    效果：
      貓咪會高出頭頂，
      形成比較有「AR 濾鏡」感的視覺。
    ==========================================
  */

  const catWidth =
    box.width *
    .92;


  const videoW =
    testVideo.videoWidth ||
    1;


  const videoH =
    testVideo.videoHeight ||
    1;


  const sourceRatio =
    videoH /
    videoW;


  /*
    強制拉長。

    最低 1.30
    最高 1.60
  */

  const catRatio =
    Math.max(
      1.30,
      Math.min(
        1.60,
        sourceRatio
      )
    );


  const catHeight =
    catWidth *
    catRatio;


  /*
    X：

    臉中央
  */

  const x =
    box.centerX -
    catWidth / 2;


  /*
    Y：

    往頭頂上方延伸。

    .86 代表影片底部
    會更接近頭頂。

    因為影片變長，
    所以會明顯高出頭頂。
  */

  const y =
    box.topY -
    catHeight *
    .86;


  ctx.save();


  /*
    不鏡像影片。

    相機已經是鏡像，
    貓咪本身保持正常方向。
  */

  ctx.globalAlpha =
    1;


  ctx.drawImage(
    testVideo,
    x,
    y,
    catWidth,
    catHeight
  );


  ctx.restore();

}


/* =====================================================
   AR 畫面
===================================================== */

function drawAR(){

  if(
    !video.videoWidth
  )
    return;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    相機鏡像
  */

  ctx.save();


  ctx.translate(
    canvas.width,
    0
  );


  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();


  /*
    美膚
  */

  drawBeauty();


  /*
    貓咪
  */

  drawCat();

}


/* =====================================================
   播放影片
===================================================== */

async function playCat(
  name
){

  if(!name)
    return;


  if(
    changingVideo
  )
    return;


  changingVideo =
    true;


  try{

    testVideo.pause();

    testVideo.currentTime =
      0;


    currentVideo =
      name;


    $('statusBar')
      .textContent =
      `🐱 ${name
        .replace(
          '_cat_animation.mp4',
          ''
        )
        .replace(
          '.mp4',
          ''
        )}`;


    testVideo.src =
      `./${name}`;


    testVideo.load();


    await new Promise(
      (
        resolve,
        reject
      ) => {

        const onLoad =
          () => {

            cleanup();

            resolve();

          };


        const onError =
          () => {

            cleanup();

            reject(
              new Error(
                '影片載入失敗'
              )
            );

          };


        const cleanup =
          () => {

            testVideo
              .removeEventListener(
                'loadeddata',
                onLoad
              );

            testVideo
              .removeEventListener(
                'error',
                onError
              );

          };


        testVideo
          .addEventListener(
            'loadeddata',
            onLoad,
            {
              once:true
            }
          );


        testVideo
          .addEventListener(
            'error',
            onError,
            {
              once:true
            }
          );

      }
    );


    testVideo.currentTime =
      0;


    await testVideo.play();

  }

  catch(e){

    console.log(
      '影片播放錯誤',
      e
    );

  }

  finally{

    changingVideo =
      false;

  }

}


/* =====================================================
   一般影片
===================================================== */

function nextNormalVideo(){

  const name =
    VIDEO_GROUPS
      .normal[
        normalIndex %
        VIDEO_GROUPS
          .normal
          .length
      ];


  normalIndex++;


  return name;

}


/* =====================================================
   隨機動作影片
===================================================== */

function randomVideo(
  list
){

  return list[
    Math.floor(
      Math.random() *
      list.length
    )
  ];

}


/* =====================================================
   狀態切換
===================================================== */

async function changeARVideo(
  state
){

  if(
    state ===
    currentState
  )
    return;


  currentState =
    state;


  updateGuide(
    state
  );


  let name;


  /*
    嘴巴
  */

  if(
    state ===
    'mouthOpen'
  ){

    name =
      randomVideo(
        VIDEO_GROUPS
          .mouthOpen
      );

  }


  /*
    手掌
  */

  else if(
    state ===
    'handOpen'
  ){

    name =
      randomVideo(
        VIDEO_GROUPS
          .handOpen
      );

  }


  /*
    一般
  */

  else{

    /*
      如果目前影片還沒播完，
      不要重新開始。
    */

    if(
      currentVideo &&
      !testVideo.ended
    )
      return;


    name =
      nextNormalVideo();

  }


  await playCat(
    name
  );

}


/* =====================================================
   影片結束
===================================================== */

testVideo.loop =
  false;


testVideo.addEventListener(
  'ended',
  async () => {

    /*
      一般狀態：

      spider
      ↓
      champion
      ↓
      magic
      ↓
      sleep
      ↓
      spider
    */

    if(
      currentState ===
      'normal'
    ){

      const raw =
        detectState();


      if(
        raw ===
        'normal'
      ){

        await playCat(
          nextNormalVideo()
        );

      }

      else{

        currentState =
          'none';

      }


      return;

    }


    /*
      動作影片結束：

      如果動作已經停止，
      回到一般系列。
    */

    const raw =
      detectState();


    if(
      raw ===
      'normal'
    ){

      currentState =
        'normal';


      updateGuide(
        'normal'
      );


      await playCat(
        nextNormalVideo()
      );

    }

  }
);


/* =====================================================
   錄影
===================================================== */

function updateRecordCanvas(){

  if(
    recordCanvas.width !==
    canvas.width ||
    recordCanvas.height !==
    canvas.height
  ){

    recordCanvas.width =
      canvas.width;

    recordCanvas.height =
      canvas.height;

  }


  recordCtx.clearRect(
    0,
    0,
    recordCanvas.width,
    recordCanvas.height
  );


  recordCtx.drawImage(
    canvas,
    0,
    0
  );

}


function supportedMime(){

  if(
    !window.MediaRecorder
  )
    return '';


  const types = [

    'video/mp4',

    'video/webm;codecs=vp9',

    'video/webm;codecs=vp8',

    'video/webm'

  ];


  return types.find(
    type =>
      MediaRecorder
        .isTypeSupported?.(
          type
        )
  ) || '';

}


function recordLoop(){

  if(
    !recording
  )
    return;


  updateRecordCanvas();


  requestAnimationFrame(
    recordLoop
  );

}


$('recordBtn').onclick =
  () => {

    if(
      !arStarted
    )
      return;


    if(
      recording
    ){

      recorder.stop();

      return;

    }


    if(
      !recordCanvas
        .captureStream ||
      !window.MediaRecorder
    ){

      return;

    }


    updateRecordCanvas();


    const capture =
      recordCanvas
        .captureStream(
          30
        );


    const mime =
      supportedMime();


    try{

      recorder =
        mime
          ? new MediaRecorder(
              capture,
              {
                mimeType:mime
              }
            )
          : new MediaRecorder(
              capture
            );

    }

    catch(e){

      return;

    }


    const chunksLocal =
      [];


    recorder.ondataavailable =
      e => {

        if(
          e.data &&
          e.data.size
        ){

          chunksLocal.push(
            e.data
          );

        }

      };


    recorder.onstop =
      () => {

        const type =
          recorder.mimeType ||
          mime ||
          'video/webm';


        const blob =
          new Blob(
            chunksLocal,
            {
              type
            }
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const a =
          document.createElement(
            'a'
          );


        const ext =
          type.includes(
            'mp4'
          )
            ? 'mp4'
            : 'webm';


        a.href =
          url;


        a.download =
          `AR_cat_${Date.now()}.${ext}`;


        document.body.appendChild(
          a
        );


        a.click();


        a.remove();


        setTimeout(
          () =>
            URL.revokeObjectURL(
              url
            ),
          3000
        );


        recording =
          false;


        $('recordBtn')
          .textContent =
          '🔴 錄影';

      };


    recorder.start(
      1000
    );


    recording =
      true;


    $('recordBtn')
      .textContent =
      '⏹ 停止';


    recordLoop();

  };

        setTimeout(

    );

  };

   AR Loop
===================================================== */

async function arLoop(
  timestamp
){

  if(
    !arStarted
  )
    return;


  resizeCanvas();


  drawAR();


  /*
    偵測狀態
  */

  if(
    faceLandmarks
  ){

    const raw =
      detectState();


    const state =
      stableState(
        raw
      );


    if(
      state ===
      'mouthOpen'
    ){

      $('actionHint')
        .textContent =
        '👄 偵測到張嘴';

    }

    else if(
      state ===
      'handOpen'
    ){

      $('actionHint')
        .textContent =
        '✋ 偵測到張開手掌';

    }

    else{

      $('actionHint')
        .textContent =
        '👄 張嘴　・　✋ 張開手掌';

    }


    if(
      state !==
      currentState &&
      !changingVideo
    ){

      await changeARVideo(
        state
      );

    }

  }


  /*
    MediaPipe
  */

  if(
    timestamp -
    lastProcess >=
    70
  ){

    lastProcess =
      timestamp;


    try{

      await faceMesh.send({
        image:video
      });


      await hands.send({
        image:video
      });

    }

    catch(e){

      console.log(
        e
      );

    }

  }


  requestAnimationFrame(
    arLoop
  );

}
