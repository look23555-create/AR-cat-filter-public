<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Face Cat Filter</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- 引入 MindAR Face Tracking 專用 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    
    /* 美顏磨皮與光影優化效果：微調鏡頭畫面的對比與柔焦感 */
    video {
      filter: contrast(1.05) brightness(1.08) saturate(1.1);
    }

    /* 拍照按鈕與互動按鈕介面 */
    #ui-container {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      gap: 12px;
    }
    .btn {
      background-color: #ff5252;
      color: white;
      border: none;
      padding: 12px 22px;
      font-size: 15px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-weight: bold;
    }
    .btn:active { background-color: #ff1744; }

    /* 點擊螢幕產生的逗貓棒特效（愛心/星星飄落） */
    .magic-particle {
      position: fixed;
      pointer-events: none;
      font-size: 28px;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 998;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.5); opacity: 1; }
      100% { transform: translateY(-80px) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- 底部按鈕區 -->
  <div id="ui-container">
    <button class="btn" onclick="triggerMagic()">✨ 逗貓棒特效</button>
    <button class="btn" style="background-color: #ff4081;" onclick="takeSnapshot()">📸 拍照留念</button>
  </div>

  <!-- 使用 mindar-face 模型 -->
  <a-scene mindar-face color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <!-- 手部動作序列 (.png) -->
      <img id="cat_0" src="hand_open_01_1.png">
      <img id="cat_1" src="hand_open_01_2.png">
      <img id="cat_2" src="hand_open_01_3.png">
      <img id="cat_3" src="hand_open_01_4.png">
      <img id="cat_4" src="hand_open_01_5.png">
      <img id="cat_5" src="hand_open_01_6.png">
      <img id="cat_6" src="hand_open_02_1.png">
      <img id="cat_7" src="hand_open_02_2.png">
      <img id="cat_8" src="hand_open_02_3.png">
      <img id="cat_9" src="hand_open_02_4.png">
      <img id="cat_10" src="hand_open_02_5.png">
      <img id="cat_11" src="hand_open_02_6.png">

      <!-- 一般待機序列 (.jpg) -->
      <img id="cat_12" src="idle_01_1.jpg">
      <img id="cat_13" src="idle_01_2.jpg">
      <img id="cat_14" src="idle_01_3.jpg">
      <img id="cat_15" src="idle_01_4.jpg">
      <img id="cat_16" src="idle_01_5.jpg">
      <img id="cat_17" src="idle_01_6.jpg">
      <img id="cat_18" src="idle_02_1.png">
      <img id="cat_19" src="idle_02_2.png">
      <img id="cat_20" src="idle_02_3.png">
      <img id="cat_21" src="idle_02_4.png">
      <img id="cat_22" src="idle_02_5.png">
      <img id="cat_23" src="idle_02_6.png">

      <!-- 張嘴動作序列 (.png) -->
      <img id="cat_24" src="mouth_open_01_1.png">
      <img id="cat_25" src="mouth_open_01_2.png">
      <img id="cat_26" src="mouth_open_01_3.png">
      <img id="cat_27" src="mouth_open_01_4.png">
      <img id="cat_28" src="mouth_open_01_5.png">
      <img id="cat_29" src="mouth_open_01_6.png">
      <img id="cat_30" src="mouth_open_02_1.png">
      <img id="cat_31" src="mouth_open_02_2.png">
      <img id="cat_32" src="mouth_open_02_3.png">
      <img id="cat_33" src="mouth_open_02_4.png">
      <img id="cat_34" src="mouth_open_02_5.png">
      <img id="cat_35" src="mouth_open_02_6.png">
      <img id="cat_36" src="mouth_open_03_1.png">
      <img id="cat_37" src="mouth_open_03_2.png">
      <img id="cat_38" src="mouth_open_03_3.png">
      <img id="cat_39" src="mouth_open_03_4.png">
      <img id="cat_40" src="mouth_open_03_5.png">
      <img id="cat_41" src="mouth_open_03_6.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 綁定在臉部錨點（anchorIndex: 10 代表額頭上方） -->
    <a-entity mindar-face-target="anchorIndex: 10">
      <a-plane id="animated-cat" src="#cat_0" position="0 0.5 0" height="0.8" width="0.8" rotation="0 0 0"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    // 動畫序列循環播放
    const frames = [];
    for (let i = 0; i <= 41; i++) {
      frames.push(`#cat_${i}`);
    }

    let currentFrame = 0;
    const catPlane = document.querySelector('#animated-cat');

    setInterval(() => {
      currentFrame = (currentFrame + 1) % frames.length;
      catPlane.setAttribute('src', frames[currentFrame]);
    }, 200);

    // 逗貓棒特效：點擊按鈕或畫面時隨機產生愛心/小魚乾特效
    function triggerMagic() {
      const symbols = ["🐾", "❤️", "✨", "🐟", "⭐"];
      const particle = document.createElement('div');
      particle.className = 'magic-particle';
      particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      
      // 隨機隨畫面位置飄出
      particle.style.left = (window.innerWidth / 2 + (Math.random() * 100 - 50)) + 'px';
      particle.style.top = (window.innerHeight / 2 + (Math.random() * 50)) + 'px';
      
      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), 800);
    }

    // 點擊螢幕任何地方也可以順便揮動逗貓棒
    window.addEventListener('click', (e) => {
      // 避免點到按鈕時重複觸發
      if(e.target.tagName !== 'BUTTON') {
        triggerMagic();
      }
    });

    // 拍照存檔功能
    function takeSnapshot() {
      const canvas = document.querySelector('canvas');
      if (canvas) {
        const imageURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = imageURL;
        link.download = 'AR-Cat-Filter.png';
        link.click();
      } else {
        alert("畫面準備中，請稍後再試！");
      }
    }
  </script>
</body>
</html>
