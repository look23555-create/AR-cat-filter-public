<style>
*{

@media(max-width:600px){

  </div>

</div>

<script>
'use strict';

/* =========================================================
   9 部貓咪影片
========================================================= */

const VIDEO_GROUPS = {

  normal: [

    'spider_cat_animation.mp4',

    'champion_cat_animation.mp4',

    'magic_cat_animation.mp4',

    'sleep_cat_animation.mp4'

  ],

  mouthOpen: [

    'chef_cat_animation.mp4',

    'eat_cat_animation.mp4',

    'drink_cat_animation.mp4'

  ],

  handOpen: [

    'cry_cat_animation.mp4',

    'work_cat_animation.mp4'

  ]

};


/* =========================================================
   DOM
========================================================= */

const webcam =
  document.getElementById('webcam');

const canvas =
  document.getElementById('output');

const ctx =
  canvas.getContext('2d');

const catVideo =
  document.getElementById('catVideo');

const startBtn =
  document.getElementById('startBtn');

const startOverlay =
  document.getElementById('startOverlay');

const stateText =
  document.getElementById('stateText');

const videoText =
  document.getElementById('videoText');

const debug =
  document.getElementById('debug');

const cameraBtn =
  document.getElementById('cameraBtn');

const debugBtn =
  document.getElementById('debugBtn');


/* =========================================================
   狀態
========================================================= */

let stream = null;

let facingMode = 'user';

let started = false;

let faceLandmarks = null;

let handLandmarks = null;

let currentState = 'normal';

let currentVideo = '';

let normalIndex = 0;

let lastFrameTime = 0;

let debugVisible = false;


/* =========================================================
   Canvas
========================================================= */

function resizeCanvas(){

  const width =
    webcam.videoWidth || 1280;

  const height =
    webcam.videoHeight || 720;

  if(
    canvas.width !== width ||
    canvas.height !== height
  ){

    canvas.width = width;

    canvas.height = height;

  }

}


/* =========================================================
   MediaPipe Face Mesh
========================================================= */

const faceMesh = new FaceMesh({

  locateFile:file =>

    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`

});


faceMesh.setOptions({

  maxNumFaces:1,

  refineLandmarks:true,

  minDetectionConfidence:0.5,

  minTrackingConfidence:0.5

});


faceMesh.onResults(results => {

  faceLandmarks =
    results.multiFaceLandmarks?.[0] || null;

});


/* =========================================================
   MediaPipe Hands
========================================================= */

const hands = new Hands({

  locateFile:file =>

    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:0.5,

  minTrackingConfidence:0.5

});


hands.onResults(results => {

  handLandmarks =
    results.multiHandLandmarks?.[0] || null;

});


/* =========================================================
   開啟相機
========================================================= */

async function startCamera(){

  if(!navigator.mediaDevices?.getUserMedia){

    throw new Error(
      '瀏覽器不支援相機 API'
    );

  }


  if(stream){

    stream
      .getTracks()
      .forEach(track => track.stop());

  }


  stream =
    await navigator.mediaDevices.getUserMedia({

      audio:false,

      video:{

        facingMode:facingMode,

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        },

        frameRate:{
          ideal:30,
          max:30
        }

      }

    });


  webcam.srcObject =
    stream;


  await webcam.play();


  resizeCanvas();

}


/* =========================================================
   切換鏡頭
========================================================= */

async function switchCamera(){

  if(!started) return;


  facingMode =
    facingMode === 'user'
      ? 'environment'
      : 'user';


  try{

    await startCamera();

  }catch(error){

    console.error(
      '鏡頭切換失敗',
      error
    );

  }

}


/* =========================================================
   嘴巴判斷
========================================================= */

function isMouthOpen(){

  if(!faceLandmarks){

    return false;

  }


  /*
    MediaPipe Face Mesh：

    13 = 上嘴唇
    14 = 下嘴唇
  */

  const upper =
    faceLandmarks[13];

  const lower =
    faceLandmarks[14];


  if(!upper || !lower){

    return false;

  }


  const distance =
    Math.abs(
      lower.y - upper.y
    );


  /*
    這裡故意降低門檻，
    讓手機 AR 比較容易偵測張嘴。
  */

  return distance > 0.045;

}


/* =========================================================
   手掌判斷
========================================================= */

function isHandOpen(){

  if(!handLandmarks){

    return false;

  }


  const fingers = [

    handLandmarks[8].y <
    handLandmarks[6].y,

    handLandmarks[12].y <
    handLandmarks[10].y,

    handLandmarks[16].y <
    handLandmarks[14].y,

    handLandmarks[20].y <
    handLandmarks[18].y

  ];


  const count =
    fingers.filter(Boolean).length;


  return count >= 3;

}


/* =========================================================
   動作判斷
========================================================= */

function detectState(){

  /*
    優先順序：

    1. 張嘴
    2. 張開手掌
    3. 一般
  */

  if(isMouthOpen()){

    return 'mouthOpen';

  }


  if(isHandOpen()){

    return 'handOpen';

  }


  return 'normal';

}


/* =========================================================
   一般狀態輪播
========================================================= */

function getNormalVideo(){

  const list =
    VIDEO_GROUPS.normal;

  const video =
    list[
      normalIndex %
      list.length
    ];

  normalIndex++;

  return video;

}


/* =========================================================
   動作對應影片
========================================================= */

function getVideoForState(state){

  if(state === 'mouthOpen'){

    const list =
      VIDEO_GROUPS.mouthOpen;

    return list[
      Math.floor(
        Math.random() *
        list.length
      )
    ];

  }


  if(state === 'handOpen'){

    const list =
      VIDEO_GROUPS.handOpen;

    return list[
      Math.floor(
        Math.random() *
        list.length
      )
    ];

  }


  return getNormalVideo();

}


/* =========================================================
   載入貓咪影片
========================================================= */

async function loadCatVideo(filename){

  if(!filename){

    return;

  }


  /*
    如果同一支影片正在播放，
    不重新載入。
  */

  if(
    filename === currentVideo &&
    catVideo.readyState >= 2
  ){

    return;

  }


  currentVideo =
    filename;


  videoText.textContent =
    `影片：${filename}`;


  catVideo.pause();


  /*
    GitHub Pages 使用相對路徑。
  */

  catVideo.src =
    './' + filename;


  catVideo.load();


  try{

    await catVideo.play();

  }catch(error){

    /*
      iOS / Safari 某些情況第一次播放
      可能需要再次 play。
    */

    console.warn(
      '貓咪影片播放等待',
      error
    );

  }

}


/* =========================================================
   狀態切換
========================================================= */

async function updateState(){

  const newState =
    detectState();


  /*
    狀態沒有改變，
    不重新切換影片。
  */

  if(
    newState === currentState &&
    currentVideo
  ){

    return;

  }


  currentState =
    newState;


  let text = '😺 一般';


  if(newState === 'mouthOpen'){

    text =
      '👄 張嘴';

  }

  else if(newState === 'handOpen'){

    text =
      '✋ 張開手掌';

  }


  stateText.textContent =
    text;


  const filename =
    getVideoForState(newState);


  await loadCatVideo(filename);

}


/* =========================================================
   找出人臉範圍
========================================================= */

function getFaceBox(){

  if(!faceLandmarks){

    return null;

  }


  let minX = 1;

  let maxX = 0;

  let minY = 1;

  let maxY = 0;


  for(
    const point of faceLandmarks
  ){

    minX =
      Math.min(
        minX,
        point.x
      );


    maxX =
      Math.max(
        maxX,
        point.x
      );


    minY =
      Math.min(
        minY,
        point.y
      );


    maxY =
      Math.max(
        maxY,
        point.y
      );

  }


  const width =
    (maxX - minX) *
    canvas.width;


  const height =
    (maxY - minY) *
    canvas.height;


  const centerX =
    ((minX + maxX) / 2) *
    canvas.width;


  const topY =
    minY *
    canvas.height;


  return {

    width,

    height,

    centerX,

    topY

  };

}


/* =========================================================
   ★ V3 貓咪位置
========================================================= */

function drawCatOnHead(){

  if(
    !faceLandmarks
  ){

    return;

  }


  if(
    catVideo.readyState <
    HTMLMediaElement.HAVE_CURRENT_DATA
  ){

    return;

  }


  const face =
    getFaceBox();


  if(!face){

    return;

  }


  /*
  ==========================================================
  V3 核心：

  貓咪尺寸縮小
  ==========================================================
  */

  const catWidth =
    face.width * 0.78;


  const videoRatio =
    catVideo.videoWidth &&
    catVideo.videoHeight

      ? catVideo.videoHeight /
        catVideo.videoWidth

      : 1;


  const catHeight =
    catWidth *
    videoRatio;


  /*
  ==========================================================
  貓咪水平位置

  直接對準臉部中心
  ==========================================================
  */

  const x =
    face.centerX -
    catWidth / 2;


  /*
  ==========================================================
  ★ 最重要的位置公式

  face.topY =
  人臉最上方

  貓咪底部 =
  人頭頂附近

  gap =
  貓咪與頭部之間的小空隙

  所以貓咪不會往臉上掉。
  ==========================================================
  */

  const gap =
    face.height * 0.06;


  const y =
    face.topY -
    catHeight +
    gap;


  /*
  ==========================================================
  防止貓咪超出畫面
  ==========================================================
  */

  const safeX =
    Math.max(
      -catWidth * 0.15,
      Math.min(
        canvas.width - catWidth * 0.85,
        x
      )
    );


  const safeY =
    Math.max(
      0,
      y
    );


  /*
  ==========================================================
  貓咪影片繪製

  不會直接把影片放到 HTML 上，
  而是畫進 AR Canvas。
  ==========================================================
  */

  ctx.drawImage(

    catVideo,

    safeX,

    safeY,

    catWidth,

    catHeight

  );

}


/* =========================================================
   AR Canvas
========================================================= */

function drawAR(){

  resizeCanvas();


  /*
    清空 AR 圖層
  */

  ctx.clearRect(

    0,

    0,

    canvas.width,

    canvas.height

  );


  /*
    注意：

    Canvas 本身不再繪製攝影機。

    攝影機由 #webcam 顯示。

    Canvas 只負責貓咪。

    因此貓咪會自然疊在鏡頭上。
  */

  drawCatOnHead();


  /*
    Debug 資訊
  */

  if(debugVisible){

    drawDebug();

  }

}


/* =========================================================
   Debug
========================================================= */

function drawDebug(){

  if(!faceLandmarks){

    return;

  }


  const face =
    getFaceBox();


  if(!face){

    return;

  }


  ctx.save();


  /*
    人臉框
  */

  ctx.strokeStyle =
    '#00ff66';

  ctx.lineWidth =
    3;


  ctx.strokeRect(

    face.centerX -
      face.width / 2,

    face.topY,

    face.width,

    face.height

  );


  /*
    頭頂中心十字
  */

  ctx.beginPath();

  ctx.moveTo(
    face.centerX - 15,
    face.topY
  );

  ctx.lineTo(
    face.centerX + 15,
    face.topY
  );

  ctx.moveTo(
    face.centerX,
    face.topY - 15
  );

  ctx.lineTo(
    face.centerX,
    face.topY + 15
  );

  ctx.stroke();


  ctx.restore();

}


/* =========================================================
   Debug UI
========================================================= */

function updateDebug(){

  const face =
    faceLandmarks
      ? '偵測到'
      : '等待';


  const hand =
    handLandmarks
      ? '偵測到'
      : '等待';


  debug.innerHTML =

    `Face: ${face}<br>` +

    `Hand: ${hand}<br>` +

    `State: ${currentState}`;

}


/* =========================================================
   AR Loop
========================================================= */

async function arLoop(timestamp){

  if(!started){

    return;

  }


  /*
    每幀先畫貓咪
  */

  drawAR();


  /*
    動作判斷
  */

  await updateState();


  updateDebug();


  /*
    MediaPipe 不需要每一幀都送，
    約 15 FPS 即可降低手機負擔。
  */

  if(
    timestamp -
    lastFrameTime >
    65
  ){

    lastFrameTime =
      timestamp;


    try{

      await faceMesh.send({

        image:webcam

      });


      await hands.send({

        image:webcam

      });

    }catch(error){

      console.warn(
        'MediaPipe error',
        error
      );

    }

  }


  requestAnimationFrame(
    arLoop
  );

}


/* =========================================================
   啟動 AR
========================================================= */

startBtn.onclick =
async function(){

  try{

    /*
      HTTPS 檢查
    */

    const localhost =

      location.hostname ===
      'localhost' ||

      location.hostname ===
      '127.0.0.1';


    if(
      !window.isSecureContext &&
      !localhost
    ){

      alert(
        '請使用 GitHub Pages HTTPS 開啟 AR'
      );

      return;

    }


    /*
      開啟相機
    */

    await startCamera();


    /*
      AR 開始
    */

    started =
      true;


    startOverlay
      .classList
      .add('hidden');


    /*
      初始狀態
    */

    currentState =
      'normal';


    const firstVideo =
      VIDEO_GROUPS.normal[0];


    await loadCatVideo(
      firstVideo
    );


    /*
      開始 AR Loop
    */

    requestAnimationFrame(
      arLoop
    );


  }catch(error){

    console.error(
      error
    );


    alert(
      `AR 啟動失敗：${error.name || error.message}`
    );

  }

};


/* =========================================================
   鏡頭按鈕
========================================================= */

cameraBtn.onclick =
async function(){

  await switchCamera();

};


/* =========================================================
   Debug 按鈕
========================================================= */

debugBtn.onclick =
function(){

  debugVisible =
    !debugVisible;

  debug.style.display =
    debugVisible
      ? 'block'
      : 'none';

};


/* =========================================================
   頁面事件
========================================================= */

window.addEventListener(
  'resize',
  resizeCanvas
);


window.addEventListener(
  'orientationchange',
  () => {

    setTimeout(
      resizeCanvas,
      500
    );

  }
);


/* =========================================================
   初始 Debug
========================================================= */

debug.style.display =
  'none';

console.log(
  '🐱 AR 貓咪 V3 已載入'
);

console.log(
  '一般：',
  VIDEO_GROUPS.normal
);

console.log(
  '張嘴：',
  VIDEO_GROUPS.mouthOpen
);

console.log(
  '張開手掌：',
  VIDEO_GROUPS.handOpen
);

</script>
