<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<title>AR 貓咪互動濾鏡</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, "Noto Sans TC", sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* =========================
   CAMERA
========================= */

#camera {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    background: #000;
}

/* =========================
   AR CANVAS
========================= */

#arCanvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

/*
    hidden catVideo

    影片本身不直接顯示，
    由 canvas 把影片影像繪製到 AR 畫面。
*/

#catVideo {
    position: absolute;

    width: 1px;
    height: 1px;

    left: -9999px;
    top: -9999px;

    opacity: 0;

    pointer-events: none;
}

/* =========================
   START SCREEN
========================= */

#startScreen {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.72);

    z-index: 20;
}

.startBox {
    width: min(88vw, 420px);

    padding: 28px 22px;

    text-align: center;

    border-radius: 24px;

    background: rgba(20,20,20,0.92);

    color: #fff;
}

.startBox h1 {
    margin: 0 0 12px;

    font-size: 26px;
}

.startBox p {
    margin: 8px 0 20px;

    line-height: 1.6;

    color: #ddd;
}

#startButton {
    width: 100%;

    border: 0;

    padding: 15px;

    border-radius: 14px;

    background: #fff;

    color: #111;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

#startButton:active {
    transform: scale(0.98);
}

/* =========================
   STATUS
========================= */

#status {
    position: absolute;

    top: max(16px, env(safe-area-inset-top));

    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 8px 14px;

    border-radius: 999px;

    background: rgba(0,0,0,0.5);

    color: #fff;

    font-size: 13px;

    pointer-events: none;

    white-space: nowrap;
}

/* =========================
   DEBUG PANEL
========================= */

#debugPanel {
    position: absolute;

    left: 10px;

    bottom: max(10px, env(safe-area-inset-bottom));

    z-index: 15;

    min-width: 210px;

    padding: 10px 12px;

    border-radius: 12px;

    background: rgba(0,0,0,0.68);

    color: #fff;

    font-family: monospace;

    font-size: 12px;

    line-height: 1.5;

    display: none;

    pointer-events: none;
}

/*
   ?debug=1 時開啟
*/

body.debug #debugPanel {
    display: block;
}

</style>
</head>

<body>

<div id="app">

    <!-- =========================
         CAMERA
    ========================== -->

    <video
        id="camera"
        autoplay
        muted
        playsinline
        webkit-playsinline
    ></video>


    <!-- =========================
         AR DRAWING
    ========================== -->

    <canvas id="arCanvas"></canvas>


    <!-- =========================
         REAL HIDDEN CAT VIDEO
    ========================== -->

    <video
        id="catVideo"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>


    <!-- =========================
         STATUS
    ========================== -->

    <div id="status">
        等待啟動相機
    </div>


    <!-- =========================
         DEBUG
    ========================== -->

    <div id="debugPanel">

        FACE<br>
        X: <span id="faceX">0</span><br>
        Y: <span id="faceY">0</span><br>
        W: <span id="faceW">0</span><br>
        H: <span id="faceH">0</span><br>

        CAT<br>
        X: <span id="catX">0</span><br>
        Y: <span id="catY">0</span><br>
        W: <span id="catW">0</span><br>
        H: <span id="catH">0</span><br>

        MOUTH:
        <span id="mouthState">CLOSED</span><br>

        HAND:
        <span id="handState">CLOSED</span><br>

        VIDEO:
        <span id="videoState">NONE</span>

    </div>


    <!-- =========================
         START
    ========================== -->

    <div id="startScreen">

        <div class="startBox">

            <h1>🐱 AR 貓咪互動濾鏡</h1>

            <p>
                允許使用相機後，<br>
                將臉部放入畫面即可開始。
            </p>

            <button id="startButton">
                開始 AR
            </button>

        </div>

    </div>

</div>


<!--
===========================================================
MediaPipe
===========================================================
-->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =========================================================
   AR CAT CONFIG
========================================================= */

const CAT_CONFIG = {

    /*
        貓咪寬度 = 臉部寬度 × widthScale
    */

    widthScale: 1.35,

    /*
        X 位移

        正數 = 右
        負數 = 左
    */

    offsetX: 0,

    /*
        Y 位移

        正數 = 下
        負數 = 上

        -0.72 代表往臉部上方移動
    */

    offsetY: -0.72,

    /*
        貓咪高度比例

        保持影片原始比例時使用 null
    */

    heightScale: null,

    /*
        貓咪透明度
    */

    opacity: 1.0,

    /*
        貓咪是否水平鏡像

        前鏡頭通常建議 false，
        因為畫面本身已經鏡像。
    */

    mirror: false

};


/* =========================================================
   VIDEO CONFIG
========================================================= */

/*
    所有影片依照使用者提供的檔案名稱設定。

    一般狀態：
    spider
    champion
    magic
    sleep

    張開嘴巴：
    chef
    eat
    drink

    張開手掌：
    cry
    work
*/

const CAT_VIDEOS = {

    normal: [

        "spider_cat_animation.mp4",

        "champion_cat_animation.mp4",

        "magic_cat_animation.mp4",

        "sleep_cat_animation.mp4"

    ],

    mouthOpen: [

        "chef_cat_animation.mp4",

        "eat_cat_animation.mp4",

        "drink_cat_animation.mp4"

    ],

    palmOpen: [

        "cry_cat_animation.mp4",

        "work_cat_animation.mp4"

    ]

};


/* =========================================================
   DOM
========================================================= */

const camera =
    document.getElementById("camera");

const canvas =
    document.getElementById("arCanvas");

const ctx =
    canvas.getContext("2d");

const catVideo =
    document.getElementById("catVideo");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const statusText =
    document.getElementById("status");


/* =========================================================
   DEBUG
========================================================= */

const DEBUG =
    new URLSearchParams(location.search).get("debug") === "1";

if (DEBUG) {
    document.body.classList.add("debug");
}


/* =========================================================
   DEBUG ELEMENTS
========================================================= */

const faceX =
    document.getElementById("faceX");

const faceY =
    document.getElementById("faceY");

const faceW =
    document.getElementById("faceW");

const faceH =
    document.getElementById("faceH");

const catX =
    document.getElementById("catX");

const catY =
    document.getElementById("catY");

const catW =
    document.getElementById("catW");

const catH =
    document.getElementById("catH");

const mouthState =
    document.getElementById("mouthState");

const handState =
    document.getElementById("handState");

const videoState =
    document.getElementById("videoState");


/* =========================================================
   STATE
========================================================= */

let faceData = null;

let handData = null;

let mouthOpen = false;

let palmOpen = false;

let currentMode = "normal";

let currentVideoIndex = -1;

let currentVideoName = "";

let running = false;

let animationFrame = null;


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        statusText.textContent =
            "正在開啟相機…";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "user"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });

        camera.srcObject = stream;

        await camera.play();

        resizeCanvas();

        startScreen.style.display = "none";

        statusText.textContent =
            "AR 已啟動";

        running = true;

        startDetection();

        renderLoop();

    }
    catch (error) {

        console.error(
            "Camera error:",
            error
        );

        statusText.textContent =
            "無法開啟相機";

        alert(
            "無法使用相機。\n\n" +
            "請確認：\n" +
            "1. 已允許瀏覽器使用相機\n" +
            "2. GitHub Pages 使用 HTTPS\n" +
            "3. Safari / Chrome 已允許相機權限"
        );

    }

}


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        window.innerWidth * dpr;

    canvas.height =
        window.innerHeight * dpr;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   MEDIAPIPE FACE MESH
========================================================= */

const faceMesh =
    new FaceMesh({

        locateFile: (file) => {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/face_mesh/" +
                file
            );

        }

    });


faceMesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


faceMesh.onResults(
    onFaceResults
);


/* =========================================================
   MEDIAPIPE HANDS
========================================================= */

const hands =
    new Hands({

        locateFile: (file) => {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );

        }

    });


hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


hands.onResults(
    onHandResults
);


/* =========================================================
   DETECTION LOOP
========================================================= */

let detectionBusy = false;

async function startDetection() {

    if (!running) {
        return;
    }

    if (detectionBusy) {

        requestAnimationFrame(
            startDetection
        );

        return;

    }

    detectionBusy = true;

    try {

        await faceMesh.send({
            image: camera
        });

        await hands.send({
            image: camera
        });

    }
    catch (error) {

        console.error(
            "Detection error:",
            error
        );

    }

    detectionBusy = false;

    requestAnimationFrame(
        startDetection
    );

}


/* =========================================================
   FACE RESULTS
========================================================= */

function onFaceResults(results) {

    if (
        !results.multiFaceLandmarks ||
        !results.multiFaceLandmarks.length
    ) {

        faceData = null;

        mouthOpen = false;

        return;

    }

    const landmarks =
        results.multiFaceLandmarks[0];

    const points =
        landmarks.map(
            p => ({
                x: p.x,
                y: p.y
            })
        );


    let minX = 1;
    let minY = 1;
    let maxX = 0;
    let maxY = 0;


    for (const p of points) {

        minX =
            Math.min(
                minX,
                p.x
            );

        minY =
            Math.min(
                minY,
                p.y
            );

        maxX =
            Math.max(
                maxX,
                p.x
            );

        maxY =
            Math.max(
                maxY,
                p.y
            );

    }


    /*
        MediaPipe 座標是 0~1。

        因為 camera 是水平鏡像，
        X 必須反轉。
    */

    const mirroredMinX =
        1 - maxX;

    const mirroredMaxX =
        1 - minX;


    faceData = {

        x: mirroredMinX,

        y: minY,

        width:
            mirroredMaxX -
            mirroredMinX,

        height:
            maxY -
            minY,

        centerX:
            (
                mirroredMinX +
                mirroredMaxX
            ) / 2,

        centerY:
            (
                minY +
                maxY
            ) / 2,

        landmarks:
            landmarks

    };


    mouthOpen =
        detectMouthOpen(
            landmarks
        );

}


/* =========================================================
   MOUTH DETECTION
========================================================= */

function detectMouthOpen(
    landmarks
) {

    /*
        上唇 / 下唇

        MediaPipe FaceMesh：

        13 = upper lip
        14 = lower lip

        61 / 291 = mouth sides
    */

    const upper =
        landmarks[13];

    const lower =
        landmarks[14];

    const left =
        landmarks[61];

    const right =
        landmarks[291];


    const vertical =
        distance(
            upper,
            lower
        );

    const horizontal =
        distance(
            left,
            right
        );


    if (horizontal <= 0) {
        return false;
    }


    const ratio =
        vertical /
        horizontal;


    /*
        張嘴判定門檻。

        可依你的模型再調整。
    */

    return ratio > 0.28;

}


/* =========================================================
   HAND RESULTS
========================================================= */

function onHandResults(results) {

    if (
        !results.multiHandLandmarks ||
        !results.multiHandLandmarks.length
    ) {

        handData = null;

        palmOpen = false;

        return;

    }


    /*
        只要有一隻手掌張開，
        就判定 palmOpen。
    */

    let detectedOpenPalm = false;


    for (
        const landmarks
        of results.multiHandLandmarks
    ) {

        if (
            detectOpenPalm(
                landmarks
            )
        ) {

            detectedOpenPalm = true;

            break;

        }

    }


    palmOpen =
        detectedOpenPalm;


    handData = {

        count:
            results.multiHandLandmarks.length

    };

}


/* =========================================================
   OPEN PALM DETECTION
========================================================= */

function detectOpenPalm(
    landmarks
) {

    /*
        MediaPipe Hand landmarks

        wrist = 0

        thumb:
        4

        index:
        8

        middle:
        12

        ring:
        16

        pinky:
        20
    */


    const wrist =
        landmarks[0];


    const fingers = [

        [8, 6],

        [12, 10],

        [16, 14],

        [20, 18]

    ];


    let extended = 0;


    for (
        const [tip, pip]
        of fingers
    ) {

        const tipPoint =
            landmarks[tip];

        const pipPoint =
            landmarks[pip];


        const tipDistance =
            distance(
                tipPoint,
                wrist
            );

        const pipDistance =
            distance(
                pipPoint,
                wrist
            );


        if (
            tipDistance >
            pipDistance * 1.12
        ) {

            extended++;

        }

    }


    /*
        四根手指至少三根伸展
        視為張開手掌。
    */

    return extended >= 3;

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   MODE
========================================================= */

function getCurrentMode() {

    /*
        手掌優先。

        如果同時張嘴 + 張手，
        使用 palmOpen。
    */

    if (palmOpen) {

        return "palmOpen";

    }


    if (mouthOpen) {

        return "mouthOpen";

    }


    return "normal";

}


/* =========================================================
   VIDEO SWITCH
========================================================= */

function updateCatVideo() {

    const mode =
        getCurrentMode();


    const list =
        CAT_VIDEOS[mode];


    if (!list || !list.length) {
        return;
    }


    /*
        如果模式改變，
        從該模式第一部開始。
    */

    if (
        mode !== currentMode
    ) {

        currentMode =
            mode;

        currentVideoIndex =
            -1;

    }


    /*
        如果目前沒有影片，
        選第一部。
    */

    if (
        currentVideoIndex < 0
    ) {

        currentVideoIndex = 0;

        loadCatVideo(
            list[currentVideoIndex]
        );

        return;

    }


    /*
        同一個影片播完後，
        自動循環該模式的影片。
    */

}


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadCatVideo(
    fileName
) {

    if (
        currentVideoName ===
        fileName
    ) {

        if (
            catVideo.paused
        ) {

            catVideo.play()
                .catch(() => {});

        }

        return;

    }


    currentVideoName =
        fileName;


    /*
        真正使用 hidden catVideo。
    */

    catVideo.pause();

    catVideo.removeAttribute(
        "src"
    );

    catVideo.load();


    catVideo.src =
        fileName;


    catVideo.loop =
        false;


    catVideo.muted =
        true;


    catVideo.playsInline =
        true;


    catVideo.load();


    catVideo.onloadeddata =
        () => {

            catVideo.play()
                .catch(
                    error => {
                        console.warn(
                            "Video play blocked:",
                            error
                        );
                    }
                );

        };


    catVideo.onerror =
        () => {

            console.error(
                "影片載入失敗：",
                fileName
            );

            statusText.textContent =
                "影片載入失敗：" +
                fileName;

        };


    updateDebugVideo();

}


/* =========================================================
   VIDEO ENDED
========================================================= */

catVideo.addEventListener(
    "ended",
    () => {

        const list =
            CAT_VIDEOS[
                currentMode
            ];


        if (
            !list ||
            !list.length
        ) {
            return;
        }


        /*
            下一部影片
        */

        currentVideoIndex =
            (
                currentVideoIndex + 1
            ) %
            list.length;


        loadCatVideo(
            list[
                currentVideoIndex
            ]
        );

    }
);


/* =========================================================
   CAT POSITION
========================================================= */

function calculateCatRect() {

    if (!faceData) {
        return null;
    }


    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    /*
        臉部寬度
    */

    const faceWidthPx =
        faceData.width *
        screenWidth;


    /*
        貓咪寬度
    */

    const width =
        faceWidthPx *
        CAT_CONFIG.widthScale;


    /*
        影片比例

        如果影片還沒有 metadata，
        使用 16:9 作為暫時比例。
    */

    let videoRatio =
        16 / 9;


    if (
        catVideo.videoWidth > 0 &&
        catVideo.videoHeight > 0
    ) {

        videoRatio =
            catVideo.videoWidth /
            catVideo.videoHeight;

    }


    let height =
        width /
        videoRatio;


    if (
        CAT_CONFIG.heightScale
    ) {

        height *=
            CAT_CONFIG.heightScale;

    }


    /*
        Face center
    */

    const faceCenterX =
        faceData.centerX *
        screenWidth;

    const faceCenterY =
        faceData.centerY *
        screenHeight;


    /*
        X 偏移

        以臉寬作為比例
    */

    const x =
        faceCenterX -
        width / 2 +
        CAT_CONFIG.offsetX *
        faceWidthPx;


    /*
        Y 偏移

        同樣使用臉寬作為比例
    */

    const y =
        faceCenterY -
        height / 2 +
        CAT_CONFIG.offsetY *
        faceWidthPx;


    return {

        x,
        y,
        width,
        height,

        centerX:
            x +
            width / 2,

        centerY:
            y +
            height / 2

    };

}


/* =========================================================
   RENDER LOOP
========================================================= */

function renderLoop() {

    if (!running) {
        return;
    }


    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    /*
        每一幀確認應該使用哪個影片。
    */

    updateCatVideo();


    /*
        沒有臉就不顯示貓咪。
    */

    if (faceData) {

        const rect =
            calculateCatRect();


        if (
            rect &&
            catVideo.readyState >= 2
        ) {

            drawCat(
                rect
            );

        }


        if (DEBUG) {

            drawDebug(
                rect
            );

        }

    }


    updateDebug();


    animationFrame =
        requestAnimationFrame(
            renderLoop
        );

}


/* =========================================================
   DRAW CAT
========================================================= */

function drawCat(rect) {

    ctx.save();


    ctx.globalAlpha =
        CAT_CONFIG.opacity;


    if (
        CAT_CONFIG.mirror
    ) {

        ctx.translate(
            rect.x +
            rect.width,
            rect.y
        );

        ctx.scale(
            -1,
            1
        );

        ctx.drawImage(
            catVideo,
            0,
            0,
            rect.width,
            rect.height
        );

    }
    else {

        ctx.drawImage(
            catVideo,
            rect.x,
            rect.y,
            rect.width,
            rect.height
        );

    }


    ctx.restore();

}


/* =========================================================
   DEBUG DRAW
========================================================= */

function drawDebug(rect) {

    if (!faceData) {
        return;
    }


    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    /*
        FACE BOX
        綠色
    */

    const fx =
        faceData.x * w;

    const fy =
        faceData.y * h;

    const fw =
        faceData.width * w;

    const fh =
        faceData.height * h;


    ctx.save();


    ctx.strokeStyle =
        "#00ff00";

    ctx.lineWidth =
        3;

    ctx.strokeRect(
        fx,
        fy,
        fw,
        fh
    );


    /*
        FACE CENTER
    */

    const faceCX =
        faceData.centerX * w;

    const faceCY =
        faceData.centerY * h;


    ctx.strokeStyle =
        "#00ff00";

    ctx.beginPath();

    ctx.moveTo(
        faceCX - 12,
        faceCY
    );

    ctx.lineTo(
        faceCX + 12,
        faceCY
    );

    ctx.moveTo(
        faceCX,
        faceCY - 12
    );

    ctx.lineTo(
        faceCX,
        faceCY + 12
    );

    ctx.stroke();


    /*
        CAT BOX
        紅色
    */

    if (rect) {

        ctx.strokeStyle =
            "#ff0000";

        ctx.lineWidth =
            3;

        ctx.strokeRect(
            rect.x,
            rect.y,
            rect.width,
            rect.height
        );


        /*
            CAT CENTER
        */

        ctx.beginPath();

        ctx.moveTo(
            rect.centerX - 12,
            rect.centerY
        );

        ctx.lineTo(
            rect.centerX + 12,
            rect.centerY
        );

        ctx.moveTo(
            rect.centerX,
            rect.centerY - 12
        );

        ctx.lineTo(
            rect.centerX,
            rect.centerY + 12
        );

        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   DEBUG VALUES
========================================================= */

function updateDebug() {

    if (!DEBUG) {
        return;
    }


    if (faceData) {

        faceX.textContent =
            Math.round(
                faceData.centerX *
                window.innerWidth
            );

        faceY.textContent =
            Math.round(
                faceData.centerY *
                window.innerHeight
            );

        faceW.textContent =
            Math.round(
                faceData.width *
                window.innerWidth
            );

        faceH.textContent =
            Math.round(
                faceData.height *
                window.innerHeight
            );

    }
    else {

        faceX.textContent = 0;
        faceY.textContent = 0;
        faceW.textContent = 0;
        faceH.textContent = 0;

    }


    const rect =
        calculateCatRect();


    if (rect) {

        catX.textContent =
            Math.round(
                rect.x
            );

        catY.textContent =
            Math.round(
                rect.y
            );

        catW.textContent =
            Math.round(
                rect.width
            );

        catH.textContent =
            Math.round(
                rect.height
            );

    }
    else {

        catX.textContent = 0;
        catY.textContent = 0;
        catW.textContent = 0;
        catH.textContent = 0;

    }


    mouthState.textContent =
        mouthOpen
            ? "OPEN"
            : "CLOSED";


    handState.textContent =
        palmOpen
            ? "OPEN"
            : "CLOSED";


    videoState.textContent =
        currentVideoName ||
        "NONE";

}


/* =========================================================
   DEBUG VIDEO
========================================================= */

function updateDebugVideo() {

    if (!DEBUG) {
        return;
    }

    videoState.textContent =
        currentVideoName ||
        "NONE";

}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    async () => {

        /*
            使用者點擊後才啟動 camera，
            對 iPhone Safari 最穩定。
        */

        await startCamera();

    }
);


/* =========================================================
   AUTO CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        running = false;


        if (
            camera.srcObject
        ) {

            const tracks =
                camera.srcObject
                    .getTracks();

            tracks.forEach(
                track =>
                    track.stop()
            );

        }

        if (catVideo) {

            catVideo.pause();

        }

    }
);

========================================================= */

resizeCanvas();

    DEBUG
);

console.log(

    CAT_CONFIG
);

console.log(

    CAT_VIDEOS
);
