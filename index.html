<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>AR 貓咪｜互動濾鏡</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<style>
:root{
  --bg:#07070b;
  --panel:rgba(20,20,28,.82);
  --line:rgba(255,255,255,.09);
  --text:#fff;
  --muted:#a9a9b4;
  --pink:#ff4f9a;
  --green:#35d07f;
  --yellow:#ffd166;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",Arial,sans-serif}
button{border:0;border-radius:999px;padding:12px 16px;color:#fff;background:#262631;font-weight:800;font-size:14px;cursor:pointer;min-height:44px}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
#app{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{
  position:relative;width:100%;height:100svh;min-height:100svh;
  background:#000;overflow:hidden;
}
#webcam{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#output{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:#000}
#topBar{
  position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:center;pointer-events:none
}
#brand,#livePill{
  padding:8px 11px;border-radius:999px;background:rgba(0,0,0,.48);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12px;font-weight:800
}
#livePill{color:#ddd}\n#topActions{display:flex;align-items:center;gap:8px;pointer-events:auto}\n#soundBtn{font-size:16px}
#liveDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
#startOverlay{
  position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;
  padding:22px 16px max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent 20%,rgba(0,0,0,.84))
}
#startBox{width:min(520px,100%);padding:22px;border-radius:28px;background:rgba(18,18,24,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;border:1px solid var(--line)}
#startBox h1{margin:0 0 8px;font-size:28px}
#startBox p{margin:0 0 16px;line-height:1.7;color:#ddd;font-size:14px}
#startBtn{width:100%;background:linear-gradient(135deg,#ff4f9a,#8d5cff);font-size:16px}
#startOverlay.hidden{display:none}
#interactionGuide{
  position:absolute;z-index:12;left:50%;top:max(18px,env(safe-area-inset-top) + 12px);
  transform:translateX(-50%);width:auto;max-width:min(88vw,420px);
  padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.38);
  border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);color:#fff;text-align:center;
  font-size:13px;line-height:1.35;pointer-events:none;white-space:nowrap;opacity:.88
}
#interactionGuide.active{transform:translateX(-50%) translateY(-4px)}
#guideTitle{font-size:14px;font-weight:900}
#guideText{font-size:12px;color:#eee;line-height:1.5;margin-top:2px}
#captureBar{
  position:absolute;z-index:15;left:50%;bottom:max(22px,env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);
  display:flex;align-items:center;gap:10px
}
.captureBtn{width:58px;height:58px;padding:0;border-radius:50%;background:#fff;color:#111;border:4px solid rgba(255,255,255,.35);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.captureBtn.recording{background:#ff4050;color:#fff}
#switchBtn{width:46px;height:46px;padding:0;background:rgba(0,0,0,.55);backdrop-filter:blur(10px)}
.miniAction{width:46px;height:46px;padding:0;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.18)}
.hidden{display:none!important}
#recordPreview,#testVideo{display:none!important}
@media(max-width:680px){
  #stage{height:100svh;min-height:100svh}
  #interactionGuide{top:max(18px,env(safe-area-inset-top) + 12px);max-width:88vw}
}
@media(max-width:380px){
  #interactionGuide{top:max(18px,env(safe-area-inset-top) + 12px);max-width:88vw}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="webcam" autoplay muted playsinline webkit-playsinline></video>
    <canvas id="output"></canvas>

    <div id="topBar">
      <div id="brand">🐱 AR 貓咪</div>
      <div id="topActions"><button id="soundBtn" class="miniAction" title="開啟聲音" aria-label="開啟聲音">🔊</button><div id="livePill"><span id="liveDot"></span><span id="liveText">準備中</span></div></div>
    </div>

    <div id="interactionGuide">
      <div id="guideTitle">🐱 跟貓咪互動</div>
      <div id="guideText">👄 張嘴・✋ 張開手掌・貓咪會自動回應</div>
    </div>

    <div id="captureBar">
      <button id="switchBtn" title="切換鏡頭" aria-label="切換鏡頭">🔄</button>
      <button id="recordBtn" class="captureBtn" title="開始錄影" aria-label="開始錄影">●</button>
      <button id="snapshotBtn" class="captureBtn" title="拍照" aria-label="拍照">📸</button>
      <button id="downloadBtn" class="miniAction hidden" title="儲存影片到手機" aria-label="儲存影片到手機">💾</button>
    </div>

    <div id="startOverlay">
      <div id="startBox">
        <h1>🐱 AR 貓咪</h1>
        <p>把臉放進畫面，貓咪會自動跟著你。<br>張嘴、張開手掌，就能觸發不同互動。</p>
        <button id="startBtn">📷 開始玩</button>
        <div class="small" style="margin-top:10px">首次使用請允許相機權限</div>
      </div>
    </div>
  </div>

  <!-- Hidden playback element: used internally to composite the cat animation onto the AR canvas. -->
  <video id="testVideo" muted playsinline webkit-playsinline preload="auto" aria-hidden="true"></video>
  <video id="recordPreview" controls playsinline webkit-playsinline aria-hidden="true"></video>
</div>

<script>
'use strict';

/* =========================
   影片對應
========================= */
const VIDEO_GROUPS = {
  normal: [
    'spider_cat_animation.mp4',
    'champion_cat_animation.mp4',
    'magic_cat_animation.mp4',
    'sleep_cat_animation.mp4'
  ],
  mouthOpen: [
    'chef_cat_animation.mp4',
    'eat_cat_animation.mp4',
    'drink_cat_animation.mp4'
  ],
  handOpen: [
    'cry_cat_animation.mp4',
    'work_cat_animation.mp4'
  ]
};

const ALL_VIDEOS = [...new Set([
  ...VIDEO_GROUPS.normal,
  ...VIDEO_GROUPS.mouthOpen,
  ...VIDEO_GROUPS.handOpen
])];

const $ = id => document.getElementById(id);
const video = $('webcam');
const canvas = $('output');
const ctx = canvas.getContext('2d', {alpha:false});
const testVideo = $('testVideo');
const recordCanvas = document.createElement('canvas');
const recordCtx = recordCanvas.getContext('2d', {alpha:false});
const beautyLayer = document.createElement('canvas');
const beautyCtx = beautyLayer.getContext('2d', {alpha:true});

let stream = null;
let facingMode = 'user';
let arStarted = false;
let faceLandmarks = null;
let handLandmarks = null;
let currentState = 'none';
let currentVideo = '';
let normalIndex = 0;
let mouthIndex = 0;
let handIndex = 0;
let lastProcess = 0;
let changingVideo = false;
let videoChangeToken = 0;
let candidateState = 'normal';
let candidateCount = 0;
let lastActionAt = 0;
let recording = false;
let recorder = null;
let chunks = [];
let recordedBlob = null;
let recordedUrl = null;
let beautyStrength = 100; // 固定最大
let audioCtx = null;
let audioDestination = null;
let bgMusic = null;
let meowAudio = null;
let audioEnabled = false;
let audioMusicSource = null;
let audioMeowSource = null;
let musicGain = null;
let meowGain = null;
const STATE_CONFIRM_FRAMES = 4;
const ACTION_COOLDOWN_MS = 450;
const PROCESS_INTERVAL_MS = 70;

/* =========================
   UI / 診斷
========================= */
function log(msg){
  console.log('[AR Cat]', msg);
}
function setStatus(){ /* internal diagnostic hook intentionally hidden from users */ }
function overall(){ /* internal diagnostic hook intentionally hidden from users */ }
function updateGuide(state){
  const title = $('guideTitle');
  const text = $('guideText');
  const guide = $('interactionGuide');
  if(state === 'mouthOpen'){
    title.textContent = '👄 嘴巴互動';
    text.textContent = '偵測到張嘴！貓咪切換成嘴巴互動影片。';
    guide.classList.add('active');
  }else if(state === 'handOpen'){
    title.textContent = '✋ 手掌互動';
    text.textContent = '偵測到張開手掌！貓咪切換成手掌互動影片。';
    guide.classList.add('active');
  }else{
    title.textContent = '🐱 跟貓咪互動';
    text.textContent = '👄 張嘴・✋ 張開手掌・貓咪會自動回應';
    guide.classList.remove('active');
  }
}
function diagnoseEnvironment(){
  const localhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const secure = window.isSecureContext || localhost;
  if(secure){
    setStatus('secureStatus','✅ HTTPS / 安全來源','ok');
    log('HTTPS / 安全來源 OK');
  }else{
    setStatus('secureStatus','❌ 需要 HTTPS','bad');
    log('請使用 GitHub Pages 或其他 HTTPS 網站');
  }
}

/* =========================
   FaceMesh
========================= */
const faceMesh = new FaceMesh({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.55,
  minTrackingConfidence: 0.55
});
faceMesh.onResults(results => {
  faceLandmarks = results.multiFaceLandmarks?.[0] || null;
  setStatus('faceStatus', faceLandmarks ? '✅ 人臉已鎖定' : '⚪ 尋找人臉', faceLandmarks ? 'ok' : 'wait');
});

/* =========================
   Hands
========================= */
const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.55,
  minTrackingConfidence: 0.55
});
hands.onResults(results => {
  handLandmarks = results.multiHandLandmarks?.[0] || null;
  setStatus('handStatus', handLandmarks ? '✋ 手掌已偵測' : '⚪ 尋找手掌', handLandmarks ? 'ok' : 'wait');
});

/* =========================
   Camera
========================= */
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('此瀏覽器不支援相機');
  if(stream) stream.getTracks().forEach(t => t.stop());

  stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{
      facingMode:{ideal:facingMode},
      width:{ideal:1280},
      height:{ideal:720},
      frameRate:{ideal:30,max:30}
    }
  });

  video.srcObject = stream;
  await video.play();
  resizeCanvas();

  setStatus('cameraStatus','✅ 相機已開啟','ok');
  $('liveText').textContent = 'LIVE';
  log(`相機啟動：${video.videoWidth}×${video.videoHeight}`);
}

async function switchCamera(){
  if(!arStarted) return;
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  try{
    await startCamera();
    faceLandmarks = null;
    handLandmarks = null;
    log(`鏡頭切換：${facingMode}`);
  }catch(e){
    log(`❌ 切換鏡頭失敗：${e.message}`);
  }
}

/* =========================
   Canvas / 手機顯示
========================= */
function resizeCanvas(){
  const w = video.videoWidth || 1280;
  const h = video.videoHeight || 720;
  if(canvas.width !== w || canvas.height !== h){
    canvas.width = w;
    canvas.height = h;
    recordCanvas.width = w;
    recordCanvas.height = h;
    beautyLayer.width = w;
    beautyLayer.height = h;
    setStatus('canvasStatus',`✅ ${w}×${h}`,'ok');
  }
}

/* =========================
   臉部幾何
   所有 x 都轉成「鏡像後」座標，
   因此貓咪會與自拍畫面真正對齊。
========================= */
function px(p){
  return {x:(1-p.x)*canvas.width,y:p.y*canvas.height};
}
function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}
function facePoint(index){
  return faceLandmarks?.[index] ? px(faceLandmarks[index]) : null;
}
function getFaceGeometry(){
  if(!faceLandmarks) return null;

  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of faceLandmarks){
    const q = px(p);
    minX=Math.min(minX,q.x); maxX=Math.max(maxX,q.x);
    minY=Math.min(minY,q.y); maxY=Math.max(maxY,q.y);
  }

  // 眉毛上緣：左右眉毛的上方點，避免用臉框 minY 造成貓咪上下跳動
  const browIds = [105,107,66,336,334,296];
  const brows = browIds.map(facePoint).filter(Boolean);
  const browY = brows.reduce((s,p)=>s+p.y,0)/Math.max(1,brows.length);

  // forehead/head-top 取 10，再與臉框 top 做保守融合
  const forehead = facePoint(10);
  const headTop = forehead ? Math.min(forehead.y, minY + (maxY-minY)*0.06) : minY;

  const leftCheek = facePoint(234);
  const rightCheek = facePoint(454);
  const faceWidth = leftCheek && rightCheek ? dist(leftCheek,rightCheek) : (maxX-minX);

  const center = facePoint(9) || {x:(minX+maxX)/2,y:(minY+maxY)/2};

  return {minX,maxX,minY,maxY,centerX:center.x,centerY:center.y,browY,headTop,faceWidth,faceHeight:maxY-minY};
}

/* =========================
   嘴巴偵測
   用「嘴巴開口 / 臉寬」比例，
   比固定 .045 更能適應不同距離與臉型。
========================= */
function mouthOpen(){
  if(!faceLandmarks) return false;
  const upper = facePoint(13);
  const lower = facePoint(14);
  const left = facePoint(61);
  const right = facePoint(291);
  if(!upper || !lower || !left || !right) return false;

  const opening = dist(upper,lower);
  const mouthWidth = Math.max(1,dist(left,right));
  const ratio = opening / mouthWidth;

  // hysteresis：張開與關閉使用不同門檻，避免臨界抖動
  return ratio > 0.22;
}

/* =========================
   手掌偵測
   以每根手指的伸展程度 + 掌心比例判斷，
   比單純比較 y 座標更適合手機不同角度。
========================= */
function handOpen(){
  if(!handLandmarks) return false;
  const p = i => handLandmarks[i];

  const wrist = p(0);
  const middleMcp = p(9);
  const palm = Math.max(0.001,Math.hypot(wrist.x-middleMcp.x,wrist.y-middleMcp.y));

  const fingers = [
    [8,6],[12,10],[16,14],[20,18]
  ];

  let extended = 0;
  for(const [tip,pip] of fingers){
    const tipDist = Math.hypot(p(tip).x-wrist.x,p(tip).y-wrist.y);
    const pipDist = Math.hypot(p(pip).x-wrist.x,p(pip).y-wrist.y);
    if(tipDist > pipDist*1.12 && tipDist > palm*1.65) extended++;
  }

  // 拇指用 tip 到 index MCP 的距離
  const thumbTip = p(4);
  const indexMcp = p(5);
  const thumbOpen = Math.hypot(thumbTip.x-indexMcp.x,thumbTip.y-indexMcp.y) > palm*0.85;

  return extended >= 3 && thumbOpen;
}

function detectRawState(){
  // 嘴巴優先，符合互動直覺；同時張嘴+張手時仍先播放嘴巴影片
  if(mouthOpen()) return 'mouthOpen';
  if(handOpen()) return 'handOpen';
  return 'normal';
}

function getStableState(raw){
  if(raw !== candidateState){
    candidateState = raw;
    candidateCount = 1;
    return currentState === 'none' ? raw : currentState;
  }
  candidateCount++;
  return candidateCount >= STATE_CONFIRM_FRAMES
    ? raw
    : (currentState === 'none' ? raw : currentState);
}

/* =========================
   影片
========================= */
function cleanName(name){
  return name.replace(/_animation\.mp4\.mp4$/,'').replace(/_animation\.mp4$/,'').replace(/\.mp4$/,'');
}
function nextNormalVideo(){
  const name = VIDEO_GROUPS.normal[normalIndex % VIDEO_GROUPS.normal.length];
  normalIndex++;
  return name;
}
function nextMouthVideo(){
  const name = VIDEO_GROUPS.mouthOpen[mouthIndex % VIDEO_GROUPS.mouthOpen.length];
  mouthIndex++;
  return name;
}
function nextHandVideo(){
  const name = VIDEO_GROUPS.handOpen[handIndex % VIDEO_GROUPS.handOpen.length];
  handIndex++;
  return name;
}
async function playCat(name){
  if(!name) return;
  while(changingVideo) await new Promise(r=>setTimeout(r,20));
  changingVideo = true;
  const token = ++videoChangeToken;

  try{
    testVideo.pause();
    testVideo.src = `./${encodeURIComponent(name)}`;
    testVideo.load();
    currentVideo = name;
    setStatus('catStatus',`⏳ ${cleanName(name)}`,'wait');
    log(`🐱 播放：${name}`);

    await new Promise((resolve,reject)=>{
      let done=false;
      const cleanup=()=>{
        testVideo.removeEventListener('loadeddata',onLoad);
        testVideo.removeEventListener('error',onError);
      };
      const onLoad=()=>{if(done)return;done=true;cleanup();resolve()};
      const onError=()=>{if(done)return;done=true;cleanup();reject(new Error('影片載入失敗'))};
      testVideo.addEventListener('loadeddata',onLoad,{once:true});
      testVideo.addEventListener('error',onError,{once:true});
      setTimeout(()=>{if(!done){done=true;cleanup();resolve()}},5000);
    });

    if(token !== videoChangeToken) return;
    testVideo.currentTime = 0;
    await testVideo.play().catch(()=>{});
    setStatus('catStatus',`✅ ${cleanName(name)}`,'ok');
  }catch(e){
    setStatus('catStatus',`❌ ${cleanName(name)}`,'bad');
    log(`❌ 影片錯誤：${name} / ${e.message}`);
  }finally{
    changingVideo = false;
  }
}

/* =========================
   AR 狀態 → 動作影片
========================= */
async function changeARVideo(state){
  if(state === currentState && currentVideo) return;
  currentState = state;
  updateGuide(state);

  let name;
  if(state === 'mouthOpen'){
    name = nextMouthVideo();
    triggerCatSound();
  }else if(state === 'handOpen'){
    name = nextHandVideo();
    triggerCatSound();
  }
  else {
    // 回到 normal 時只在目前影片結束或不存在時切換
    if(currentVideo && !testVideo.ended && testVideo.currentTime > 0) return;
    name = nextNormalVideo();
  }
  await playCat(name);
}

/* =========================
   美顏：固定 MAX
   先複製原畫面到 offscreen，再以柔焦疊回臉部，
   避免 canvas 自我取樣造成重複模糊。
========================= */
function drawBeauty(){
  if(!faceLandmarks) return;
  const g = getFaceGeometry();
  if(!g) return;

  const padX = g.faceWidth * 0.24;
  const padY = g.faceHeight * 0.20;
  const x = Math.max(0,g.minX-padX);
  const y = Math.max(0,g.minY-padY);
  const w = Math.min(canvas.width-x,(g.maxX-g.minX)+padX*2);
  const h = Math.min(canvas.height-y,(g.maxY-g.minY)+padY*2);

  beautyCtx.clearRect(0,0,beautyLayer.width,beautyLayer.height);
  beautyCtx.drawImage(canvas,0,0);

  ctx.save();
  ctx.beginPath();
  ctx.ellipse(g.centerX,g.centerY,g.faceWidth*0.60,g.faceHeight*0.66,0,0,Math.PI*2);
  ctx.clip();
  ctx.globalAlpha = 0.20 + beautyStrength/100*0.12;
  ctx.filter = 'blur(4px)';
  ctx.drawImage(beautyLayer,x,y,w,h,x,y,w,h);
  ctx.restore();
}

/* =========================
   貓咪定位
   目標：眉毛正上方；允許影片超過頭頂。
   寬度依臉寬縮放，避免人靠近鏡頭時突然巨大。
========================= */
function drawCat(){
  if(!faceLandmarks || testVideo.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
  const g = getFaceGeometry();
  if(!g) return;

  const catWidth = Math.max(120,Math.min(canvas.width*0.62,g.faceWidth*0.92));
  const vw = testVideo.videoWidth || 1;
  const vh = testVideo.videoHeight || 1;
  const aspect = vh/vw;
  const catHeight = catWidth * Math.max(0.85,Math.min(1.35,aspect));

  const x = g.centerX - catWidth/2;

  // 讓貓咪底部落在眉毛上方；往上偏移 0.18 個貓高，保留「超過頭頂」空間
  const bottomY = g.browY - g.faceHeight*0.04;
  const y = bottomY - catHeight;

  ctx.save();
  ctx.globalAlpha = 1;
  ctx.drawImage(testVideo,x,y,catWidth,catHeight);
  ctx.restore();
}

/* =========================
   AR 畫面
========================= */
function drawAR(){
  if(!video.videoWidth) return;
  resizeCanvas();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 自拍鏡像
  ctx.save();
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.restore();

  drawBeauty();
  drawCat();
  setStatus('canvasStatus','✅ AR 即時運作','ok');
}

/* =========================
   錄影 / 拍照
========================= */
function updateRecordCanvas(){
  if(!canvas.width) return;
  if(recordCanvas.width !== canvas.width || recordCanvas.height !== canvas.height){
    recordCanvas.width = canvas.width;
    recordCanvas.height = canvas.height;
  }
  recordCtx.drawImage(canvas,0,0,recordCanvas.width,recordCanvas.height);
}
function recordFrame(){
  if(!recording) return;
  updateRecordCanvas();
  requestAnimationFrame(recordFrame);
}
function supportedMime(){
  if(!window.MediaRecorder) return '';
  const types = [
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  return types.find(t=>MediaRecorder.isTypeSupported?.(t)) || '';
}
async function ensureRecordingAudio(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) throw new Error('此瀏覽器不支援 Web Audio');

    audioCtx = new Ctx();
    audioDestination = audioCtx.createMediaStreamDestination();

    bgMusic = new Audio('./background_music.mp3');
    bgMusic.loop = true;
    bgMusic.preload = 'auto';
    bgMusic.crossOrigin = 'anonymous';

    meowAudio = new Audio('./cat_meow.mp3');
    meowAudio.preload = 'auto';
    meowAudio.crossOrigin = 'anonymous';

    audioMusicSource = audioCtx.createMediaElementSource(bgMusic);
    audioMeowSource = audioCtx.createMediaElementSource(meowAudio);

    musicGain = audioCtx.createGain();
    meowGain = audioCtx.createGain();
    musicGain.gain.value = 0.16;
    meowGain.gain.value = 0.70;

    audioMusicSource.connect(musicGain);
    audioMeowSource.connect(meowGain);

    // 聽得到，也錄得到
    musicGain.connect(audioCtx.destination);
    musicGain.connect(audioDestination);
    meowGain.connect(audioCtx.destination);
    meowGain.connect(audioDestination);
  }

  if(audioCtx.state === 'suspended') await audioCtx.resume();
  return true;
}

async function toggleSound(){
  try{
    await ensureRecordingAudio();
    audioEnabled = !audioEnabled;

    if(musicGain) musicGain.gain.value = audioEnabled ? 0.16 : 0;
    if(meowGain) meowGain.gain.value = audioEnabled ? 0.70 : 0;

    $('soundBtn').textContent = audioEnabled ? '🔊' : '🔇';
    $('soundBtn').title = audioEnabled ? '關閉聲音' : '開啟聲音';

    if(audioEnabled && bgMusic){
      bgMusic.play().catch(()=>{});
    }else{
      bgMusic?.pause();
    }
  }catch(e){
    audioEnabled = false;
    $('soundBtn').textContent = '🔇';
    $('soundBtn').title = '請確認音效檔案存在';
    log('音效未啟用：' + e.message);
  }
}

function triggerCatSound(){
  if(!audioEnabled || !meowAudio || !audioCtx) return;
  meowAudio.currentTime = 0;
  meowAudio.play().catch(()=>{});
}

async function toggleRecording(){
  if(!arStarted){log('請先啟動 AR');return;}
  if(recording){recorder.stop();return;}
  if(!recordCanvas.captureStream || !window.MediaRecorder){log('❌ 此瀏覽器不支援錄影');return;}

  const mime = supportedMime();
  try{
    await ensureRecordingAudio();
    const videoStream = recordCanvas.captureStream(30);
    const mixedStream = new MediaStream([
      ...videoStream.getVideoTracks(),
      ...audioDestination.stream.getAudioTracks()
    ]);
    recorder = mime ? new MediaRecorder(mixedStream,{mimeType:mime}) : new MediaRecorder(mixedStream);
  }catch(e){log(`❌ 錄影初始化：${e.message}`);return}

  chunks=[];
  recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
  recorder.onstop=()=>{
    const type=recorder.mimeType||mime||'video/webm';
    recordedBlob=new Blob(chunks,{type});
    bgMusic?.pause();
    if(bgMusic) bgMusic.currentTime=0;
    if(recordedUrl) URL.revokeObjectURL(recordedUrl);
    recordedUrl=URL.createObjectURL(recordedBlob);
    $('recordPreview').src=recordedUrl;
    recording=false;
    $('recordBtn').classList.remove('recording');
    $('recordBtn').textContent='●'; $('recordBtn').title='開始錄影';
    $('downloadBtn').classList.remove('hidden');
    $('guideTitle').textContent='🎬 錄影完成';
    $('guideText').textContent='點擊 💾 儲存影片到手機';
    $('interactionGuide').classList.add('active');
    log('✅ 錄影完成');
  };
  recorder.start(1000);
  recording=true;
  bgMusic?.play().catch(()=>{});
  $('recordBtn').classList.add('recording');
  $('recordBtn').textContent='■'; $('recordBtn').title='停止錄影';
  $('downloadBtn').classList.add('hidden');
  log(`🔴 開始錄影：${mime||'瀏覽器格式'}`);
  recordFrame();
}
function saveVideo(){
  if(!recordedBlob){log('目前沒有可儲存的影片');return}
  const ext=recordedBlob.type.includes('mp4')?'mp4':'webm';
  const url=recordedUrl || URL.createObjectURL(recordedBlob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`AR_cat_${Date.now()}.${ext}`;
  a.rel='noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  if(!recordedUrl) setTimeout(()=>URL.revokeObjectURL(url),3000);
  log('💾 影片下載已觸發');
}
function snapshot(){
  if(!arStarted){log('請先啟動 AR');return}
  updateRecordCanvas();
  recordCanvas.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`AR_cat_${Date.now()}.jpg`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    log('📸 照片已儲存');
  },'image/jpeg',0.95);
}

/* =========================
   影片結束
========================= */
testVideo.addEventListener('ended',async()=>{
  if(currentState==='normal'){
    if(detectRawState()==='normal') await playCat(nextNormalVideo());
    return;
  }

  // 互動影片只播放一次；保持動作不重播，等使用者回到 normal
  if(detectRawState()==='normal'){
    currentState='normal';
    updateGuide('normal');
    await playCat(nextNormalVideo());
  }else{
    log('互動影片完成，等待下一個動作');
  }
});

/* =========================
   AR Loop
========================= */
async function arLoop(ts){
  if(!arStarted)return;

  drawAR();

  const mouth=mouthOpen();
  const hand=handOpen();

  if(faceLandmarks){
    const raw=detectRawState();
    const state=getStableState(raw);

    if(state!==currentState && !changingVideo && performance.now()-lastActionAt>ACTION_COOLDOWN_MS){
      lastActionAt=performance.now();
      await changeARVideo(state);
    }
  }else{
    // 沒臉時不要讓上一支互動影片永遠卡住
    if(currentState!=='normal' && !changingVideo){
      currentState='normal';
      updateGuide('normal');
    }
  }

  if(ts-lastProcess>=PROCESS_INTERVAL_MS){
    lastProcess=ts;
    try{
      await faceMesh.send({image:video});
      await hands.send({image:video});
    }catch(e){
      log(`❌ AI 偵測：${e.message}`);
    }
  }

  requestAnimationFrame(arLoop);
}

/* =========================
   Start
========================= */
$('startBtn').onclick=async()=>{
  const localhost=location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!window.isSecureContext && !localhost){
    $('liveText').textContent = '需要 HTTPS';
    return;
  }

  $('startBtn').disabled=true;
  $('startBtn').textContent='⏳ 啟動相機…';

  try{
    await startCamera();
    try{
      await ensureRecordingAudio();
      audioEnabled = true;
      musicGain.gain.value = 0.16;
      meowGain.gain.value = 0.70;
      $('soundBtn').textContent = '🔊';
      bgMusic?.play().catch(()=>{});
    }catch(e){
      audioEnabled = false;
      $('soundBtn').textContent = '🔇';
      $('soundBtn').title = '音效檔案尚未加入';
      log('音效檔案未啟用：' + e.message);
    }
    arStarted=true;
    $('startOverlay').classList.add('hidden');
    $('liveText').textContent = 'LIVE';

    currentState='normal';
    normalIndex=0;
    await playCat(nextNormalVideo());

    updateGuide('normal');
    requestAnimationFrame(arLoop);
    log('🐱 AR 互動模式啟動完成');
  }catch(e){
    $('liveText').textContent = '啟動失敗';
    log(`❌ 相機：${e.name||e.message}`);
    $('startBtn').disabled=false;
    $('startBtn').textContent='📷 開始玩';
  }
};

$('recordBtn').onclick=toggleRecording;
$('snapshotBtn').onclick=snapshot;
$('downloadBtn').onclick=saveVideo;
$('switchBtn').onclick=switchCamera;
