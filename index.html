<script>

'use strict';


/* =====================================================
   9 部影片
===================================================== */

const VIDEO_GROUPS = {

  normal: [
    'spider_cat_animation.mp4',
    'champion_cat_animation.mp4',
    'magic_cat_animation.mp4',
    'sleep_cat_animation.mp4'
  ],

  mouthOpen: [
    'chef_cat_animation.mp4',
    'eat_cat_animation.mp4',
    'drink_cat_animation.mp4'
  ],

  handOpen: [
    'cry_cat_animation.mp4.mp4',
    'work_cat_animation.mp4'
  ]

};


const ALL_VIDEOS = [
  ...new Set([
    ...VIDEO_GROUPS.normal,
    ...VIDEO_GROUPS.mouthOpen,
    ...VIDEO_GROUPS.handOpen
  ])
];


const $ = id => document.getElementById(id);


const video = $('webcam');

const canvas = $('output');

const ctx = canvas.getContext('2d',{
  willReadFrequently:false
});

const testVideo = $('testVideo');

const recordPreview = $('recordPreview');


let stream = null;

let facingMode = 'user';

let arStarted = false;

let faceLandmarks = null;

let handLandmarks = null;


/*
  重要：

  null = 尚未建立 AR 狀態

  不再一開始就使用 "normal"。

  這樣 AR 啟動後可以明確執行：
  第一次狀態初始化 → 播放第一支影片
*/

let currentState = null;

let currentVideo = '';

let normalIndex = 0;

let lastProcess = 0;


/* 防止同一時間重複切換影片 */

let changingVideo = false;


/* =====================================================
   錄影
===================================================== */

let recording = false;

let recorder = null;

let chunks = [];

let recordedBlob = null;

let recordedUrl = null;

let recordCanvas =
  document.createElement('canvas');

let recordCtx =
  recordCanvas.getContext('2d');


/* =====================================================
   美膚
===================================================== */

let beautyStrength = 65;


/* =====================================================
   Log
===================================================== */

function log(msg){

  const time =
    new Date().toLocaleTimeString();

  $('log').textContent +=
    `[${time}] ${msg}\n`;

  $('log').scrollTop =
    $('log').scrollHeight;

  console.log(msg);

}


function setStatus(id,text,cls='info'){

  const el = $(id);

  el.textContent = text;

  el.className = cls;

}


function overall(text,cls='info'){

  $('overall').textContent = text;

  $('overall').className = cls;

}


/* =====================================================
   HTTPS
===================================================== */

function diagnoseEnvironment(){

  const localhost =
    location.hostname === 'localhost' ||
    location.hostname === '127.0.0.1';

  const secure =
    window.isSecureContext || localhost;


  if(secure){

    setStatus(
      'secureStatus',
      '✅ HTTPS / 安全來源',
      'ok'
    );

    log('HTTPS OK');

  }else{

    setStatus(
      'secureStatus',
      '❌ 需要 HTTPS',
      'bad'
    );

    log('❌ 請使用 GitHub Pages HTTPS');

  }

}


/* =====================================================
   FaceMesh
===================================================== */

const faceMesh = new FaceMesh({

  locateFile:file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`

});


faceMesh.setOptions({

  maxNumFaces:1,

  refineLandmarks:true,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


faceMesh.onResults(results => {

  faceLandmarks =
    results.multiFaceLandmarks?.[0] || null;


  if(faceLandmarks){

    setStatus(
      'faceStatus',
      '✅ 偵測到人臉',
      'ok'
    );

  }else{

    setStatus(
      'faceStatus',
      '⚪ 等待人臉',
      'wait'
    );

  }

});


/* =====================================================
   Hands
===================================================== */

const hands = new Hands({

  locateFile:file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


hands.onResults(results => {

  handLandmarks =
    results.multiHandLandmarks?.[0] || null;


  if(handLandmarks){

    setStatus(
      'handStatus',
      '✅ 偵測到手',
      'ok'
    );

  }else{

    setStatus(
      'handStatus',
      '⚪ 未偵測到手',
      'wait'
    );

  }

});


/* =====================================================
   Camera
===================================================== */

async function startCamera(){

  if(!navigator.mediaDevices?.getUserMedia){

    throw new Error(
      'getUserMedia 不支援'
    );

  }


  if(stream){

    stream.getTracks()
      .forEach(t => t.stop());

  }


  stream =
    await navigator.mediaDevices.getUserMedia({

      audio:false,

      video:{
        facingMode:facingMode,

        width:{ideal:1280},

        height:{ideal:720},

        frameRate:{
          ideal:30,
          max:30
        }

      }

    });


  video.srcObject = stream;

  await video.play();


  resizeCanvas();


  setStatus(
    'cameraStatus',
    '✅ 相機已開啟',
    'ok'
  );


  log('相機啟動成功');

}


/* =====================================================
   Switch Camera
===================================================== */

async function switchCamera(){

  if(!arStarted)
    return;


  facingMode =
    facingMode === 'user'
      ? 'environment'
      : 'user';


  try{

    await startCamera();

    log(
      `鏡頭已切換：${
        facingMode === 'user'
          ? '前鏡頭'
          : '後鏡頭'
      }`
    );

  }catch(e){

    log(
      `❌ 切換鏡頭失敗：${e.message}`
    );

  }

}


/* =====================================================
   Canvas
===================================================== */

function resizeCanvas(){

  const w =
    video.videoWidth || 640;

  const h =
    video.videoHeight || 480;


  if(
    canvas.width !== w ||
    canvas.height !== h
  ){

    canvas.width = w;

    canvas.height = h;

    recordCanvas.width = w;

    recordCanvas.height = h;


    setStatus(
      'canvasStatus',
      `✅ ${w}×${h}`,
      'ok'
    );

  }

}


/* =====================================================
   嘴巴判斷
===================================================== */

function mouthOpen(){

  if(!faceLandmarks)
    return false;


  const upper =
    faceLandmarks[13];

  const lower =
    faceLandmarks[14];


  return !!upper &&
         !!lower &&
         Math.abs(
           lower.y-upper.y
         ) > .045;

}


/* =====================================================
   手掌判斷
===================================================== */

function handOpen(){

  if(!handLandmarks)
    return false;


  const fingers = [

    handLandmarks[8].y <
    handLandmarks[6].y,

    handLandmarks[12].y <
    handLandmarks[10].y,

    handLandmarks[16].y <
    handLandmarks[14].y,

    handLandmarks[20].y <
    handLandmarks[18].y

  ];


  return fingers.filter(Boolean).length >= 3;

}


/* =====================================================
   動作狀態
===================================================== */

function detectState(){

  /*
    優先順序：

    1. 張嘴
    2. 張開手掌
    3. 一般

    保持與原本 use_this.md 相同。
  */

  if(mouthOpen())
    return 'mouthOpen';


  if(handOpen())
    return 'handOpen';


  return 'normal';

}


/* =====================================================
   取得下一支一般影片
===================================================== */

function nextNormalVideo(){

  const name =
    VIDEO_GROUPS.normal[
      normalIndex %
      VIDEO_GROUPS.normal.length
    ];


  normalIndex++;


  return name;

}


/* =====================================================
   播放貓咪影片
===================================================== */

async function playCat(name){

  if(!name)
    return;


  /*
    防止 MediaPipe 同一時間連續觸發多次。
  */

  if(changingVideo)
    return;


  /*
    同一支影片不重新播放。

    這一點非常重要：

    如果目前是 normal，
    即使 AR Loop 每秒偵測很多次 normal，
    也不會重新載入第一支影片。
  */

  if(
    currentVideo === name &&
    testVideo.src
  ){

    return;

  }


  changingVideo = true;


  try{

    /*
      停止上一支影片。
    */

    testVideo.pause();


    /*
      每次換影片都從 0 秒開始。
    */

    try{
      testVideo.currentTime = 0;
    }catch(e){}


    currentVideo = name;


    $('currentVideoText').textContent =
      name;


    setStatus(
      'catStatus',
      `⏳ 載入 ${name}`,
      'wait'
    );


    log(
      `🐱 切換影片：${name}`
    );


    /*
      清除舊 src。
    */

    testVideo.removeAttribute('src');

    testVideo.load();


    await new Promise(resolve =>
      setTimeout(resolve,30)
    );


    /*
      使用相對路徑，
      適合 GitHub Pages。
    */

    testVideo.src =
      `./${name}`;


    testVideo.load();


    /*
      等待影片真正可以播放。
    */

    await new Promise((resolve,reject)=>{

      let finished = false;


      const cleanup = () => {

        testVideo.removeEventListener(
          'loadeddata',
          onLoaded
        );

        testVideo.removeEventListener(
          'canplay',
          onCanPlay
        );

        testVideo.removeEventListener(
          'error',
          onError
        );

      };


      const success = () => {

        if(finished)
          return;

        finished = true;

        cleanup();

        resolve();

      };


      const onLoaded = () => {

        success();

      };


      const onCanPlay = () => {

        success();

      };


      const onError = () => {

        if(finished)
          return;

        finished = true;

        cleanup();

        reject(
          new Error('影片載入失敗')
        );

      };


      testVideo.addEventListener(
        'loadeddata',
        onLoaded
      );


      testVideo.addEventListener(
        'canplay',
        onCanPlay
      );


      testVideo.addEventListener(
        'error',
        onError
      );

    });


    /*
      確保每一支新影片從頭開始。
    */

    testVideo.currentTime = 0;


    setStatus(
      'catStatus',
      `✅ ${name}`,
      'ok'
    );


    /*
      AR 啟動是由使用者按鈕觸發，
      因此這裡可以正常 play。
    */

    try{

      await testVideo.play();

      log(
        `▶️ 開始播放：${name}`
      );

    }catch(e){

      log(
        `⚠️ 播放被瀏覽器阻擋：${e.name}`
      );

    }


  }catch(e){

    log(
      `❌ 影片載入失敗：${name} / ${e.message}`
    );


    setStatus(
      'catStatus',
      `❌ ${name}`,
      'bad'
    );


  }finally{

    changingVideo = false;

  }

}


/* =====================================================
   動作 → 影片
===================================================== */

async function changeARVideo(state){

  /*
    最重要的修正：

    currentState === null
    代表「AR 剛開始，還沒有狀態」。

    這時候一定要播放第一支一般影片。

    不會因為等待狀態而卡住。
  */

  if(
    currentState === state &&
    currentVideo
  ){

    return;

  }


  /*
    只有狀態真的改變才進來。
  */

  const previousState =
    currentState;


  currentState = state;


  let name;


  if(state === 'mouthOpen'){

    name =
      VIDEO_GROUPS.mouthOpen[
        Math.floor(
          Math.random() *
          VIDEO_GROUPS.mouthOpen.length
        )
      ];

  }


  else if(state === 'handOpen'){

    name =
      VIDEO_GROUPS.handOpen[
        Math.floor(
          Math.random() *
          VIDEO_GROUPS.handOpen.length
        )
      ];

  }


  else{

    /*
      一般狀態：

      第一次進入 AR：
      normalIndex = 0
      → spider

      後續「重新回到一般狀態」：
      → champion
      → magic
      → sleep
      → spider
      ...

      但如果一直維持一般狀態，
      不會再呼叫這裡。
    */

    name =
      nextNormalVideo();

  }


  log(
    `🎯 動作狀態：${
      previousState || '尚未建立'
    } → ${state}`
  );


  await playCat(name);

}


/* =====================================================
   臉部範圍
===================================================== */

function getFaceBox(){

  if(!faceLandmarks)
    return null;


  let minX = 1;

  let maxX = 0;

  let minY = 1;

  let maxY = 0;


  for(const p of faceLandmarks){

    minX =
      Math.min(minX,p.x);

    maxX =
      Math.max(maxX,p.x);

    minY =
      Math.min(minY,p.y);

    maxY =
      Math.max(maxY,p.y);

  }


  return {

    minX,
    maxX,
    minY,
    maxY,

    width:
      (maxX-minX) *
      canvas.width,

    height:
      (maxY-minY) *
      canvas.height,

    centerX:
      ((minX+maxX)/2) *
      canvas.width,

    centerY:
      ((minY+maxY)/2) *
      canvas.height,

    topY:
      minY *
      canvas.height

  };

}


/* =====================================================
   美膚
===================================================== */

function drawBeauty(){

  if(
    !faceLandmarks ||
    beautyStrength <= 0
  ){

    return;

  }


  const box =
    getFaceBox();


  if(!box)
    return;


  const padX =
    box.width * .18;


  const padY =
    box.height * .22;


  const x =
    Math.max(
      0,
      box.minX * canvas.width - padX
    );


  const y =
    Math.max(
      0,
      box.minY * canvas.height - padY
    );


  const w =
    Math.min(
      canvas.width-x,
      box.width+padX*2
    );


  const h =
    Math.min(
      canvas.height-y,
      box.height+padY*2
    );


  ctx.save();


  ctx.globalAlpha =
    0.12 +
    (beautyStrength/100)*.30;


  ctx.filter =
    `blur(${2 + beautyStrength*.045}px)`;


  ctx.drawImage(
    canvas,
    x,
    y,
    w,
    h,
    x,
    y,
    w,
    h
  );


  ctx.filter =
    'none';


  ctx.globalAlpha =
    (beautyStrength/100)*.16;


  ctx.filter =
    `blur(${1 + beautyStrength*.025}px)`;


  ctx.drawImage(
    canvas,
    x,
    y,
    w,
    h,
    x,
    y,
    w,
    h
  );


  ctx.restore();

}


/* =====================================================
   貓咪頭頂
===================================================== */

function drawCat(){

  if(
    !faceLandmarks ||
    testVideo.readyState <
      HTMLMediaElement.HAVE_CURRENT_DATA
  ){

    return;

  }


  const box =
    getFaceBox();


  if(!box)
    return;


  /*
    貓咪維持在頭頂。
    避免遮住臉。
  */

  const size =
    box.width * .62;


  const x =
    box.centerX -
    size/2;


  const y =
    box.topY -
    size*.78;


  ctx.save();


  ctx.globalAlpha = 1;


  ctx.drawImage(
    testVideo,
    x,
    y,
    size,
    size
  );


  ctx.restore();

}


/* =====================================================
   AR 畫面
===================================================== */

function drawAR(){

  if(!video.videoWidth)
    return;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    相機鏡像
  */

  ctx.save();


  ctx.translate(
    canvas.width,
    0
  );


  ctx.scale(-1,1);


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();


  /*
    美膚
  */

  drawBeauty();


  /*
    貓咪
  */

  drawCat();


  setStatus(
    'canvasStatus',
    '✅ AR 正在運作',
    'ok'
  );

}


/* =====================================================
   錄影畫面
===================================================== */

function updateRecordCanvas(){

  const w =
    video.videoWidth || 640;


  const h =
    video.videoHeight || 480;


  if(
    recordCanvas.width !== w ||
    recordCanvas.height !== h
  ){

    recordCanvas.width = w;

    recordCanvas.height = h;

  }


  recordCtx.clearRect(
    0,
    0,
    w,
    h
  );


  recordCtx.drawImage(
    canvas,
    0,
    0,
    w,
    h
  );

}


/* =====================================================
   錄影 Loop
===================================================== */

function recordFrame(){

  if(!recording)
    return;


  updateRecordCanvas();


  requestAnimationFrame(
    recordFrame
  );

}


/* =====================================================
   MediaRecorder
===================================================== */

function supportedMime(){

  if(!window.MediaRecorder)
    return '';


  const types = [

    'video/mp4;codecs=avc1.42E01E',

    'video/mp4',

    'video/webm;codecs=vp9',

    'video/webm;codecs=vp8',

    'video/webm'

  ];


  return types.find(type =>
    MediaRecorder.isTypeSupported?.(type)
  ) || '';

}


/* =====================================================
   錄影
===================================================== */

$('recordBtn').onclick = () => {

  if(!arStarted){

    log('請先啟動 AR');

    return;

  }


  if(recording){

    recorder.stop();

    return;

  }


  if(
    !recordCanvas.captureStream ||
    !window.MediaRecorder
  ){

    log(
      '❌ 此瀏覽器不支援錄影'
    );

    return;

  }


  const capture =
    recordCanvas.captureStream(30);


  const mime =
    supportedMime();


  try{

    recorder =
      mime
        ? new MediaRecorder(
            capture,
            {mimeType:mime}
          )
        : new MediaRecorder(capture);

  }catch(e){

    log(
      `❌ MediaRecorder 建立失敗：${e.message}`
    );

    return;

  }


  chunks = [];


  recorder.ondataavailable =
    e => {

      if(e.data?.size){

        chunks.push(e.data);

      }

    };


  recorder.onstop = () => {

    const type =
      recorder.mimeType ||
      mime ||
      'video/webm';


    recordedBlob =
      new Blob(
        chunks,
        {type}
      );


    if(recordedUrl){

      URL.revokeObjectURL(
        recordedUrl
      );

    }


    recordedUrl =
      URL.createObjectURL(
        recordedBlob
      );


    recordPreview.src =
      recordedUrl;


    recordPreview.style.display =
      'block';


    $('saveVideoBtn')
      .classList.add('show');


    recording = false;


    $('recordBtn').textContent =
      '🔴 開始錄影';


    $('recordBtn')
      .classList.remove('recording');


    log(
      `✅ 錄影完成：${type}`
    );

  };


  recorder.start(1000);


  recording = true;


  $('recordBtn').textContent =
    '⏹ 停止錄影';


  $('recordBtn')
    .classList.add('recording');


  $('saveVideoBtn')
    .classList.remove('show');


  log(
    `🔴 開始錄影：${mime || '瀏覽器格式'}`
  );


  recordFrame();

};


/* =====================================================
   儲存影片
===================================================== */

$('saveVideoBtn').onclick = () => {

  if(!recordedBlob){

    log(
      '目前沒有可儲存的影片'
    );

    return;

  }


  const type =
    recordedBlob.type ||
    'video/webm';


  const extension =
    type.includes('mp4')
      ? 'mp4'
      : 'webm';


  const url =
    URL.createObjectURL(
      recordedBlob
    );


  const a =
    document.createElement('a');


  a.href = url;


  a.download =
    `AR_cat_${Date.now()}.${extension}`;


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () => URL.revokeObjectURL(url),
    3000
  );


  log(
    '💾 影片已送出儲存'
  );

};


/* =====================================================
   拍照
===================================================== */

$('snapshotBtn').onclick = () => {

  if(!arStarted){

    log(
      '請先啟動 AR'
    );

    return;

  }


  updateRecordCanvas();


  recordCanvas.toBlob(
    blob => {

      if(!blob)
        return;


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement('a');


      a.href = url;


      a.download =
        `AR_cat_${Date.now()}.jpg`;


      document.body.appendChild(a);

      a.click();

      a.remove();


      setTimeout(
        () => URL.revokeObjectURL(url),
        2000
      );


      log(
        '📸 照片已儲存'
      );

    },
    'image/jpeg',
    .94
  );

};


/* =====================================================
   9 部影片測試按鈕
===================================================== */

function buildVideoTests(){

  const box =
    $('videoTests');


  ALL_VIDEOS.forEach(name => {

    const btn =
      document.createElement('button');


    btn.className =
      'videoBtn';


    btn.textContent =
      `▶ ${name
        .replace('_animation.mp4','')
        .replace('.mp4','')}`;


    btn.onclick =
      async () => {

        await playCat(name);

        btn.classList.add('ok');

      };


    box.appendChild(btn);

  });

}


/* =====================================================
   AR 主迴圈
===================================================== */

async function arLoop(ts){

  if(!arStarted)
    return;


  resizeCanvas();


  /*
    先畫目前 AR 畫面。
  */

  drawAR();


  const m =
    mouthOpen();


  const h =
    handOpen();


  $('mouthText').textContent =
    faceLandmarks
      ? (m ? '👄 張嘴' : '閉嘴')
      : '未偵測';


  $('handText').textContent =
    handLandmarks
      ? (h ? '✋ 張開手掌' : '手掌未完全張開')
      : '未偵測';


  /*
    =====================================================
    核心修正
    =====================================================

    只有「偵測到人臉」後才建立動作狀態。

    第一次偵測到人臉：

      currentState = null
      state = normal

      → changeARVideo('normal')
      → 播放第一支一般影片

    下一幀：

      currentState = normal
      state = normal

      → 不做任何事

    因此不會一直重新播放第一支。
  */

  if(faceLandmarks){

    const state =
      detectState();


    $('stateText').textContent =

      state === 'mouthOpen'
        ? '👄 張嘴'

      : state === 'handOpen'
        ? '✋ 張開手掌'

      : '😺 一般';


    if(
      currentState !== state
    ){

      await changeARVideo(
        state
      );

    }

  }


  /*
    MediaPipe 不需要每一個畫面都送，
    降低手機負載。
  */

  if(
    ts-lastProcess >= 70
  ){

    lastProcess = ts;


    try{

      await faceMesh.send({
        image:video
      });


      await hands.send({
        image:video
      });

    }catch(e){

      log(
        `⚠️ MediaPipe 錯誤：${e.message}`
      );

    }

  }


  requestAnimationFrame(
    arLoop
  );

}


/* =====================================================
   美膚滑桿
===================================================== */

$('beautyRange').addEventListener(
  'input',
  e => {

    beautyStrength =
      Number(e.target.value);


    $('beautyValue').textContent =
      beautyStrength;

  }
);


/* =====================================================
   啟動 AR
===================================================== */

$('startBtn').onclick =
  async () => {

    diagnoseEnvironment();


    if(
      !window.isSecureContext &&
      location.hostname !== 'localhost' &&
      location.hostname !== '127.0.0.1'
    ){

      overall(
        '❌ 請使用 GitHub Pages HTTPS',
        'bad'
      );

      return;

    }


    try{

      /*
        ① 先開相機
      */

      await startCamera();


      /*
        ② AR 啟動
      */

      arStarted = true;


      /*
        ③ 非常重要：

        不要把 currentState 設成 normal。

        保持 null。

        讓 arLoop 第一次偵測到人臉時：

        null → normal

        觸發第一支一般影片。
      */

      currentState = null;

      currentVideo = '';

      normalIndex = 0;


      $('startOverlay')
        .classList.add('hidden');


      overall(
        '🟢 AR 已啟動，等待人臉並立即開始',
        'ok'
      );


      /*
        ④ 立即先播放第一支一般影片。

        這樣即使 MediaPipe 還沒完成第一次人臉偵測，
        AR 畫面也不會是「等待影片」。
      */

      await playCat(
        VIDEO_GROUPS.normal[0]
      );


      /*
        已經播放第一支，
        所以 normalIndex 要往下一支。
      */

      normalIndex = 1;


      /*
        設定初始狀態。

        這樣之後保持一般狀態時，
        不會再次播放 spider。
      */

      currentState = 'normal';


      /*
        ⑤ 開始 AR Loop
      */

      requestAnimationFrame(
        arLoop
      );


      log(
        '🐱 AR V5 啟動完成'
      );

      log(
        '▶️ 初始影片：spider_cat_animation.mp4'
      );

      log(
        'ℹ️ 一般狀態維持不變時，不會重新播放影片'
      );


    }catch(e){

      overall(
        `❌ 啟動失敗：${e.name || e.message}`,
        'bad'
      );


      setStatus(
        'cameraStatus',
        `❌ ${e.name || e.message}`,
        'bad'
      );


      log(
        `❌ 相機啟動失敗：${e.name || e.message}`
      );

    }

  };

$('cameraSwitchBtn')

);

testVideo.loop = false;


/*
  影片播完只停下來。

  絕對不自動播放下一支。

  必須等到偵測到新的動作狀態，
  才會換影片。
*/

);

);

);

);


log(

);

);
