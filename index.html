<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>戴口罩也能辨識的 AR 貓咪濾鏡與錄影</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* 確保視訊與畫布正確疊代與全螢幕覆蓋 */
    #webcam, #output-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #webcam {
      z-index: 1;
      transform: scaleX(-1); /* 鏡像翻轉，符合自拍習慣 */
    }

    #output-canvas {
      z-index: 2;
      pointer-events: none; /* 讓點擊事件可以穿透 */
      transform: scaleX(-1);
    }

    /* 頂部標題橫幅 */
    #custom-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 105, 180, 0.85);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 控制按鈕介面 */
    #controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 1000;
    }

    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #ff9800;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    #record-btn {
      background: #ff9800;
    }
  </style>
</head>
<body>

  <div id="custom-banner">✨ 戴口罩 AR 貓咪濾鏡體驗中</div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output-canvas"></canvas>

  <div id="controls">
    <button id="record-btn" class="btn">🔴 開始錄影</button>
    <button id="snapshot-btn" class="btn" style="background: #4CAF50;">📸 拍照存檔</button>
  </div>

  <img id="cat-asset" src="chef_cat_animation.png" style="display: none;" alt="Cat Animation">

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const recordBtn = document.getElementById('record-btn');
    const snapshotBtn = document.getElementById('snapshot-btn');
    const catImg = document.getElementById('cat-asset');

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let latestDetections = [];

    // 初始化 MediaPipe Face Detection（支援戴口罩辨識）
    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({
      model: 'short', // 適用於自拍近距離
      minDetectionConfidence: 0.5
    });

    faceDetection.onResults((results) => {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;
      
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      latestDetections = results.detections || [];

      // 繪製頭頂貓咪動畫邏輯
      for (const detection of latestDetections) {
        const bbox = detection.boundingBox;
        
        // 將相對座標轉換為畫布實際像素
        const x = bbox.xCenter * canvasElement.width;
        const y = bbox.yCenter * canvasElement.height;
        const w = bbox.width * canvasElement.width;
        const h = bbox.height * canvasElement.height;

        // 計算頭頂位置（在偵測框上方偏移一些距離）
        const catWidth = w * 1.2;
        const catHeight = w * 1.2;
        const catX = x - catWidth / 2;
        const catY = y - h / 2 - catHeight * 0.8; // 位於頭頂上方

        // 畫上 Q 版貓咪動畫/圖片
        if (catImg.complete) {
          canvasCtx.drawImage(catImg, catX, catY, catWidth, catHeight);
        }
      }
    });

    // 啟動相機串流
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceDetection.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();

    // ==========================================
    // 關鍵解決方案：建立「隱藏合成畫布」以支援完整錄影與拍照
    // ==========================================
    const combinedCanvas = document.createElement('canvas');
    const combinedCtx = combinedCanvas.getContext('2d');

    function updateCombinedCanvas() {
      combinedCanvas.width = videoElement.videoWidth || 640;
      combinedCanvas.height = videoElement.videoHeight || 480;

      // 1. 先畫入底層的鏡頭畫面（同時處理鏡像翻轉，確保錄影畫面與預覽一致）
      combinedCtx.save();
      combinedCtx.scale(-1, 1);
      combinedCtx.drawImage(videoElement, -combinedCanvas.width, 0, combinedCanvas.width, combinedCanvas.height);
      combinedCtx.restore();

      // 2. 再疊加上層的 AR 貓咪動畫圖層
      combinedCtx.drawImage(canvasElement, 0, 0, combinedCanvas.width, combinedCanvas.height);
    }

    // --- 錄影功能 ---
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        recordedChunks = [];
        // 從合成畫布中取得資料流 (FPS 設定為 30)
        const stream = combinedCanvas.captureStream(30);
        
        try {
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
        } catch (e) {
          mediaRecorder = new MediaRecorder(stream); // 兼容性備援
        }

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'chef_cat_animation.webm';
          a.click();
          URL.revokeObjectURL(url);
        };

        // 定時更新合成畫面給錄影機
        window.recordInterval = setInterval(updateCombinedCanvas, 1000 / 30);
        mediaRecorder.start();
        isRecording = true;
        recordBtn.innerText = '⏹️ 停止錄影';
        recordBtn.style.backgroundColor = '#f44336';
      } else {
        mediaRecorder.stop();
        clearInterval(window.recordInterval);
        isRecording = false;
        recordBtn.innerText = '🔴 開始錄影';
        recordBtn.style.backgroundColor = '#ff9800';
      }
    });

    // --- 拍照存檔功能 ---
    snapshotBtn.addEventListener('click', () => {
      updateCombinedCanvas();
      const dataURL = combinedCanvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataURL;
      a.download = 'ar_cat_photo.png';
      a.click();
    });
  </script>
</body>
</html>
